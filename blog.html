<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lachlan Mackenzie – Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="description" content="Thoughts on design, leadership and human‑centred work.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lachlan Mackenzie – Blog">
  <meta property="og:description" content="Thoughts on design, leadership and human‑centred work.">
  <meta property="og:image" content="https://lachlanmackenzie.me/assets/blog/header.png">
  <meta property="og:url" content="https://lachlanmackenzie.me/blog.html">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Lachlan Mackenzie – Blog",
    "url": "https://lachlanmackenzie.me/blog.html",
    "description": "Insights on design, leadership and human-centred work.",
    "publisher": {"@type": "Person", "name": "Lachlan Mackenzie"}
  }
  </script>
  <style>
    .tag { @apply inline-flex items-center px-3 py-1 rounded-full bg-gray-800 text-sm cursor-pointer; }
    .tag.active { @apply bg-pink-600; }
    .card { @apply bg-gray-900 rounded-2xl overflow-hidden flex flex-col; }
    .card img { @apply w-full h-48 object-cover; }
    .modal-open { overflow: hidden; }
    .prose a { color: #60a5fa; text-decoration: underline; }
  </style>
</head>
<body class="bg-black text-white">
  <header class="sticky top-0 z-40 backdrop-blur bg-black/70 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-bold tracking-wide">← Home</a>
      <h1 class="text-xl md:text-2xl font-bold">Blog</h1>
      <div></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <!-- Controls -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
      <div class="relative w-full md:w-1/2">
        <input id="search" type="search" placeholder="Search posts…"
          class="w-full rounded-xl bg-gray-900 border border-white/10 px-4 py-3 pr-10 focus:outline-none"
          aria-label="Search posts">
        <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>
      <div id="tag-row" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Grid -->
    <section id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

    <!-- Empty state -->
    <div id="empty" class="hidden text-center py-20 text-gray-400">No posts match that search.</div>
  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4" aria-hidden="true">
    <article class="bg-gray-900 rounded-2xl max-w-3xl w-full max-h-[85vh] overflow-auto relative">
      <button id="close" class="absolute top-4 right-4 text-gray-400 hover:text-white" aria-label="Close">
        <i class="fas fa-times text-2xl"></i>
      </button>
      <img id="m-img" class="w-full h-60 object-cover rounded-t-2xl" alt="">
      <div class="p-6">
        <header class="mb-4">
          <h2 id="m-title" class="text-2xl font-bold"></h2>
          <time id="m-date" class="text-sm text-gray-400"></time>
          <div id="m-tags" class="mt-3 flex flex-wrap gap-2"></div>
        </header>
        <div id="m-content" class="prose prose-invert max-w-none"></div>
      </div>
    </article>
  </div>

  <script>
  const state = {
    all: [],
    filtered: [],
    activeTags: new Set(),
    q: ""
  };

  const els = {
    grid: document.getElementById('grid'),
    empty: document.getElementById('empty'),
    search: document.getElementById('search'),
    tags: document.getElementById('tag-row'),
    modal: document.getElementById('modal'),
    close: document.getElementById('close'),
    mImg: document.getElementById('m-img'),
    mTitle: document.getElementById('m-title'),
    mDate: document.getElementById('m-date'),
    mTags: document.getElementById('m-tags'),
    mContent: document.getElementById('m-content')
  };

  // Fetch posts
  fetch('assets/posts.json')
    .then(r => r.json())
    .then(data => {
      // pinned first, then by date desc
      data.sort((a, b) => {
        if ((b.pinned|0) - (a.pinned|0)) return (b.pinned|0) - (a.pinned|0);
        return (b.date || '').localeCompare(a.date || '');
      });
      state.all = data;
      renderTags();
      applyFilters();
      restoreFromHash();
    })
    .catch(err => {
      console.error(err);
      els.empty.textContent = "Couldn’t load posts.json";
      els.empty.classList.remove('hidden');
    });

  function renderTags() {
    const set = new Set();
    state.all.forEach(p => (p.tags||[]).forEach(t => set.add(t)));
    els.tags.innerHTML = "";
    [...set].sort().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag';
      btn.textContent = tag;
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => toggleTag(tag, btn);
      els.tags.appendChild(btn);
    });
  }

  function toggleTag(tag, btn) {
    if (state.activeTags.has(tag)) {
      state.activeTags.delete(tag);
      btn.classList.remove('active');
      btn.setAttribute('aria-pressed','false');
    } else {
      state.activeTags.add(tag);
      btn.classList.add('active');
      btn.setAttribute('aria-pressed','true');
    }
    applyFilters();
  }

  els.search.addEventListener('input', (e) => {
    state.q = e.target.value.toLowerCase();
    applyFilters();
  });

  function applyFilters() {
    const tags = state.activeTags;
    const q = state.q;
    state.filtered = state.all.filter(p => {
      const matchesTags = tags.size === 0 || (p.tags||[]).some(t => tags.has(t));
      const hay = (p.title + ' ' + (p.summary||'') + ' ' + (p.content||'')).toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesTags && matchesQ;
    });
    renderGrid();
  }

  function html(strings, ...vals) {
    return strings.map((s,i)=> s + (vals[i] ?? '')).join('');
  }

  function renderGrid() {
    els.grid.innerHTML = "";
    if (state.filtered.length === 0) {
      els.empty.classList.remove('hidden');
      return;
    }
    els.empty.classList.add('hidden');

    state.filtered.forEach(p => {
      const img = p.image && p.image.trim() ? p.image : '../assets/blog/placeholder.jpg';
      const el = document.createElement('article');
      el.className = 'card';
      el.innerHTML = html`
        <img src="${img}" alt="${p.title}">
        <div class="p-5 flex-1 flex flex-col">
          <div class="text-xs text-gray-400 mb-2">${(p.date||'').replace(/-/g,'/')}</div>
          <h2 class="text-xl font-bold mb-2">${p.title}</h2>
          <p class="text-gray-300 mb-4 line-clamp-3">${p.summary||''}</p>
          <div class="mt-auto flex items-center justify-between">
            <div class="flex flex-wrap gap-2">
              ${(p.tags||[]).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <button class="text-pink-400 font-semibold hover:underline" aria-label="Read ${p.title}">
              Read →
            </button>
          </div>
        </div>
      `;
      el.querySelector('button').onclick = () => openModal(p);
      els.grid.appendChild(el);
    });
  }

  function openModal(p) {
    const img = p.image && p.image.trim() ? p.image : '../assets/blog/placeholder.jpg';
    els.mImg.src = img;
    els.mImg.alt = p.title;
    els.mTitle.textContent = p.title;
    els.mDate.textContent = (p.date||'').replace(/-/g,'/');
    els.mTags.innerHTML = (p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');
    els.mContent.innerHTML = markedToHtml(p.content||''); // basic markdown → HTML
    els.modal.classList.remove('hidden');
    els.modal.classList.add('flex');
    document.body.classList.add('modal-open');
    location.hash = p.id || '';
  }

  function closeModal() {
    els.modal.classList.add('hidden');
    els.modal.classList.remove('flex');
    document.body.classList.remove('modal-open');
    if (location.hash) history.pushState("", document.title, window.location.pathname + window.location.search);
  }

  els.close.addEventListener('click', closeModal);
  els.modal.addEventListener('click', (e)=>{ if(e.target===els.modal) closeModal(); });
  window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

  function restoreFromHash() {
    const id = location.hash.replace('#','').trim();
    if (!id) return;
    const p = state.all.find(x => (x.id||'') === id);
    if (p) openModal(p);
  }

  // Tiny Markdown → HTML (headings, bold/italic, links, lists, paragraphs)
  function markedToHtml(md='') {
    let h = md
      .replace(/^### (.*)$/gm, '<h3 class="text-xl font-bold mt-6 mb-3">$1</h3>')
      .replace(/^## (.*)$/gm, '<h2 class="text-2xl font-bold mt-6 mb-3">$1</h2>')
      .replace(/^# (.*)$/gm, '<h1 class="text-3xl font-bold mt-6 mb-3">$1</h1>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(^|\n)- (.*)/g, '$1<li>$2</li>');
    h = h.replace(/(<li>.*<\/li>)(\s*(<li>.*<\/li>))+/gs, m => `<ul class="list-disc pl-5 space-y-1">${m}</ul>`);
    h = h.replace(/^(?!<h\d|<ul|<li|<p|<blockquote|<\/)(.+)$/gm, '<p>$1</p>');
    return h;
  }
  </script>
</body>
</html>
