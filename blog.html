<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicons & manifest from existing site (optional) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <!-- Page basics -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lachlan Mackenzie – Blog</title>

  <!-- CSS / icon libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom styles matching CV site -->
  <style>
    @keyframes float   { 0%{transform:translateY(0)} 50%{transform:translateY(-10px)} 100%{transform:translateY(0)} }
    .floating          { animation: float 6s ease-in-out infinite; }
    .text-outline      { -webkit-text-stroke: 1px #fff; color: transparent; }
    .gradient-text     { background: linear-gradient(90deg, #FF4D4D 0%, #F9CB28 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    a[href*="deepsite"], body > p:last-child { display: none !important; }
    .blog-tag { background: rgba(255,255,255,0.1); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; margin-right: 0.5rem; margin-bottom: 0.5rem; white-space: nowrap; }
    .blog-tag.active { background: linear-gradient(90deg, #FF4D4D 0%, #F9CB28 100%); color: #000; }
    .post-card { transition: all .3s ease; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    #post-modal { background: rgba(0,0,0,0.9); }
  </style>
</head>
<body class="bg-black text-white font-sans overflow-x-hidden">
  <!-- Navigation -->
  <nav class="fixed w-full z-50 py-6 px-6 md:px-12 flex justify-between items-center">
    <div class="text-2xl font-bold">
      <span class="text-outline">LACHLAN MACKENZIE</span>
    </div>
    <div class="hidden md:flex space-x-8">
      <a href="cvHome.html#about" class="hover:text-gray-300 transition">ABOUT ME</a>
      <a href="cvHome.html#career" class="hover:text-gray-300 transition">CAREER</a>
      <a href="cvHome.html#projects" class="hover:text-gray-300 transition">WORK</a>
      <a href="blog.html" class="gradient-text font-bold transition">BLOG</a>
      <a href="cvHome.html#contact" class="hover:text-gray-300 transition">CONTACT</a>
    </div>
    <div class="md:hidden">
      <button id="menu-toggle" class="text-white focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="fixed inset-0 bg-black z-40 flex flex-col items-center justify-center hidden">
    <button id="close-menu" class="absolute top-6 right-6 text-white text-2xl">
      <i class="fas fa-times"></i>
    </button>
    <div class="flex flex-col space-y-8 text-center">
      <a href="cvHome.html#about" class="text-3xl hover:text-gray-300 transition">ABOUT ME</a>
      <a href="cvHome.html#career" class="text-3xl hover:text-gray-300 transition">CAREER</a>
      <a href="cvHome.html#projects" class="text-3xl hover:text-gray-300 transition">WORK</a>
      <a href="blog.html" class="text-3xl gradient-text font-bold">BLOG</a>
      <a href="cvHome.html#contact" class="text-3xl hover:text-gray-300 transition">CONTACT</a>
    </div>
  </div>

  <!-- Hero Section -->
  <section class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-black to-transparent z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent z-10"></div>
    <div class="absolute inset-0 flex items-center justify-center z-10">
      <div class="text-[30vw] md:text-[20vw] font-bold opacity-5 text-white">LM</div>
    </div>
    <img src="assets/blog/header.png" alt="Blog header background" class="absolute inset-0 w-full h-full object-cover object-center z-0" />
    <div class="container mx-auto px-6 md:px-12 relative z-20 text-center">
      <h1 class="text-5xl md:text-8xl font-bold mb-6">
        <span class="text-outline">INSIGHTS &amp;</span>
        <span class="gradient-text block md:inline">STORIES</span>
      </h1>
      <p class="text-xl md:text-2xl max-w-3xl mx-auto mb-12">
        A collection of thoughts on design, leadership and life — exploring the ideas behind the work.
      </p>
    </div>
    <div class="absolute top-1/4 left-1/4 w-16 h-16 rounded-full bg-pink-500 opacity-20 floating"></div>
    <div class="absolute top-1/3 right-1/4 w-24 h-24 rounded-full bg-yellow-500 opacity-20 floating"></div>
    <div class="absolute bottom-1/4 left-1/3 w-20 h-20 rounded-full bg-blue-500 opacity-20 floating"></div>
    <div class="absolute bottom-1/3 right-1/3 w-12 h-12 rounded-full bg-green-500 opacity-20 floating"></div>
  </section>

  <!-- Blog Section -->
  <section class="py-20 bg-gray-900" id="blog">
    <div class="container mx-auto px-6 max-w-6xl">
      <h2 class="text-3xl md:text-5xl font-bold mb-12">
        <span class="gradient-text">Latest Posts</span>
      </h2>
      <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
        <input id="search-input" type="text" placeholder="Search posts..." class="w-full md:w-1/2 px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" />
        <div id="tags-container" class="flex flex-wrap items-center gap-2"></div>
      </div>
      <div id="posts-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      <div id="no-posts-message" class="text-center text-gray-400 mt-8 hidden">No posts match your search.</div>
    </div>
  </section>

  <!-- Post Modal -->
  <div id="post-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="bg-gray-900 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-auto relative p-8">
      <button id="close-post-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white z-50">
        <i class="fas fa-times text-2xl"></i>
      </button>
      <h3 id="modal-post-title" class="text-3xl font-bold mb-2 gradient-text"></h3>
      <p id="modal-post-date" class="text-sm text-gray-400 mb-4"></p>
      <div id="modal-post-content" class="prose prose-invert max-w-none"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const closeMenu = document.getElementById('close-menu');
    menuToggle.addEventListener('click', () => { mobileMenu.classList.remove('hidden'); mobileMenu.classList.add('flex'); });
    closeMenu.addEventListener('click', () => { mobileMenu.classList.add('hidden'); mobileMenu.classList.remove('flex'); });

    window.addEventListener('scroll', () => {
      const nav = document.querySelector('nav');
      if (window.scrollY > 50) nav.classList.add('bg-black', 'bg-opacity-90', 'backdrop-blur-sm');
      else nav.classList.remove('bg-black', 'bg-opacity-90', 'backdrop-blur-sm');
    });

    let posts = [], selectedTag = null;
    const postsContainer = document.getElementById('posts-container');
    const tagsContainer = document.getElementById('tags-container');
    const searchInput   = document.getElementById('search-input');
    const noPostsMsg    = document.getElementById('no-posts-message');
    const postModal     = document.getElementById('post-modal');
    const closePostModal= document.getElementById('close-post-modal');
    const modalTitle    = document.getElementById('modal-post-title');
    const modalDate     = document.getElementById('modal-post-date');
    const modalContent  = document.getElementById('modal-post-content');

    fetch('assets/posts.json').then(resp => resp.json()).then(data => { posts = data; renderTags(); renderPosts(); });

    function renderTags() {
      const tagSet = new Set();
      posts.forEach(post => post.tags.forEach(tag => tagSet.add(tag)));
      tagsContainer.innerHTML = '';
      tagSet.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'blog-tag';
        span.textContent = tag;
        span.addEventListener('click', () => {
          if (selectedTag === tag) { selectedTag = null; document.querySelectorAll('.blog-tag').forEach(t => t.classList.remove('active')); }
          else { selectedTag = tag; document.querySelectorAll('.blog-tag').forEach(t => t.classList.remove('active')); span.classList.add('active'); }
          renderPosts();
        });
        tagsContainer.appendChild(span);
      });
    }

    function renderPosts() {
      const term = searchInput.value.toLowerCase();
      const filtered = posts.filter(post => {
        const matchesSearch = post.title.toLowerCase().includes(term) || post.summary.toLowerCase().includes(term) || post.content.toLowerCase().includes(term);
        const matchesTag = !selectedTag || post.tags.includes(selectedTag);
        return matchesSearch && matchesTag;
      }).sort((a,b) => new Date(b.date) - new Date(a.date));
      postsContainer.innerHTML = '';
      if (filtered.length === 0) { noPostsMsg.classList.remove('hidden'); }
      else {
        noPostsMsg.classList.add('hidden');
        filtered.forEach(post => {
          const card = document.createElement('div');
          card.className = 'post-card p-6 bg-gray-800 rounded-xl border border-gray-700 cursor-pointer flex flex-col justify-between';
          if (post.image) {
            const img = document.createElement('img');
            img.src = post.image;
            img.alt = post.title;
            img.className = 'mb-4 rounded-lg w-full h-48 object-cover';
            card.appendChild(img);
          }
          const title = document.createElement('h3');
          title.className = 'text-2xl font-bold mb-2 gradient-text';
          title.textContent = post.title;
          const date = document.createElement('p');
          date.className = 'text-sm text-gray-400 mb-4';
          date.textContent = formatDate(post.date);
          const summary = document.createElement('p');
          summary.className = 'mb-4';
          summary.textContent = post.summary;
          const tagContainer = document.createElement('div');
          post.tags.forEach(t => {
            const span = document.createElement('span');
            span.className = 'blog-tag';
            span.textContent = t;
            tagContainer.appendChild(span);
          });
          card.appendChild(title);
          card.appendChild(date);
          card.appendChild(summary);
          card.appendChild(tagContainer);
          card.addEventListener('click', () => openPostModal(post));
          postsContainer.appendChild(card);
        });
      }
    }

    function formatDate(dateString) {
      const opts = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', opts);
    }

    searchInput.addEventListener('input', () => { renderPosts(); });

    function openPostModal(post) {
      modalTitle.textContent = post.title;
      modalDate.textContent = formatDate(post.date);
      modalContent.innerHTML = '';
      if (post.image) {
        modalContent.innerHTML += `<img src="${post.image}" alt="${post.title}" class="mb-6 rounded-lg w-full object-cover">`;
      }
      modalContent.innerHTML += marked.parse(post.content);
      postModal.classList.remove('hidden');
      postModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    closePostModal.addEventListener('click', () => { postModal.classList.add('hidden'); postModal.classList.remove('flex'); document.body.style.overflow = ''; });
    postModal.addEventListener('click', (e) => { if (e.target === postModal) { postModal.classList.add('hidden'); postModal.classList.remove('flex'); document.body.style.overflow = ''; } });
  </script>
</body>
</html>
