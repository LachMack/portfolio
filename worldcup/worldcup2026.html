*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

#app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 80px}

::-webkit-scrollbar-track{background:#111827}
::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:2px}
/* Typography */
.font-display{font-family:'Barlow Condensed',sans-serif}
/* Cards */
.card{background:#111827;border:1px solid #ffffff10;border-radius:10px;overflow:hidden}
.card-pad{background:#111827;border:1px solid #ffffff10;border-radius:10px;padding:16px 18px}
/* Buttons */
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:4px;cursor:pointer;border:1px solid #ffffff22;background:transparent;color:#5a6a88;transition:all .15s}
.btn:hover{color:#e8eeff;border-color:#ffffff40}
.btn-accent{background:#00d4aa18;border-color:#00d4aa40;color:#00d4aa}
.btn-accent:hover{background:#00d4aa28}
.btn-lg{font-size:16px;padding:12px 24px;border-radius:8px}
/* Tabs */
#tabs{display:flex;gap:2px;border-bottom:1px solid #ffffff10;margin-bottom:20px;overflow-x:auto}
.tab-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border:none;border-bottom:2px solid transparent;background:none;color:#5a6a88;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab-btn.active{color:#00d4aa;border-bottom-color:#00d4aa}
/* Tables */
table{width:100%;border-collapse:collapse}
th{padding:6px 7px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5a6a88;border-bottom:1px solid #ffffff0a;text-align:center}
th.left{text-align:left}
td{padding:7px 7px;font-size:13px;border-bottom:1px solid #ffffff06;text-align:center}
td.left{text-align:left}
tr:last-child td{border-bottom:none}

input,select,textarea{font-family:'Barlow',sans-serif;font-size:13px;background:#1a2235;border:1px solid #ffffff18;border-radius:6px;color:#e8eeff;padding:7px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#00d4aa50}
input[type=number]::-webkit-inner-spin-button{opacity:1}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

#statusbar{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.05em}

#spin-overlay{display:none;position:fixed;inset:0;background:#080d18ee;z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}

.spin-box{background:#111827;border:1px solid #ffffff18;border-radius:16px;padding:36px 32px;text-align:center;max-width:400px;width:90%}

.spin-window::before,.spin-window::after{content:'';position:absolute;left:0;right:0;height:22px;z-index:2}

.spin-highlight{position:absolute;top:50%;left:0;right:0;height:36px;transform:translateY(-50%);border-top:1px solid #00d4aa60;border-bottom:1px solid #00d4aa60;pointer-events:none;z-index:3}
.spin-reel{display:flex;flex-direction:column;align-items:center}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1s ease-in-out infinite}
.glow{animation:glow .8s ease forwards}
.fade-up{animation:fadeUp .25s ease}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px}

.match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:3px 0;font-size:11px}

const OFB_URL='https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';

async function loadFromOpenFootball(){
  // Only refetch if >5 mins since last fetch
  var now=Date.now();
  if(now-OFB_LAST_FETCH<5*60*1000&&OFB_LAST_FETCH>0)return;
  try{
    var r=await fetch(OFB_URL+'?t='+now);
    if(!r.ok)return;
    var data=await r.json();
    var matches=data.matches||[];
    OFB={};OFB_GOALS={};
    matches.forEach(function(m,i){
      // Match by date + team names
      var t1=normTeam(m.team1||'');
      var t2=normTeam(m.team2||'');
      var key=findMatchKey(t1,t2,m.date||'');
      if(key===null)return;
      if(m.score&&m.score.ft){
        OFB[key]={s1:m.score.ft[0],s2:m.score.ft[1],ht1:m.score.ht?m.score.ht[0]:null,ht2:m.score.ht?m.score.ht[1]:null};
      }
      var goals=[];
      (m.goals1||[]).forEach(function(g){goals.push({name:g.name,team:t1,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      (m.goals2||[]).forEach(function(g){goals.push({name:g.name,team:t2,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      goals.sort(function(a,b){return a.minute-b.minute;});
      if(goals.length)OFB_GOALS[key]=goals;
    });
    OFB_LAST_FETCH=now;
  }catch(e){
    // Silently fail - manual scores still work
  }
}

function findMatchKey(t1,t2,date){
  var matches=getMatches();
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(m.d===date&&((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1))){
      return m.key;
    }
  }
  // Fallback: match by teams only (different date format)
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1)){
      return m.key;
    }
  }
  return null;
}

async function loadFromGitHub(){
  setStatus('loading','Syncing…','#fbbf24');
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON in config');}
    CFG={...DEFAULT_CFG,...data};

    delete CFG.githubToken; // token never stored in remote config
    setStatus('ok','✓ Synced with GitHub','#00d4aa');
  }catch(e){
    setStatus('warn','Local mode — set token in ⚙ Admin to enable sync ('+e.message+')','#fbbf24');
  }
  // Also fetch live scores from openfootball
  await loadFromOpenFootball();
  render();
}

async function pushToGitHub(cfg){
  var token='';try{token=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(!token){
    alert('No GitHub token set. Go to ⚙ Admin tab and enter your token first.');
    return false;
  }
  setStatus('saving','Saving to GitHub…','#fbbf24');
  try{
    // Get current SHA
    const metaRes=await fetch(GH_API,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(!metaRes.ok)throw new Error('GitHub API '+metaRes.status+' — check your token has Contents:Write on the portfolio repo');
    const meta=await metaRes.json();
    const sha=meta.sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
    const putRes=await fetch(GH_API,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'wc2026: update config',content,sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||'Push failed');}
    setStatus('ok','✓ Saved to GitHub','#00d4aa');
    return true;
  }catch(e){
    setStatus('err','⚠ '+e.message,'#ff4757');
    return false;
  }
}

function getMatches(){
  return MATCHES.map(function(m,i){
    var key='m'+i;
    var manual=SCORES[key];
    var auto=OFB[key];
    var sc=manual||auto||null;
    var goals=OFB_GOALS[key]||null;
    return Object.assign({},m,{
      key:key,
      s1:sc?sc.s1:null,
      s2:sc?sc.s2:null,
      ht1:sc?sc.ht1:null,
      ht2:sc?sc.ht2:null,
      goals:goals,
      isManual:!!manual,
      isAuto:!manual&&!!auto
    });
  });
}

function buildStandings(matches){
  var sm={};
  matches.filter(function(m){return m.g;}).forEach(function(m){
    var g=m.g.replace('Group ','');
    if(!sm[g])sm[g]={};
    [m.t1,m.t2].forEach(function(t){if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    if(m.s1!=null&&m.s2!=null){
      var s=sm[g];
      s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.s1;s[m.t1].ga+=m.s2;s[m.t2].gf+=m.s2;s[m.t2].ga+=m.s1;
      if(m.s1>m.s2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
      else if(m.s1<m.s2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
      else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
    }
  });
  return sm;
}

function getTeamResult(teamName,matches,sm){
  var km=matches.filter(function(m){return !m.g;});
  var fin=km.find(function(m){return m.round==='Final'&&m.s1!=null;});
  if(fin){
    var w=fin.s1>fin.s2?fin.t1:fin.t2,l=fin.s1<fin.s2?fin.t1:fin.t2;
    if(teamName===w)return'champion';
    if(teamName===l)return'runner';
    var t3=km.find(function(m){return m.round==='Match for third place'&&m.s1!=null;});
    if(t3&&teamName===(t3.s1>t3.s2?t3.t1:t3.t2))return'third';
  }
  // Group advancement: only award once ALL 6 group matches are complete
  var grpMatch=MATCHES.find(function(m){return m.t1===teamName||m.t2===teamName;});
  var grp=grpMatch&&grpMatch.g?grpMatch.g.replace('Group ',''):null;
  if(grp&&sm[grp]){
    var grpMatches=matches.filter(function(m){return m.g==='Group '+grp;});
    var allPlayed=grpMatches.length===6&&grpMatches.every(function(m){return m.s1!=null;});
    if(allPlayed){
      var sorted=Object.values(sm[grp]).sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
      if(sorted.slice(0,2).some(function(s){return s.name===teamName;}))return'advanced';
    }
  }
  return'active';
}

// ── GROUPS TAB ────────────────────────────────────────────
function renderGroups(){

    document.getElementById('tab-groups').innerHTML='<div style="text-align:center;padding:60px 20px;color:#5a6a88"><div style="font-size:40px;margin-bottom:12px">⚽</div><div class="font-display" style="font-size:20px;font-weight:700;color:#8b9ab8">Tournament kicks off June 11</div><div style="font-size:13px;margin-top:6px">Enter scores in the ✏ Scores tab</div></div>';
    return;
  }
  var out='<div class="grid-groups">';
  letters.forEach(function(g){
    var sorted=Object.values(sm[g]).sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
    var gm=matches.filter(function(m){return m.g==='Group '+g;}).sort(function(a,b){return new Date(a.d)-new Date(b.d);});

    out+='<span style="font-size:11px;color:#5a6a88">'+played+'/6 played</span></div>';
    out+='<table><thead><tr>';
    ['','Team','P','W','D','L','GD','Pts'].forEach(function(hd){
      out+='<th style="text-align:'+(hd==='Team'?'left':'center')+'">'+hd+'</th>';

      out+='<td style="text-align:left;font-weight:500;font-size:12px">'+(isKnown(s.name)?f(s.name)+' ':'')+h(s.name)+'</td>';

      out+='<td style="color:#5a6a88">'+s.d+'</td><td style="color:#5a6a88">'+s.l+'</td>';
      out+='<td style="font-weight:600;color:'+(gd>0?'#00d4aa':gd<0?'#ff4757':'#5a6a88')+'">'+(gd>0?'+':'')+gd+'</td>';
      out+='<td class="font-display" style="font-weight:700;font-size:14px;color:'+(i<2?c:'#f0f4ff')+'">'+s.pts+'</td>';
      out+='</tr>';
    });
    out+='</tbody></table>';
    out+='<div style="border-top:1px solid #ffffff08;padding:8px 10px;display:flex;flex-direction:column;gap:2px">';
    gm.forEach(function(m){
      var done=m.s1!=null;
      out+='<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;font-size:11px;padding:3px 0">';
      out+='<span style="text-align:right;font-weight:'+(done?600:400)+';color:'+(done?'#e8eeff':'#8b9ab8')+'">'+(isKnown(m.t1)?f(m.t1):'')+' '+h(m.t1)+'</span>';
      out+='<span class="font-display" style="text-align:center;min-width:44px;font-weight:700;font-size:'+(done?14:11)+'px;color:'+(done?'#f0f4ff':'#5a6a88')+'">'+(done?m.s1+'–'+m.s2:fmtDate(m.d))+'</span>';

// ── KNOCKOUT TAB ──────────────────────────────────────────
function renderKnockout(){
  var matches=getMatches().filter(function(m){return !m.g;});
  var stages=[{k:'Round of 32',l:'R32',wide:true},{k:'Round of 16',l:'R16'},{k:'Quarter-final',l:'QF'},{k:'Semi-final',l:'SF'},{k:'Match for third place',l:'3rd'},{k:'Final',l:'Final'}];
  var out='<div class="bracket"><div class="ko-rounds">';
  stages.forEach(function(st){
    var sm=matches.filter(function(m){return m.round===st.k;}).sort(function(a,b){return (a.num||0)-(b.num||0);});
    if(!sm.length)return;
    out+='<div class="ko-col'+(st.wide?' wide':'')+'"><div class="ko-round-hdr">'+st.l+'</div>';
    sm.forEach(function(m){
      var done=m.s1!=null,h1w=done&&m.s1>m.s2,h2w=done&&m.s2>m.s1;
      var t1k=isKnown(m.t1),t2k=isKnown(m.t2);
      out+='<div class="ko-match">';
      [{t:m.t1,s:m.s1,w:h1w,k:t1k},{t:m.t2,s:m.s2,w:h2w,k:t2k}].forEach(function(side,si){
        out+='<div class="ko-team'+(side.w?' winner':'')+'">'+
          '<span class="name" style="font-weight:'+(side.w?700:400)+';color:'+(side.k?'#e8eeff':'#5a6a88')+';font-style:'+(side.k?'normal':'italic')+';font-size:'+(side.k?11:10)+'px">'+
          (side.k?f(side.t)+' ':'')+h(side.t)+'</span>'+
          '<span class="score" style="color:'+(side.w?'#00d4aa':'#f0f4ff')+'">'+(done?side.s:'')+'</span>'+
          '</div>';
      });
      out+='<div class="ko-meta">'+fmtDate(m.d)+' · '+h(m.gr)+'</div></div>';
    });
    out+='</div>';
  });
  out+='</div></div>';
  document.getElementById('tab-knockout').innerHTML=out;
}

// ── STATS TAB ─────────────────────────────────────────────
function renderStats(){
  var matches=getMatches();
  var sm=buildStandings(matches);
  var allTeams=[...new Set(matches.filter(function(m){return m.g;}).flatMap(function(m){return[m.t1,m.t2];}).filter(isKnown))].sort();
  var rows=allTeams.map(function(name){
    var grp=Object.entries(sm).find(function(e){return e[1][name];})?.[0]||'?';
    var s=sm[grp]?.[name]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    return Object.assign({name:name,group:grp},s,{gd:s.gf-s.ga});
  }).sort(function(a,b){
    if(statsSort==='pts')return b.pts-a.pts||b.gd-a.gd;
    if(statsSort==='gf')return b.gf-a.gf||b.pts-a.pts;
    if(statsSort==='gd')return b.gd-a.gd||b.gf-a.gf;
    if(statsSort==='ga')return a.ga-b.ga;
    return a.group.localeCompare(b.group);
  });
  var sortBtns=[['pts','Points'],['gf','Goals'],['gd','GD'],['ga','Fewest Against'],['grp','Group']];
  var out='<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Sort</span>'+
    sortBtns.map(function(sv){return '<button class="btn'+(statsSort===sv[0]?' btn-accent':'')+'" onclick="statsSort=\''+sv[0]+'\';renderStats()">'+sv[1]+'</button>';}).join('')+
    '</div>';
  out+='<div class="card"><table><thead><tr style="background:#ffffff05">';
  ['#','Team','Grp','Pld','W','D','L','GF','GA','GD','Pts'].forEach(function(hd){
    out+='<th style="text-align:'+(hd==='Team'?'left':'center')+'">'+hd+'</th>';
  });
  out+='</tr></thead><tbody>';
  rows.forEach(function(r,i){
    var c=GC[r.group]||'#888';
    out+='<tr>';
    out+='<td style="color:#5a6a88;font-size:11px">'+(i+1)+'</td>';
    out+='<td style="text-align:left;font-weight:500">'+f(r.name)+' '+h(r.name)+'</td>';
    out+='<td><span class="font-display" style="font-size:10px;font-weight:700;color:'+c+';background:'+c+'18;padding:1px 6px;border-radius:3px">'+r.group+'</span></td>';
    out+='<td style="color:#5a6a88">'+r.p+'</td><td>'+r.w+'</td>';
    out+='<td style="color:#5a6a88">'+r.d+'</td><td style="color:#5a6a88">'+r.l+'</td>';
    out+='<td style="font-weight:'+(r.gf>0?600:400)+'">'+r.gf+'</td>';
    out+='<td style="color:#5a6a88">'+r.ga+'</td>';
    out+='<td class="font-display" style="font-weight:700;font-size:14px;color:'+(r.gd>0?'#00d4aa':r.gd<0?'#ff4757':'#5a6a88')+'">'+(r.gd>0?'+':'')+r.gd+'</td>';
    out+='<td class="font-display" style="font-weight:700;font-size:16px">'+r.pts+'</td>';
    out+='</tr>';
  });
  if(!rows.length) out+='<tr><td colspan="11" style="text-align:center;padding:40px;color:#5a6a88">Stats appear once scores are entered</td></tr>';
  out+='</tbody></table></div>';
  document.getElementById('tab-stats').innerHTML=out;
}

// ── SCORES TAB ────────────────────────────────────────────

  var manualCount=matches.filter(function(m){return m.isManual;}).length;

    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#60a5fa;margin-right:4px;vertical-align:-1px"></span>Manual override ('+manualCount+')</span>'+

      '<span class="font-display" style="font-size:10px;color:#5a6a88;font-weight:600;letter-spacing:.04em;text-transform:uppercase">'+roundShort+'</span>';
    out+='<div style="font-size:11px">'+metaLabel+'<div style="margin-top:4px;color:#5a6a88">'+fmtDate(m.d)+'</div></div>';
    out+='<span style="font-weight:'+(done?600:400)+';text-align:right;color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+(isKnown(m.t1)?f(m.t1)+' ':'')+h(m.t1)+'</span>';
    out+='<div style="text-align:center;min-width:80px">';
    if(isEdit){
      var v1=m.s1!=null?m.s1:'',v2=m.s2!=null?m.s2:'';
      var clrBtn=done?'<button class="btn" style="color:#ff4757;border-color:#ff475730;padding:3px 7px;font-size:11px" onclick="event.stopPropagation();clearScore(\''+m.key+'\')">&#x2715;</button>':'';
      out+='<div style="display:flex;align-items:center;gap:4px;justify-content:center" onclick="event.stopPropagation()">'+
        '<input id="s1in" type="number" min="0" max="20" value="'+v1+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<span style="font-weight:700;color:#5a6a88">-</span>'+
        '<input id="s2in" type="number" min="0" max="20" value="'+v2+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<button class="btn btn-accent" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();saveScore(\''+m.key+'\')">SAVE</button>'+
        clrBtn+
        '<button class="btn" style="padding:3px 7px;font-size:11px" onclick="event.stopPropagation();editScoreKey=null;renderScores()">&#x00D7;</button>'+
        '</div>';
    }else if(done){
      out+='<div><span class="font-display" style="font-weight:700;font-size:20px;letter-spacing:.05em">'+m.s1+' - '+m.s2+'</span>'+srcDot+htHtml+'</div>';
    }else{
      out+='<span style="font-size:11px;color:#5a6a88;border:1px dashed #ffffff14;padding:3px 8px;border-radius:4px;white-space:nowrap">click to enter</span>';
    }
    out+='</div>';
    out+='<span style="font-weight:'+(done?600:400)+';color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+h(m.t2)+' '+(isKnown(m.t2)?f(m.t2):'')+'</span>';
    out+='<span style="font-size:10px;color:#5a6a88;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h(m.gr)+'</span>';
    out+='</div>';
    if(goalsHtml)out+=goalsHtml;
    out+='</div>';
  });
  out+='</div>';
  document.getElementById('tab-scores').innerHTML=out;
  if(editScoreKey)setTimeout(function(){var el=document.getElementById('s1in');if(el)el.focus();},50);
}
function setScoreFilter(btn){scoreFilter=btn.getAttribute('data-filter');renderScores();}
function editScore(key){editScoreKey=key;renderScores();}
function saveScore(key){
  var s1=document.getElementById('s1in')?document.getElementById('s1in').value:'';
  var s2=document.getElementById('s2in')?document.getElementById('s2in').value:'';
  if(s1===''&&s2===''){delete SCORES[key];}else{SCORES[key]={s1:s1===''?null:+s1,s2:s2===''?null:+s2};}
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;render();
}
function clearScore(key){
  delete SCORES[key];
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;render();
}

// NEW ADMIN TAB
// ═══════════════════════════════════════════════════════════
function renderAdmin(){
  var allocs=CFG.allocations||{};
  var allocated=new Set(Object.values(allocs).flat());

  // Global pick tally
  var totalP1=CFG.pot1.length; // always 16
  var totalP2=CFG.pot2.length;
  var totalP3=CFG.pot3.length;
  var usedP1=[...allocated].filter(function(t){return CFG.pot1.includes(t);}).length;
  var usedP2=[...allocated].filter(function(t){return CFG.pot2.includes(t);}).length;
  var usedP3=[...allocated].filter(function(t){return CFG.pot3.includes(t);}).length;

  // Per-family claimed picks (from familyBuys)
  var claimedP1=Object.values(CFG.familyBuys||{}).reduce(function(s,b){return s+(b.primaries||0);},0);
  var claimedP2=Object.values(CFG.familyBuys||{}).reduce(function(s,b){return s+(b.secondaries||0);},0);

  var pool=(claimedP1*(CFG.primaryCost||10))+(claimedP2*(CFG.secondaryCost||5));

  var PRIZE_DEFS=getPrizeDefs();
  var prz=CFG.prizes||{};

  var prizeColor=prizeTotal===pool?'#00d4aa':prizeTotal<pool?'#fbbf24':'#ff4757';

  var out='<div style="display:flex;flex-direction:column;gap:14px;max-width:760px">';

  // ── GitHub Token ─────────────────────────────────────────
  out+='<div class="card-pad" style="border-color:#00d4aa30">'+
    '<div class="font-display" style="font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#00d4aa;margin-bottom:8px">⚡ GitHub Token</div>'+
    '<div style="font-size:13px;color:#8b9ab8;margin-bottom:8px;line-height:1.5">Stored in your browser only. Required to push changes to GitHub so everyone sees them.</div>'+
    '<div style="font-size:12px;color:#5a6a88;margin-bottom:10px;padding:8px 10px;background:#ffffff06;border-radius:6px">'+
      'Generate at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" style="color:#60a5fa">github.com → Settings → Developer settings → Fine-grained tokens</a> '+
      '→ Contents: Read &amp; Write on the <strong style="color:#e8eeff">portfolio</strong> repo.'+
    '</div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      '<input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="flex:1;font-size:13px">'+
      '<button class="btn btn-accent" style="padding:8px 16px" onclick="saveToken()">Save to browser</button>'+
    '</div>'+
    '<div id="token-status-placeholder"></div>'+
    '</div>';

  // ── Buy-in costs + prize structure (side by side) ────────
  var famRows=CFG.families.map(function(fam){
    var b=CFG.familyBuys[fam.id]||{primaries:0,secondaries:0};
    var famTotal=(b.primaries*(CFG.primaryCost||10))+(b.secondaries*(CFG.secondaryCost||5));
    // Count actually drawn picks for this family
    var famMemIds=fam.members.map(function(m){return m.id;});
    var famTeams=famMemIds.flatMap(function(id){return (CFG.allocations||{})[id]||[];});
    var drawnP1=famTeams.filter(function(t){return CFG.pot1.includes(t);}).length;
    var drawnP2=famTeams.filter(function(t){return CFG.pot2.includes(t);}).length;
    var drawnP3=famTeams.filter(function(t){return CFG.pot3.includes(t);}).length;
    return '<tr>'+
      '<td class="left" style="font-weight:600;color:'+fam.color+'">'+h(fam.name)+'</td>'+
      '<td class="font-display" style="font-weight:700;text-align:center">'+b.primaries+'</td>'+
      '<td class="font-display" style="font-weight:700;text-align:center">'+b.secondaries+'</td>'+
      '<td style="text-align:center;font-size:11px;color:#5a6a88">'+drawnP1+'/'+b.primaries+' · '+drawnP2+'/'+b.secondaries+' · '+drawnP3+'/'+b.primaries+'</td>'+
      '<td class="font-display" style="font-weight:700;color:'+fam.color+'" id="buys-'+fam.id+'-total">$'+famTotal+'</td>'+
      '</tr>';
  }).join('');

  var prizeInputs=PRIZE_DEFS.map(function(pd){
    var val=prz[pd.k]||0;
    var mult=pd.k==='groupAdvance'?24:1;
    var multLabel=mult>1?'<span style="font-size:10px;color:#5a6a88;margin-left:2px">×'+mult+' = $'+(val*mult)+'</span>':'';
    return '<label style="display:flex;align-items:center;gap:7px;padding:6px 10px;background:#ffffff05;border-radius:6px;border:1px solid #ffffff08;font-size:12px">'+
      '<span style="color:#8b9ab8;flex:1">'+pd.icon+' '+pd.label+'</span>'+
      '<span style="color:#5a6a88">$</span>'+
      '<input type="number" id="prize-'+pd.k+'" value="'+val+'" min="0" oninput="updatePrizeTotals()" style="width:54px;text-align:center;padding:3px 6px">'+
      multLabel+
      '</label>';
  }).join('');

  out+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';

  // Buy-in costs card
  out+='<div class="card-pad">'+
    '<div class="font-display" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8b9ab8;margin-bottom:12px">Buy-in Costs</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px">'+
        '<span style="color:#8b9ab8;flex:1">Primary buy (P1 + P3)</span>'+
        '<span style="color:#5a6a88">$</span>'+
        '<input type="number" id="cost-primary" value="'+(CFG.primaryCost||10)+'" min="0" oninput="updatePoolTotal()" style="width:58px;text-align:center">'+
      '</label>'+
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px">'+
        '<span style="color:#8b9ab8;flex:1">Secondary buy (P2 only)</span>'+
        '<span style="color:#5a6a88">$</span>'+
        '<input type="number" id="cost-secondary" value="'+(CFG.secondaryCost||5)+'" min="0" oninput="updatePoolTotal()" style="width:58px;text-align:center">'+
      '</label>'+
    '</div>'+
    '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #ffffff0a">'+
      '<div style="font-size:10px;color:#5a6a88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Total pool</div>'+
      '<div class="font-display" id="admin-pool-total" style="font-weight:800;font-size:26px;color:#00d4aa">$'+pool+'</div>'+
      '<div id="admin-pool-breakdown" style="font-size:11px;color:#5a6a88;margin-top:2px">'+claimedP1+'× primary + '+claimedP2+'× secondary</div>'+
    '</div>'+
    '<div style="margin-top:12px">'+
      '<div class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Family Buy-ins</div>'+
      '<div style="font-size:11px;color:#5a6a88;margin-bottom:6px;font-style:italic">Allocations set via +/− controls in family panels below</div>'+
      '<table><thead><tr><th class="left">Family</th><th>P1+P3</th><th>P2</th><th>Drawn (P1/P2/P3)</th><th>Owes</th></tr></thead><tbody>'+famRows+'</tbody></table>'+
    '</div>'+
    '</div>';

  // Prize structure card
  out+='<div class="card-pad">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
      '<div class="font-display" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8b9ab8">Prize Structure</div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<span class="font-display" id="prize-total-badge" style="font-weight:800;font-size:16px;color:'+prizeColor+'">$'+prizeTotal+'</span>'+
        '<span id="prize-status-badge" style="font-size:11px;padding:2px 8px;border-radius:4px;background:'+prizeColor+'18;color:'+prizeColor+';border:1px solid '+prizeColor+'30">'+prizeStatus+'</span>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:4px">'+prizeInputs+'</div>'+
    '<div style="margin-top:10px;height:3px;background:#ffffff10;border-radius:2px;overflow:hidden">'+
      '<div id="prize-bar" style="height:100%;width:'+(pool>0?Math.min(100,Math.round(prizeTotal/pool*100)):0)+'%;background:'+prizeColor+';transition:width .3s"></div>'+
    '</div>'+
    '<div id="prize-bar-label" style="font-size:10px;color:'+prizeColor+';margin-top:4px;text-align:right">'+prizeStatus+'</div>'+
    '</div>';

  out+='</div>'; // end costs+prizes grid

  // ── Global pick tally ─────────────────────────────────────
  // How many picks are available globally to be claimed
  var availP1=totalP1-claimedP1;  // unclaimed spots
  var availP2=totalP2-claimedP2;
  var availP3=totalP3-claimedP1;  // P3 mirrors P1

  out+='<div class="card-pad">';
  out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<div class="font-display" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8b9ab8">Pick Pool</div>'+
    '<span style="font-size:11px;color:#5a6a88">Adjust allocations using +/− in family panels · draws reduce the drawn count</span>'+
    '</div>';
  out+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">';
  [
    {p:1,label:'Pot 1 (Elite)',color:POT[1].color,total:totalP1,claimed:claimedP1,drawn:usedP1,avail:availP1},
    {p:2,label:'Pot 2',       color:POT[2].color,total:totalP2,claimed:claimedP2,drawn:usedP2,avail:availP2},
    {p:3,label:'Pot 3',       color:POT[3].color,total:totalP3,claimed:claimedP1,drawn:usedP3,avail:availP3},
  ].forEach(function(pt){
    var barPct=pt.total>0?Math.round(pt.drawn/pt.total*100):0;
    var claimPct=pt.total>0?Math.round(pt.claimed/pt.total*100):0;
    out+='<div style="background:'+pt.color+'0c;border:1px solid '+pt.color+'25;border-radius:8px;padding:10px 12px">';
    out+='<div class="font-display" style="font-size:11px;color:'+pt.color+';font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">'+pt.label+'</div>';
    // Three stats in a row
    out+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:center;margin-bottom:8px">';
    out+='<div><div class="font-display" style="font-weight:800;font-size:20px;color:'+pt.color+'">'+pt.avail+'</div><div style="font-size:9px;color:#5a6a88;text-transform:uppercase;letter-spacing:.04em">Available</div></div>';

    out+='<div><div class="font-display" style="font-weight:800;font-size:20px;color:#00d4aa">'+pt.drawn+'</div><div style="font-size:9px;color:#5a6a88;text-transform:uppercase;letter-spacing:.04em">Drawn</div></div>';
    out+='</div>';
    // Progress bar: grey=unclaimed, pot color=claimed, green=drawn
    out+='<div style="height:6px;background:#ffffff10;border-radius:3px;overflow:hidden;position:relative">';
    out+='<div style="position:absolute;left:0;top:0;height:100%;width:'+claimPct+'%;background:'+pt.color+'60;border-radius:3px"></div>';
    out+='<div style="position:absolute;left:0;top:0;height:100%;width:'+barPct+'%;background:#00d4aa;border-radius:3px"></div>';
    out+='</div>';
    out+='<div style="font-size:10px;color:#5a6a88;margin-top:4px;text-align:right">'+pt.drawn+' of '+pt.total+' drawn</div>';
    out+='</div>';
  });
  out+='</div></div>';

  // ── Family draw panels ────────────────────────────────────
  out+='<div class="font-display" style="font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#8b9ab8;margin-top:4px">Family Draw Panels</div>';

  CFG.families.forEach(function(fam){
    var b=CFG.familyBuys[fam.id]||{primaries:0,secondaries:0};
    var famPool=(b.primaries*(CFG.primaryCost||10))+(b.secondaries*(CFG.secondaryCost||5));
    // Count assigned picks per pot for this family
    var famMemIds=fam.members.map(function(m){return m.id;});
    var famTeams=famMemIds.flatMap(function(id){return allocs[id]||[];});
    var famP1=famTeams.filter(function(t){return CFG.pot1.includes(t);});
    var famP2=famTeams.filter(function(t){return CFG.pot2.includes(t);});
    var famP3=famTeams.filter(function(t){return CFG.pot3.includes(t);});
    var remP1=b.primaries-famP1.length;   // family's remaining P1 picks
    var remP2=b.secondaries-famP2.length;
    var remP3=b.primaries-famP3.length;

    out+='<div class="card" style="margin-bottom:4px">';

    // Family header with +/− pick controls and tally
    out+='<div style="padding:10px 14px;background:'+fam.color+'14;border-bottom:1px solid '+fam.color+'25">';
    out+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
    out+='<span class="font-display" style="font-weight:700;font-size:15px;color:'+fam.color+';text-transform:uppercase;letter-spacing:.06em">'+h(fam.name)+'</span>';
    // Buy pick controls
    out+='<div style="display:flex;align-items:center;gap:6px;margin-left:8px">';
    // P1 +/−
    out+='<span style="font-size:11px;color:'+POT[1].color+';font-family:\'Barlow Condensed\',sans-serif;font-weight:700">P1</span>'+
      '<button class="btn" style="padding:1px 7px;font-size:14px;line-height:1" onclick="adjustFamPick(\''+fam.id+'\',\'p\',-1)">−</button>'+
      '<span class="font-display" id="fp1-'+fam.id+'" style="font-weight:700;font-size:14px;color:#f0f4ff;min-width:20px;text-align:center">'+b.primaries+'</span>'+
      '<button class="btn" style="padding:1px 7px;font-size:14px;line-height:1" onclick="adjustFamPick(\''+fam.id+'\',\'p\',1)">+</button>';
    // P2 +/−
    out+='<span style="font-size:11px;color:'+POT[2].color+';font-family:\'Barlow Condensed\',sans-serif;font-weight:700;margin-left:8px">P2</span>'+
      '<button class="btn" style="padding:1px 7px;font-size:14px;line-height:1" onclick="adjustFamPick(\''+fam.id+'\',\'s\',-1)">−</button>'+
      '<span class="font-display" id="fp2-'+fam.id+'" style="font-weight:700;font-size:14px;color:#f0f4ff;min-width:20px;text-align:center">'+b.secondaries+'</span>'+

    out+='</div>';

    // Pick status pills in header — show drawn (solid) and undrawn (dashed)
    var totalFamPicks=b.primaries+b.secondaries+b.primaries; // P1+P2+P3
    if(totalFamPicks>0){
      out+='<div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">';
      // P1 picks: solid=drawn, dashed=undrawn
      for(var i=0;i<b.primaries;i++){
        var drawn=i<famP1.length;
        out+='<span class="font-display" style="font-size:10px;padding:2px 8px;border-radius:4px;'+
          (drawn
            ? 'background:'+POT[1].color+'25;color:'+POT[1].color+';border:1px solid '+POT[1].color+'60'
            : 'background:transparent;color:'+POT[1].color+'80;border:1px dashed '+POT[1].color+'40')+
          '">P1</span>';
      }
      // P2 picks
      for(var i=0;i<b.secondaries;i++){
        var drawn=i<famP2.length;
        out+='<span class="font-display" style="font-size:10px;padding:2px 8px;border-radius:4px;'+
          (drawn
            ? 'background:'+POT[2].color+'25;color:'+POT[2].color+';border:1px solid '+POT[2].color+'60'
            : 'background:transparent;color:'+POT[2].color+'80;border:1px dashed '+POT[2].color+'40')+
          '">P2</span>';
      }
      // P3 picks
      for(var i=0;i<b.primaries;i++){
        var drawn=i<famP3.length;
        out+='<span class="font-display" style="font-size:10px;padding:2px 8px;border-radius:4px;'+
          (drawn
            ? 'background:'+POT[3].color+'25;color:'+POT[3].color+';border:1px solid '+POT[3].color+'60'
            : 'background:transparent;color:'+POT[3].color+'80;border:1px dashed '+POT[3].color+'40')+
          '">P3</span>';
      }
      // All done indicator
      if(remP1===0&&remP2===0&&remP3===0&&totalFamPicks>0){
        out+='<span style="font-size:10px;color:#00d4aa;margin-left:4px">✓ All drawn</span>';
      }
      out+='</div>';
    }
    out+='</div>'; // end header

    // Member rows
    fam.members.forEach(function(mem){
      var isActive=mem.active!==false;
      var teams=allocs[mem.id]||[];
      var memP1=teams.filter(function(t){return CFG.pot1.includes(t);});
      var memP2=teams.filter(function(t){return CFG.pot2.includes(t);});
      var memP3=teams.filter(function(t){return CFG.pot3.includes(t);});

      out+='<div style="padding:10px 14px;border-bottom:1px solid #ffffff08;'+(isActive?'':'opacity:.45;')+'display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">';

      // Name + active toggle
      out+='<div style="min-width:140px;display:flex;align-items:center;gap:8px">'+
        '<button onclick="toggleMember(\''+fam.id+'\',\''+mem.id+'\')" style="font-size:10px;padding:2px 7px;border-radius:4px;cursor:pointer;border:1px solid '+(isActive?'#00d4aa40':'#ffffff18')+';background:'+(isActive?'#00d4aa14':'transparent')+';color:'+(isActive?'#00d4aa':'#5a6a88')+'">'+
          (isActive?'✓ Active':'Inactive')+

// Adjust family pick count
function adjustFamPick(famId,type,delta){
  var b=CFG.familyBuys[famId]||{primaries:0,secondaries:0};

  // Calculate global claimed totals excluding this family
  var otherP1=0,otherP2=0;
  CFG.families.forEach(function(f){
    if(f.id===famId)return;
    var fb=CFG.familyBuys[f.id]||{primaries:0,secondaries:0};
    otherP1+=fb.primaries||0;
    otherP2+=fb.secondaries||0;
  });

  // Also: can't reduce below what's already drawn for this family
  var allocs=CFG.allocations||{};
  var famTeams=CFG.families.find(function(f){return f.id===famId;}).members
    .flatMap(function(m){return allocs[m.id]||[];});
  var drawnP1=famTeams.filter(function(t){return CFG.pot1.includes(t);}).length;
  var drawnP2=famTeams.filter(function(t){return CFG.pot2.includes(t);}).length;

  if(type==='p'){
    var maxP1=CFG.pot1.length-otherP1; // global pool minus others' claims
    b.primaries=Math.max(drawnP1, Math.min(maxP1, (b.primaries||0)+delta));
  }else{
    var maxP2=CFG.pot2.length-otherP2;
    b.secondaries=Math.max(drawnP2, Math.min(maxP2, (b.secondaries||0)+delta));
  }
  CFG.familyBuys[famId]=b;
  pushToGitHub(CFG);
  renderAdmin();
}

// Toggle member active/inactive
function toggleMember(famId,memId){
  var fam=CFG.families.find(function(f){return f.id===famId;});
  if(!fam)return;
  var mem=fam.members.find(function(m){return m.id===memId;});
  if(!mem)return;
  if(mem.active===false){
    // Reactivate
    mem.active=true;
  }else{
    // Deactivate — return their teams to pool
    mem.active=false;
    if(CFG.allocations[memId]&&CFG.allocations[memId].length){
      // Teams go back to available (remove from allocations)
      delete CFG.allocations[memId];
    }
  }
  pushToGitHub(CFG);
  renderAdmin();
}

function updatePrizeTotals(){
  var prizeKeys=['champion','runner','third','groupAdvance','goldenBoot','bestGD','worstGD','mostYellow','mostRed','firstGoal','mostCleanSheets','topFamily'];
  var total=prizeKeys.reduce(function(s,k){
    var el=document.getElementById('prize-'+k);
    var val=el?+(el.value)||0:0;
    var mult=k==='groupAdvance'?24:1;
    return s+(val*mult);
  },0);
  // Get pool from current admin inputs if available, else from CFG
  var cp=+(document.getElementById('cost-primary')||{value:CFG.primaryCost}).value||CFG.primaryCost;
  var cs=+(document.getElementById('cost-secondary')||{value:CFG.secondaryCost}).value||CFG.secondaryCost;
  var totalP=0,totalS=0;
  CFG.families.forEach(function(fam){
    var p=+(document.getElementById('buys-'+fam.id+'-p')||{value:CFG.familyBuys[fam.id]&&CFG.familyBuys[fam.id].primaries||0}).value;
    var s=+(document.getElementById('buys-'+fam.id+'-s')||{value:CFG.familyBuys[fam.id]&&CFG.familyBuys[fam.id].secondaries||0}).value;
    totalP+=p; totalS+=s;
  });
  var pool=(totalP*cp)+(totalS*cs);
  var color=total===pool?'#00d4aa':total<pool?'#fbbf24':'#ff4757';
  var status=total===pool?'✓ Balanced':total<pool?'$'+(pool-total)+' unallocated':'$'+(total-pool)+' over budget';
  var badge=document.getElementById('prize-total-badge');
  if(badge){badge.textContent='$'+total;badge.style.color=color;}
  var statusBadge=document.getElementById('prize-status-badge');
  if(statusBadge){statusBadge.textContent=status;statusBadge.style.color=color;statusBadge.style.background=color+'18';statusBadge.style.borderColor=color+'30';}
  var bar=document.getElementById('prize-bar');
  if(bar){bar.style.width=pool>0?Math.min(100,Math.round(total/pool*100))+'%':'0%';bar.style.background=color;}
  var lbl=document.getElementById('prize-bar-label');
  if(lbl){lbl.textContent=Math.round(total/Math.max(pool,1)*100)+'% of pool allocated · '+status;lbl.style.color=color;}
}

let spinMemberId,spinMemberName,spinFamColor,spinPot,spinTeams,spinWinner,spinPhase,spinAnimId;

function removeTeam(memberId,teamName){
  if(!CFG.allocations[memberId])return;
  CFG.allocations[memberId]=CFG.allocations[memberId].filter(function(t){return t!==teamName;});
  if(!CFG.allocations[memberId].length)delete CFG.allocations[memberId];
  pushToGitHub(CFG);
  if(activeTab==='admin')renderAdmin();
  else renderSweep();
}

function startSpin(memberId,memberName,famColor,pot){
  var allocated=new Set(Object.values(CFG.allocations||{}).flat());
  var available=CFG['pot'+pot].filter(function(t){return !allocated.has(t);});
  if(!available.length){alert('No teams left in Pot '+pot+'!');return;}

  spinMemberId=memberId;spinMemberName=memberName;spinFamColor=famColor;spinPot=pot;

  // For Pot 1: if elite teams (top 8) are still available, restrict spin to those.
  // Once all elite are drawn, open up to full pot.
  var spinPool=available;
  if(pot===1){
    var eliteAvailable=available.filter(function(t){return CFG.pot1.indexOf(t)<8;});
    if(eliteAvailable.length>0){
      spinPool=eliteAvailable; // must draw from elite until exhausted
    }
  }

  // Build reel: repeat pool enough times to fill ~36 slots, then shuffle
  var repeats=Math.ceil(36/spinPool.length);
  var reelSource=[];
  for(var r=0;r<repeats;r++) reelSource=reelSource.concat(spinPool);
  spinTeams=shuffle(reelSource.slice(0,36));
  spinWinner=null;spinPhase='ready';

  const box=document.getElementById('spin-box');
  box.style.borderColor=POT[pot].color+'50';

  document.getElementById('spin-highlight').style.borderColor=POT[pot].color+'80';

  renderSpinner();
  document.getElementById('spin-overlay').classList.add('show');
}

function renderSpinner(){
  var p=POT[spinPot];
  var pot1Elite=spinPot===1?CFG.pot1.slice(0,8):[];
  // Check if we're in elite-only mode
  var eliteStillAvail=spinPot===1&&spinTeams.some(function(t){return CFG.pot1.indexOf(t)<8;});
  var allEliteGone=spinPot===1&&!eliteStillAvail;
  var eliteNote='';
  if(spinPot===1){
    eliteNote=eliteStillAvail
      ?'<div style="display:inline-block;margin-top:6px;font-size:11px;background:#fbbf2414;border:1px solid #fbbf2430;border-radius:4px;padding:2px 10px;color:#fbbf24">★ Drawing from Elite top 8 only</div>'
      :'<div style="display:inline-block;margin-top:6px;font-size:11px;background:#ffffff0a;border:1px solid #ffffff18;border-radius:4px;padding:2px 10px;color:#8b9ab8">All elite drawn — drawing from remaining Pot 1</div>';
  }
  document.getElementById('spin-header').innerHTML=
    '<div class="font-display" style="font-weight:800;font-size:22px;color:'+spinFamColor+'">'+h(spinMemberName)+'</div>'+
    '<div style="font-size:12px;color:#5a6a88;margin-top:4px">Drawing from <span style="color:'+p.color+';font-weight:600">'+p.label+'</span> — '+p.desc+'</div>'+
    eliteNote;

  document.getElementById('spin-reel').innerHTML=spinTeams.map(function(t,i){
    var isElite=pot1Elite.indexOf(t)>=0;
    var star=isElite?'<span style="color:#fbbf24;font-size:14px;margin-right:3px">★</span>':'';
    var col=isElite?'color:#fbbf24':'color:#e8eeff';
    return '<div class="spin-item" data-idx="'+i+'" style="'+col+'">'+star+f(t)+' '+h(t)+'</div>';
  }).join('');

  if(spinPhase==='ready'){
    document.getElementById('spin-reel').style.transform='translateY(0)';
    document.getElementById('spin-controls').innerHTML=
      '<button class="btn btn-accent btn-lg" style="width:100%" onclick="doSpin()">🎰 SPIN</button>'+
      '<button class="btn" style="width:100%;margin-top:8px;padding:8px" onclick="closeSpin()">Cancel</button>';
  }else if(spinPhase==='spinning'){
    document.getElementById('spin-controls').innerHTML='<div class="font-display pulse" style="font-size:16px;color:#5a6a88;padding:14px;text-align:center;letter-spacing:.1em;text-transform:uppercase">Drawing…</div>';
  }else if(spinPhase==='result'){
    var isEliteWinner=spinPot===1&&CFG.pot1.indexOf(spinWinner)>=0&&CFG.pot1.indexOf(spinWinner)<8;
    var eliteBadge=isEliteWinner?'<div style="display:inline-block;background:#fbbf2420;border:1px solid #fbbf2440;border-radius:4px;padding:3px 10px;font-size:11px;color:#fbbf24;letter-spacing:.06em;margin-bottom:6px">★ ELITE PICK — TOP 8</div><br>':'';
    var winCol=isEliteWinner?'color:#fbbf24':'color:#00d4aa';
    document.getElementById('spin-controls').innerHTML=
      '<div style="text-align:center;margin:8px 0">'+eliteBadge+
      '<div class="font-display glow" style="font-weight:800;font-size:26px;letter-spacing:.05em;'+winCol+'">'+f(spinWinner)+' '+h(spinWinner)+'!</div></div>'+
      '<div style="display:flex;gap:8px;margin-top:4px">'+
      '<button class="btn btn-accent" style="flex:1;padding:12px;font-size:15px" onclick="confirmSpin()">✓ CONFIRM</button>'+
      '<button class="btn" style="padding:12px 14px" onclick="doRespin()">Respin</button>'+
      '<button class="btn" style="padding:12px 14px" onclick="closeSpin()">×</button>'+
      '</div>';
  }
}

function doRespin(){spinPhase='ready';spinWinner=null;renderSpinner();}
function doSpin(){
  spinPhase='spinning';
  renderSpinner();
  const itemH=36,duration=2800+Math.random()*800;
  const winIdx=Math.floor(Math.random()*12)+10;
  const finalY=-(winIdx*itemH)+((80-itemH)/2);
  const start=Date.now();
  function ease(t){return 1-Math.pow(1-t,4);}
  function step(){
    const prog=Math.min((Date.now()-start)/duration,1);
    const y=ease(prog)*finalY;
    document.getElementById('spin-reel').style.transform=`translateY(${y}px)`;
    if(prog<1){spinAnimId=requestAnimationFrame(step);}
    else{
      spinWinner=spinTeams[winIdx];
      spinPhase='result';
      renderSpinner();
    }
  }
  spinAnimId=requestAnimationFrame(step);
}

function confirmSpin(){
  if(!spinWinner)return;
  var current=CFG.allocations[spinMemberId]||[];
  CFG.allocations[spinMemberId]=current.concat([spinWinner]);
  pushToGitHub(CFG);
  closeSpin();
  // Re-render whichever tab is active
  if(activeTab==='admin')renderAdmin();
  else renderSweep();
  // Always keep sweep leaderboard fresh too
  if(activeTab!=='sweep')renderSweep();
}

function closeSpin(){
  if(spinAnimId)cancelAnimationFrame(spinAnimId);
  document.getElementById('spin-overlay').classList.remove('show');
}

function renderPredictions(){
  var allocs=CFG.allocations||{};
  var ELO_MIN=1550,ELO_MAX=2100;

  // Build member→teams lookup
  var memberTeams={};
  CFG.families.forEach(function(fam){
    fam.members.forEach(function(mem){
      memberTeams[mem.id]={name:mem.name,famName:fam.name,famColor:fam.color,teams:allocs[mem.id]||[]};
    });
  });

  // Sweepstake value: sum of Elo for each person's teams
  var personElo=Object.entries(memberTeams).map(function(e){
    var id=e[0],info=e[1];
    var totalElo=info.teams.reduce(function(s,t){return s+(ELO[t]||1700);},0);
    var totalOdds=info.teams.reduce(function(s,t){return s+(ODDS[t]||0);},0);
    return{id:id,name:info.name,famName:info.famName,famColor:info.famColor,
      teams:info.teams,totalElo:totalElo,avgElo:info.teams.length?Math.round(totalElo/info.teams.length):0,
      totalOdds:totalOdds};
  }).filter(function(p){return p.teams.length>0;}).sort(function(a,b){return b.totalElo-a.totalElo;});

  // Group difficulty: average Elo of teams in each group
  var groupElo={};
  Object.keys(GC).forEach(function(g){
    var gTeams=MATCHES.filter(function(m){return m.g==='Group '+g;})
      .flatMap(function(m){return[m.t1,m.t2];})
      .filter(function(t){return isKnown(t);});
    var uniq=[...new Set(gTeams)];
    var avg=uniq.length?Math.round(uniq.reduce(function(s,t){return s+(ELO[t]||1700);},0)/uniq.length):0;
    groupElo[g]={avg:avg,teams:uniq};
  });

  // View toggle
  var out='<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">';
  out+='<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">View</span>';
  [['strength','Team Strength'],['sweep','Sweep Value'],['groups','Group Difficulty'],['h2h','Head-to-Head']].forEach(function(v){
    out+='<button class="btn'+(predView===v[0]?' btn-accent':'')+'" onclick="predView=\''+v[0]+'\';renderPredictions()">'+v[1]+'</button>';
  });
  out+='</div>';

  out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:14px">'+
    'Elo ratings: <a href="https://github.com/Hicruben/world-cup-2026-prediction-model" target="_blank" style="color:#60a5fa">Hicruben/world-cup-2026-prediction-model</a> (MIT) · '+
    'Win odds: Polymarket (pre-tournament) · Data as of June 2026'+
    '</div>';

  // ── STRENGTH VIEW ───────────────────────────────────────────────
  if(predView==='strength'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:12px">All 48 teams ranked by calibrated Elo rating. Higher = stronger. Colour shows pot tier.</div>';
    out+='<div class="card" style="overflow:hidden">';
    out+='<table><thead><tr>';
    out+='<th style="text-align:left;width:30px">#</th>';
    out+='<th style="text-align:left">Team</th>';
    out+='<th>Pot</th>';
    out+='<th>Elo</th>';
    out+='<th>Strength</th>';
    out+='<th>Win %</th>';
    out+='<th style="text-align:left">Owner</th>';
    out+='</tr></thead><tbody>';

    var allTeamsSorted=Object.keys(ELO).sort(function(a,b){return ELO[b]-ELO[a];});
    allTeamsSorted.forEach(function(team,rank){
      var elo=ELO[team]||1700;
      var odds=ODDS[team]||0;
      var pot=CFG.pot1.includes(team)?1:CFG.pot2.includes(team)?2:3;
      var potColor=POT[pot].color;
      var isElite=pot===1&&CFG.pot1.indexOf(team)<8;
      var barPct=Math.round((elo-ELO_MIN)/(ELO_MAX-ELO_MIN)*100);

      // Find owner
      var owner=null,ownerFam=null;
      CFG.families.forEach(function(fam){
        fam.members.forEach(function(mem){
          if((allocs[mem.id]||[]).includes(team)){owner=mem;ownerFam=fam;}
        });
      });

      out+='<tr style="border-bottom:1px solid #ffffff06">';
      out+='<td style="color:#5a6a88;font-size:11px;text-align:center">'+(rank+1)+'</td>';
      out+='<td style="text-align:left;font-weight:500;font-size:13px">'+f(team)+' '+h(team)+(isElite?' <span style="color:#fbbf24;font-size:10px">★</span>':'')+'</td>';
      out+='<td style="text-align:center"><span class="font-display" style="font-size:10px;font-weight:700;color:'+potColor+';background:'+potColor+'18;padding:1px 6px;border-radius:3px">P'+pot+'</span></td>';
      out+='<td style="text-align:center"><span class="font-display" style="font-weight:700;font-size:13px">'+elo+'</span></td>';
      out+='<td style="width:120px;padding:0 8px">';
      out+='<div style="height:6px;background:#ffffff10;border-radius:3px;overflow:hidden">';
      out+='<div style="height:100%;width:'+barPct+'%;background:'+potColor+';border-radius:3px"></div>';
      out+='</div></td>';
      out+='<td style="text-align:center;font-size:12px;color:'+(odds>=5?'#00d4aa':odds>=1?'#fbbf24':'#8b9ab8')+'">';
      out+=odds>=1?odds.toFixed(1)+'%':'<'+1+'%';
      out+='</td>';
      out+='<td style="text-align:left;font-size:11px">';
      if(owner){
        out+='<span style="color:'+ownerFam.color+';font-weight:600">'+h(owner.name.split(' ')[0])+'</span>';
      }else{
        out+='<span style="color:#5a6a88">—</span>';
      }
      out+='</td></tr>';
    });
    out+='</tbody></table></div>';

  // ── SWEEP VALUE VIEW ────────────────────────────────────────────
  }else if(predView==='sweep'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">How well did each participant do in the draw? Ranked by combined Elo of their teams. Higher = stronger draw.</div>';

    if(!personElo.length){
      out+='<div class="card-pad" style="text-align:center;color:#5a6a88;padding:40px">No teams allocated yet — run the draw in ⚙ Admin first</div>';
    }else{
      // Top/bottom picks callout
      var best=personElo[0],worst=personElo[personElo.length-1];
      out+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
      out+='<div class="card-pad" style="border-color:#00d4aa30;text-align:center">';
      out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:4px">🏆 Strongest Draw</div>';
      out+='<div style="font-weight:700;font-size:15px;color:#00d4aa">'+h(best.name)+'</div>';
      out+='<div style="font-size:11px;color:#5a6a88;margin-top:2px">Avg Elo '+best.avgElo+' · Win odds '+best.totalOdds.toFixed(1)+'%</div>';
      out+='</div>';
      out+='<div class="card-pad" style="border-color:#fbbf2430;text-align:center">';
      out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:4px">🤞 Underdog Draw</div>';
      out+='<div style="font-weight:700;font-size:15px;color:#fbbf24">'+h(worst.name)+'</div>';
      out+='<div style="font-size:11px;color:#5a6a88;margin-top:2px">Avg Elo '+worst.avgElo+' · Win odds '+worst.totalOdds.toFixed(1)+'%</div>';
      out+='</div></div>';

      // Full leaderboard
      out+='<div class="card">';
      out+='<table><thead><tr>';
      out+='<th style="width:30px">#</th><th style="text-align:left">Participant</th><th>Teams</th><th>Avg Elo</th><th>Win Chances</th><th style="text-align:left">Holdings</th>';
      out+='</tr></thead><tbody>';

      var maxElo=personElo[0].avgElo,minElo=personElo[personElo.length-1].avgElo;
      personElo.forEach(function(p,i){
        var barPct=maxElo>minElo?Math.round((p.avgElo-minElo)/(maxElo-minElo)*100):50;
        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        out+='<tr style="border-bottom:1px solid #ffffff06">';
        out+='<td style="text-align:center;font-size:13px">'+(medal||i+1)+'</td>';
        out+='<td style="text-align:left"><div style="font-weight:600;font-size:13px">'+h(p.name)+'</div>'+
          '<div style="font-size:10px;margin-top:1px"><span style="color:'+p.famColor+'">'+h(p.famName)+'</span></div></td>';
        out+='<td style="text-align:center;color:#5a6a88">'+p.teams.length+'</td>';
        out+='<td><div class="font-display" style="font-weight:700;font-size:14px;text-align:center">'+p.avgElo+'</div>'+
          '<div style="height:4px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-top:3px;width:80px;margin-left:auto;margin-right:auto">'+
          '<div style="height:100%;width:'+barPct+'%;background:#00d4aa;border-radius:2px"></div></div></td>';
        out+='<td style="text-align:center;font-size:12px;color:'+(p.totalOdds>=5?'#00d4aa':p.totalOdds>=1?'#fbbf24':'#8b9ab8')+'">';
        out+=p.totalOdds>=0.1?p.totalOdds.toFixed(1)+'%':'<0.1%';
        out+='</td>';
        out+='<td style="text-align:left"><div style="display:flex;flex-wrap:wrap;gap:3px">';
        p.teams.forEach(function(t){
          var elo=ELO[t]||1700;
          var strength=elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8';
          out+='<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:'+strength+'18;color:'+strength+';border:1px solid '+strength+'30">'+
            f(t)+' '+h(t)+'</span>';
        });
        out+='</div></td></tr>';
      });
      out+='</tbody></table></div>';
    }

  // ── GROUP DIFFICULTY VIEW ───────────────────────────────────────
  }else if(predView==='groups'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Average Elo strength of each group. Harder groups have stronger opponents to navigate through.</div>';

    var sortedGroups=Object.keys(groupElo).sort(function(a,b){return groupElo[b].avg-groupElo[a].avg;});
    var maxAvg=groupElo[sortedGroups[0]].avg,minAvg=groupElo[sortedGroups[sortedGroups.length-1]].avg;

    out+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">';
    sortedGroups.forEach(function(g,rank){
      var ge=groupElo[g];
      var c=GC[g]||'#888';
      var barPct=maxAvg>minAvg?Math.round((ge.avg-minAvg)/(maxAvg-minAvg)*100):50;
      var label=rank===0?'💀 Group of Death':rank===1?'🔥 Very Tough':rank<4?'💪 Tough':rank<8?'⚖️ Balanced':'😌 Manageable';

      out+='<div class="card-pad" style="border-color:'+c+'30">';
      out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      out+='<span class="font-display" style="font-weight:700;font-size:16px;color:'+c+'">Group '+g+'</span>';
      out+='<span style="font-size:11px;color:#5a6a88">'+label+'</span>';
      out+='</div>';
      out+='<div class="font-display" style="font-weight:800;font-size:24px;color:#f0f4ff;margin-bottom:6px">'+ge.avg+' <span style="font-size:12px;color:#5a6a88;font-weight:400">avg Elo</span></div>';
      out+='<div style="height:5px;background:#ffffff10;border-radius:3px;overflow:hidden;margin-bottom:10px">';
      out+='<div style="height:100%;width:'+barPct+'%;background:'+c+';border-radius:3px"></div></div>';

      ge.teams.sort(function(a,b){return (ELO[b]||1700)-(ELO[a]||1700);}).forEach(function(team){
        var elo=ELO[team]||1700;
        var eloBarPct=Math.round((elo-ELO_MIN)/(ELO_MAX-ELO_MIN)*100);
        var owner=null,ownerFam=null;
        CFG.families.forEach(function(fam){
          fam.members.forEach(function(mem){
            if((allocs[mem.id]||[]).includes(team)){owner=mem;ownerFam=fam;}
          });
        });
        out+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #ffffff06">';
        out+='<span style="font-size:14px;flex-shrink:0">'+f(team)+'</span>';
        out+='<div style="flex:1;min-width:0">';
        out+='<div style="display:flex;justify-content:space-between;align-items:center">';
        out+='<span style="font-size:12px;font-weight:500">'+h(team)+'</span>';
        out+='<span class="font-display" style="font-size:12px;font-weight:700;color:#8b9ab8">'+elo+'</span>';
        out+='</div>';
        out+='<div style="height:3px;background:#ffffff08;border-radius:2px;overflow:hidden;margin-top:3px">';
        out+='<div style="height:100%;width:'+eloBarPct+'%;background:'+(elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8')+';border-radius:2px"></div></div>';
        out+='</div>';
        if(owner){
          out+='<span style="font-size:10px;color:'+ownerFam.color+';font-weight:600;flex-shrink:0">'+h(owner.name.split(' ')[0])+'</span>';
        }
        out+='</div>';
      });
      out+='</div>';
    });
    out+='</div>';

  // ── HEAD TO HEAD VIEW ───────────────────────────────────────────
  }else if(predView==='h2h'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Dixon-Coles model: pick any two teams to see predicted win/draw/loss probabilities.</div>';

    var allTeamNames=Object.keys(ELO).sort();
    var teamAOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamA===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');
    var teamBOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamB===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');

    out+='<div class="card-pad" style="max-width:500px">';
    out+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">';
    out+='<select id="h2h-a" onchange="h2hTeamA=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamAOpts+'</select>';
    out+='<span class="font-display" style="font-weight:700;color:#5a6a88;font-size:18px">vs</span>';
    out+='<select id="h2h-b" onchange="h2hTeamB=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamBOpts+'</select>';
    out+='</div>';

    if(h2hTeamA&&h2hTeamB&&h2hTeamA!==h2hTeamB){
      var eloA=ELO[h2hTeamA]||1700,eloB=ELO[h2hTeamB]||1700;
      // Dixon-Coles simplified: logistic + draw adjustment
      var eloDiff=eloA-eloB;
      var pWinA=1/(1+Math.pow(10,-eloDiff/400));
      var drawProb=0.28-Math.abs(eloDiff)*0.00045; // flatter = more draws
      drawProb=Math.max(0.08,Math.min(0.35,drawProb));
      pWinA=(pWinA*(1-drawProb));
      var pWinB=(1-drawProb)-pWinA;
      var pWinAPct=Math.round(pWinA*100),drawPct=Math.round(drawProb*100),pWinBPct=100-pWinAPct-drawPct;

      // Expected goals (rough)
      var expGoalsA=(1.15+eloDiff*0.0004).toFixed(1);
      var expGoalsB=(1.15-eloDiff*0.0004).toFixed(1);

      var potA=CFG.pot1.includes(h2hTeamA)?1:CFG.pot2.includes(h2hTeamA)?2:3;
      var potB=CFG.pot1.includes(h2hTeamB)?1:CFG.pot2.includes(h2hTeamB)?2:3;

      out+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:16px">';
      // Team A
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamA)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamA)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloA+' · <span style="color:'+POT[potA].color+'">P'+potA+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#00d4aa;margin-top:8px">'+pWinAPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsA+'</div>';
      out+='</div>';
      // Draw
      out+='<div style="text-align:center;padding-top:40px">';
      out+='<div class="font-display" style="font-weight:700;font-size:20px;color:#5a6a88">'+drawPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">draw</div>';
      out+='</div>';
      // Team B
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamB)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamB)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloB+' · <span style="color:'+POT[potB].color+'">P'+potB+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#fbbf24;margin-top:8px">'+pWinBPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsB+'</div>';
      out+='</div>';
      out+='</div>';

      // Bar
      out+='<div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:8px">';
      out+='<div style="width:'+pWinAPct+'%;background:#00d4aa"></div>';
      out+='<div style="width:'+drawPct+'%;background:#5a6a88"></div>';
      out+='<div style="flex:1;background:#fbbf24"></div>';
      out+='</div>';
      out+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#5a6a88">';
      out+='<span>'+h(h2hTeamA)+' win</span><span>Draw</span><span>'+h(h2hTeamB)+' win</span></div>';
      out+='<div style="margin-top:12px;padding:8px 12px;background:#ffffff06;border-radius:6px;font-size:11px;color:#5a6a88">';
      out+='Model: Dixon-Coles bivariate Poisson · Elo difference: '+(eloA-eloB>0?'+':'')+(eloA-eloB)+' · Neutral venue assumed';
      out+='</div>';
    }else{
      out+='<div style="text-align:center;padding:20px;color:#5a6a88;font-size:13px">Select two different teams to compare</div>';
    }
    out+='</div>';
  }

  document.getElementById('tab-predictions').innerHTML=out;
}

var h2hTeamA='France',h2hTeamB='Spain';

</script>
</body>
</html>
