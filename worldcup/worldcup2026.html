const GH_API=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_PATH}`;
const CONFIG_URL=`https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${GH_PATH}?t=`;

async function fetchConfig(){
  try{
    const r=await fetch(CONFIG_URL+Date.now());
    if(!r.ok)throw new Error("not found");
    return await r.json();
  }catch{return null;}
}

async function pushConfig(cfg,token){
  if(!token)throw new Error("No token");
  // get current SHA
  const meta=await fetch(GH_API,{headers:{Authorization:`token ${token}`}});
  if(!meta.ok)throw new Error("GitHub API error: "+meta.status);
  const {sha}=await meta.json();
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
  const res=await fetch(GH_API,{
    method:"PUT",
    headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},
    body:JSON.stringify({message:"wc2026: update config",content,sha})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.message||"Push failed");}
  return true;
}

function App(){
  const[tab,setTab]=useState("sweep");
  const[cfg,setCfg]=useState(null);
  const[scores,setScores]=useState(loadSc);
  const[loadStatus,setLoadStatus]=useState("loading"); // loading|ok|fallback
  const[saveStatus,setSaveStatus]=useState(""); // saving|saved|error
  const[tokenInput,setTokenInput]=useState("");
  const[showTokenModal,setShowTokenModal]=useState(false);

  // Load config from GitHub on mount
  useEffect(()=>{
    fetchConfig().then(remote=>{
      if(remote){setCfg(remote);setLoadStatus("ok");}
      else{setCfg({...DEFAULT_CONFIG});setLoadStatus("fallback");}
    });
  },[]);

  const saveToGitHub=useCallback(async(newCfg)=>{
    const token=newCfg.githubToken||cfg?.githubToken||"";
    if(!token){setShowTokenModal(true);return false;}
    setSaveStatus("saving");
    try{
      await pushConfig(newCfg,token);
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus(""),3000);
      return true;
    }catch(e){
      setSaveStatus("error:"+e.message);
      setTimeout(()=>setSaveStatus(""),5000);
      return false;
    }
  },[cfg]);

  const updateCfg=useCallback(async(updates)=>{
    const next={...cfg,...updates};
    setCfg(next);
    await saveToGitHub(next);
  },[cfg,saveToGitHub]);

  // Match scores
  const updateScore=(key,s1,s2)=>{
    const next={...scores};
    if(s1===""&&s2===""){delete next[key];}else{next[key]={s1:s1===""?null:+s1,s2:s2===""?null:+s2};}
    setScores(next);saveSc(next);
  };

  const matches=useMemo(()=>BASE_MATCHES.map((m,i)=>{
    const sc=scores[`m${i}`];
    return{...m,_key:`m${i}`,score1:sc?.s1??null,score2:sc?.s2??null};
  }),[scores]);

  const gm=matches.filter(m=>m.g);
  const km=matches.filter(m=>!m.g);

  // Standings
  const standingsMap=useMemo(()=>{
    const sm={};
    gm.forEach(m=>{
      const g=m.g.replace("Group ","");
      if(!sm[g])sm[g]={};
      [m.t1,m.t2].forEach(t=>{if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
      if(m.score1!=null&&m.score2!=null){
        const s=sm[g];
        s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.score1;s[m.t1].ga+=m.score2;s[m.t2].gf+=m.score2;s[m.t2].ga+=m.score1;
        if(m.score1>m.score2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
        else if(m.score1<m.score2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
        else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
      }
    });
    return sm;
  },[gm]);

  const getTeamResult=useCallback((teamName)=>{
    if(!cfg)return"active";
    const fin=km.find(m=>m.round==="Final"&&m.score1!=null);
    if(fin){
      const w=fin.score1>fin.score2?fin.t1:fin.t2,l=fin.score1<fin.score2?fin.t1:fin.t2;
      if(teamName===w)return"champion";if(teamName===l)return"runner";
      const t3=km.find(m=>m.round==="Match for third place"&&m.score1!=null);
      if(t3&&teamName===(t3.score1>t3.score2?t3.t1:t3.t2))return"third";
    }
    const grp=gm.find(m=>m.t1===teamName||m.t2===teamName)?.g?.replace("Group ","");
    if(grp&&standingsMap[grp]){
      const sorted=Object.values(standingsMap[grp]).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
      if(sorted.slice(0,2).some(s=>s.name===teamName))return"advanced";
    }
    return"active";
  },[km,gm,standingsMap,cfg]);

  if(!cfg) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,letterSpacing:"0.1em",textTransform:"uppercase"}}>Loading…</div>;

  const TABS=[{id:"sweep",l:"🏆 Sweepstake"},{id:"groups",l:"Groups"},{id:"knockout",l:"Knockout"},{id:"stats",l:"Stats"},{id:"scores",l:"✏ Scores"},{id:"admin",l:"⚙ Admin"}];

  return(
    <div style={{maxWidth:1200,margin:"0 auto",padding:"0 16px 60px"}}>
      {/* Header */}
      <div style={{padding:"24px 0 0",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:30,letterSpacing:"-0.01em",lineHeight:1}}>
              <span style={{color:"#00d4aa"}}>FIFA </span>World Cup<span style={{color:"#00d4aa"}}> 2026</span>
              <span style={{fontSize:14,fontWeight:500,color:"#5a6a88",marginLeft:12,letterSpacing:"0.02em"}}>Mackenzie Sweep</span>
            </div>
            <div style={{fontSize:11,color:"#5a6a88",marginTop:4,letterSpacing:"0.05em",textTransform:"uppercase"}}>Canada · USA · Mexico · Jun 11 – Jul 19</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {saveStatus==="saving"&&<span style={{fontSize:11,color:"#fbbf24",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em"}}>SAVING…</span>}
            {saveStatus==="saved"&&<span style={{fontSize:11,color:"#00d4aa",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em"}}>✓ SAVED TO GITHUB</span>}
            {saveStatus.startsWith("error")&&<span style={{fontSize:11,color:"#ff4757",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em"}}>⚠ {saveStatus.slice(6)}</span>}
            {loadStatus==="fallback"&&<span style={{fontSize:11,padding:"3px 8px",background:"#fbbf2418",color:"#fbbf24",border:"1px solid #fbbf2430",borderRadius:4}}>Local mode — set GitHub token in Admin</span>}
            {loadStatus==="ok"&&<span style={{fontSize:11,padding:"3px 8px",background:"#00d4aa18",color:"#00d4aa",border:"1px solid #00d4aa30",borderRadius:4}}>✓ Synced with GitHub</span>}
          </div>
        </div>
        <div style={{marginTop:16,height:1,background:"linear-gradient(90deg,#00d4aa40,#60a5fa30,transparent)"}}/>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:2,borderBottom:"1px solid #ffffff10",marginBottom:20,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"9px 16px",fontSize:12,cursor:"pointer",border:"none",borderBottom:tab===t.id?"2px solid #00d4aa":"2px solid transparent",background:"none",color:tab===t.id?"#00d4aa":"#5a6a88",fontWeight:tab===t.id?700:400,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.06em",textTransform:"uppercase",transition:"color 0.15s",whiteSpace:"nowrap"}}>{t.l}</button>
        ))}
      </div>

      {tab==="sweep"&&<SweepTab cfg={cfg} updateCfg={updateCfg} getTeamResult={getTeamResult}/>}
      {tab==="groups"&&<GroupsTab standingsMap={standingsMap} matches={gm}/>}
      {tab==="knockout"&&<KnockoutTab matches={km}/>}
      {tab==="stats"&&<StatsTab standingsMap={standingsMap} matches={gm}/>}
      {tab==="scores"&&<ScoresTab matches={matches} updateScore={updateScore}/>}
      {tab==="admin"&&<AdminTab cfg={cfg} updateCfg={updateCfg} saveToGitHub={saveToGitHub}/>}

      {/* Token modal */}
      {showTokenModal&&(
        <div className="spin-overlay" onClick={()=>setShowTokenModal(false)}>
          <div className="spin-box" onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:20,marginBottom:12}}>GitHub Token Required</div>
            <div style={{fontSize:13,color:"#8b9ab8",marginBottom:16,lineHeight:1.5}}>
              Generate a Personal Access Token at <strong style={{color:"#60a5fa"}}>github.com → Settings → Developer settings → Fine-grained tokens</strong>. Give it Contents: Read & Write on the portfolio repo.
            </div>
            <input value={tokenInput} onChange={e=>setTokenInput(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" style={{width:"100%",padding:"10px 14px",background:"#1a2235",border:"1px solid #ffffff22",borderRadius:6,color:"#e8eeff",fontSize:13,fontFamily:"'Barlow',sans-serif",marginBottom:10}}/>
            <div style={{display:"flex",gap:8"}}>
              <button onClick={()=>{updateCfg({...cfg,githubToken:tokenInput});setShowTokenModal(false);}} style={{flex:1,padding:"10px",background:"#00d4aa18",border:"1px solid #00d4aa40",borderRadius:6,color:"#00d4aa",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer",letterSpacing:"0.06em"}}>SAVE TOKEN</button>
              <button onClick={()=>setShowTokenModal(false)} style={{padding:"10px 16px",background:"none",border:"1px solid #ffffff18",borderRadius:6,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer"}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// SWEEP TAB
// ══════════════════════════════════════════════════════════════════════════════
function SweepTab({cfg,updateCfg,getTeamResult}){
  const[spinning,setSpinning]=useState(false);
  const[spinState,setSpinState]=useState(null);
  // spinState = {pot, familyId, memberId, memberName, familyColor, teams, winner, done}
  const[pendingAllocation,setPendingAllocation]=useState(null);

  const allMembers=cfg.families.flatMap(fam=>fam.members.map(m=>({...m,familyId:fam.id,familyName:fam.name,familyColor:fam.color})));

  // Calculate which slots each person has
  const personSlots=useMemo(()=>{
    const slots={};
    allMembers.forEach(m=>{slots[m.id]={pot1:[],pot2:[],pot3:[]};});
    const allocs=cfg.allocations||{};
    Object.entries(allocs).forEach(([memberId,teams])=>{
      if(!slots[memberId])return;
      (teams||[]).forEach(team=>{
        if(cfg.pot1.includes(team))slots[memberId].pot1.push(team);
        else if(cfg.pot2.includes(team))slots[memberId].pot2.push(team);
        else if(cfg.pot3.includes(team))slots[memberId].pot3.push(team);
      });
    });
    return slots;
  },[allMembers,cfg]);

  // Allocated teams
  const allocatedTeams=useMemo(()=>{
    const set=new Set();
    Object.values(cfg.allocations||{}).forEach(teams=>(teams||[]).forEach(t=>set.add(t)));
    return set;
  },[cfg.allocations]);

  // Leaderboard
  const leaderboard=useMemo(()=>{
    return allMembers.map(m=>{
      const teams=cfg.allocations?.[m.id]||[];
      let pts=0,notes=[];
      teams.forEach(t=>{
        const r=getTeamResult(t);
        if(r==="champion"){pts+=cfg.prizes.champion;notes.push(`${t} 🏆`);}
        else if(r==="runner"){pts+=cfg.prizes.runner;notes.push(`${t} 🥈`);}
        else if(r==="third"){pts+=cfg.prizes.third;notes.push(`${t} 🥉`);}
        else if(r==="advanced"){pts+=cfg.prizes.groupAdvance;notes.push(`${t} ✓`);}
      });
      const fam=cfg.families.find(f=>f.id===m.familyId);
      return{...m,pts,notes,teams,familyColor:fam?.color||"#888"};
    }).sort((a,b)=>b.pts-a.pts);
  },[allMembers,cfg,getTeamResult]);

  const familyTotals=useMemo(()=>{
    const ft={};
    cfg.families.forEach(fam=>{ft[fam.id]={name:fam.name,color:fam.color,pts:0,paid:0};});
    allMembers.forEach(m=>{
      const buys=cfg.familyBuys?.[m.familyId];
      // contribution per member is rough — just show family total
    });
    leaderboard.forEach(p=>{if(ft[p.familyId])ft[p.familyId].pts+=p.pts;});
    cfg.families.forEach(fam=>{
      const buys=cfg.familyBuys?.[fam.id]||{primaries:0,secondaries:0};
      ft[fam.id].paid=(buys.primaries*cfg.primaryCost)+(buys.secondaries*cfg.secondaryCost);
    });
    return ft;
  },[cfg,allMembers,leaderboard]);

  // Spin a team from a pot for a member
  function startSpin(memberId,memberName,familyColor,pot){
    const available=(pot===1?cfg.pot1:pot===2?cfg.pot2:cfg.pot3).filter(t=>!allocatedTeams.has(t));
    if(!available.length){alert("No teams left in this pot!");return;}
    const teams=shuffle([...available,...available,...available,...available].slice(0,40));
    setSpinState({pot,memberId,memberName,familyColor,teams,winner:null,done:false});
    setSpinning(true);
  }

  function confirmAllocation(memberId,team){
    const current=cfg.allocations?.[memberId]||[];
    const next={...cfg.allocations,[memberId]:[...current,team]};
    updateCfg({...cfg,allocations:next});
    setSpinning(false);setSpinState(null);
  }

  // Build draft order for cycle picks (Pot 1 and Pot 2)
  const cycleOrder=cfg.cycleOrder||cfg.families.map(f=>f.id);

  // Total primaries/secondaries
  const totalPrimaries=Object.values(cfg.familyBuys||{}).reduce((s,b)=>s+(b.primaries||0),0);
  const totalSecondaries=Object.values(cfg.familyBuys||{}).reduce((s,b)=>s+(b.secondaries||0),0);
  const totalPool=(totalPrimaries*cfg.primaryCost)+(totalSecondaries*cfg.secondaryCost);
  const pot1Allocated=[...allocatedTeams].filter(t=>cfg.pot1.includes(t)).length;
  const pot2Allocated=[...allocatedTeams].filter(t=>cfg.pot2.includes(t)).length;
  const pot3Allocated=[...allocatedTeams].filter(t=>cfg.pot3.includes(t)).length;

  const tagColor=r=>{
    if(r==="champion")return{bg:"#a78bfa20",col:"#a78bfa",border:"1px solid #a78bfa40"};
    if(r==="runner")return{bg:"#60a5fa18",col:"#60a5fa",border:"1px solid #60a5fa30"};
    if(r==="third"||r==="advanced")return{bg:"#00d4aa18",col:"#00d4aa",border:"1px solid #00d4aa30"};
    return{bg:"#ffffff08",col:"#8b9ab8",border:"1px solid #ffffff10"};
  };

  return(
    <div>
      {/* Prize pool & pot progress */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:20}}>
        {[
          {label:"Prize Pool",val:`$${totalPool}`,sub:`${totalPrimaries}× primary · ${totalSecondaries}× secondary`,col:"#00d4aa"},
          {label:"Pot 1",val:`${pot1Allocated}/${cfg.pot1.length}`,sub:"Elite teams allocated",col:POT_STYLE[1].color},
          {label:"Pot 2",val:`${pot2Allocated}/${cfg.pot2.length}`,sub:"Mid-tier allocated",col:POT_STYLE[2].color},
          {label:"Pot 3",val:`${pot3Allocated}/${cfg.pot3.length}`,sub:"Underdog allocated",col:POT_STYLE[3].color},
        ].map(item=>(
          <div key={item.label} style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,padding:"12px 16px"}}>
            <div style={{fontSize:11,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>{item.label}</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:28,color:item.col,lineHeight:1}}>{item.val}</div>
            <div style={{fontSize:11,color:"#5a6a88",marginTop:4}}>{item.sub}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

        {/* LEFT: Team allocation */}
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:15,letterSpacing:"0.08em",textTransform:"uppercase",color:"#8b9ab8",marginBottom:12}}>Team Allocation</div>

          {cfg.families.map(fam=>{
            const buys=cfg.familyBuys?.[fam.id]||{primaries:0,secondaries:0};
            return(
              <div key={fam.id} style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,overflow:"hidden",marginBottom:12}}>
                <div style={{padding:"10px 14px",background:fam.color+"14",borderBottom:"1px solid "+fam.color+"25",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:15,letterSpacing:"0.06em",color:fam.color,textTransform:"uppercase"}}>{fam.name}</span>
                  <span style={{fontSize:11,color:"#5a6a88"}}>{buys.primaries}× primary (${ buys.primaries*cfg.primaryCost}) · {buys.secondaries}× secondary (${ buys.secondaries*cfg.secondaryCost})</span>
                </div>
                {fam.members.map(member=>{
                  const slots=personSlots[member.id]||{pot1:[],pot2:[],pot3:[]};
                  const allTeams=[...slots.pot1,...slots.pot2,...slots.pot3];
                  const needsPot1=slots.pot1.length<buys.primaries;
                  const needsPot2=slots.pot2.length<buys.secondaries;
                  const needsPot3=slots.pot3.length<buys.primaries;
                  return(
                    <div key={member.id} style={{padding:"10px 14px",borderBottom:"1px solid #ffffff08"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <span style={{fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}}>
                          {member.name}
                          {member.type==="child"&&<span style={{fontSize:10,padding:"1px 5px",background:"#ffffff10",color:"#5a6a88",borderRadius:3}}>child</span>}
                        </span>
                        <div style={{display:"flex",gap:5}}>
                          {needsPot1&&<button onClick={()=>startSpin(member.id,member.name,fam.color,1)} style={{fontSize:10,padding:"3px 8px",background:POT_STYLE[1].bg,border:"1px solid "+POT_STYLE[1].color+"40",borderRadius:4,cursor:"pointer",color:POT_STYLE[1].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.04em"}}>+ P1</button>}
                          {needsPot2&&<button onClick={()=>startSpin(member.id,member.name,fam.color,2)} style={{fontSize:10,padding:"3px 8px",background:POT_STYLE[2].bg,border:"1px solid "+POT_STYLE[2].color+"40",borderRadius:4,cursor:"pointer",color:POT_STYLE[2].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.04em"}}>+ P2</button>}
                          {needsPot3&&<button onClick={()=>startSpin(member.id,member.name,fam.color,3)} style={{fontSize:10,padding:"3px 8px",background:POT_STYLE[3].bg,border:"1px solid "+POT_STYLE[3].color+"40",borderRadius:4,cursor:"pointer",color:POT_STYLE[3].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.04em"}}>+ P3</button>}
                        </div>
                      </div>
                      {allTeams.length>0?(
                        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                          {slots.pot1.map(t=>{const r=getTeamResult(t);const{bg,col,border}=tagColor(r);return(
                            <span key={t} style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:bg,color:col,border,display:"inline-flex",alignItems:"center",gap:4,fontWeight:600}}>
                              <span style={{fontSize:9,color:POT_STYLE[1].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>P1</span>
                              {f(t)} {t}
                              <span onClick={()=>{const next={...cfg.allocations,[member.id]:(cfg.allocations?.[member.id]||[]).filter(x=>x!==t)};updateCfg({...cfg,allocations:next});}} style={{cursor:"pointer",opacity:0.4,fontSize:10}}>×</span>
                            </span>
                          );})}
                          {slots.pot2.map(t=>{const r=getTeamResult(t);const{bg,col,border}=tagColor(r);return(
                            <span key={t} style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:bg,color:col,border,display:"inline-flex",alignItems:"center",gap:4,fontWeight:600}}>
                              <span style={{fontSize:9,color:POT_STYLE[2].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>P2</span>
                              {f(t)} {t}
                              <span onClick={()=>{const next={...cfg.allocations,[member.id]:(cfg.allocations?.[member.id]||[]).filter(x=>x!==t)};updateCfg({...cfg,allocations:next});}} style={{cursor:"pointer",opacity:0.4,fontSize:10}}>×</span>
                            </span>
                          );})}
                          {slots.pot3.map(t=>{const r=getTeamResult(t);const{bg,col,border}=tagColor(r);return(
                            <span key={t} style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:bg,color:col,border,display:"inline-flex",alignItems:"center",gap:4,fontWeight:600}}>
                              <span style={{fontSize:9,color:POT_STYLE[3].color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>P3</span>
                              {f(t)} {t}
                              <span onClick={()=>{const next={...cfg.allocations,[member.id]:(cfg.allocations?.[member.id]||[]).filter(x=>x!==t)};updateCfg({...cfg,allocations:next});}} style={{cursor:"pointer",opacity:0.4,fontSize:10}}>×</span>
                            </span>
                          );})}
                        </div>
                      ):(
                        <div style={{fontSize:12,color:"#5a6a88",fontStyle:"italic"}}>No teams assigned yet</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>

        {/* RIGHT: Leaderboard */}
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:15,letterSpacing:"0.08em",textTransform:"uppercase",color:"#8b9ab8",marginBottom:12}}>Live Standings</div>

          {/* Family summary */}
          <div style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:"#5a6a88",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>By Family</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {cfg.families.map(fam=>{
                const ft=familyTotals[fam.id];
                return(
                  <div key={fam.id} style={{flex:1,minWidth:100,background:fam.color+"0c",border:"1px solid "+fam.color+"25",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:12,color:fam.color,textTransform:"uppercase",letterSpacing:"0.05em"}}>{fam.name}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:"#f0f4ff",margin:"2px 0"}}>${ft?.pts||0}</div>
                    <div style={{fontSize:10,color:"#5a6a88"}}>paid ${ft?.paid||0}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Individual leaderboard */}
          <div style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:"#5a6a88",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>By Individual</div>
            {leaderboard.map((p,i)=>{
              const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":null;
              return(
                <div key={p.id} className="fade-in" style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 0",borderBottom:"1px solid #ffffff08"}}>
                  <span style={{width:20,flexShrink:0,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,color:"#5a6a88",fontSize:13}}>{medal||i+1}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}}>
                      {p.name}
                      <span style={{fontSize:10,padding:"1px 5px",background:p.familyColor+"18",color:p.familyColor,borderRadius:3,border:"1px solid "+p.familyColor+"30"}}>{p.familyName}</span>
                    </div>
                    {p.notes.length>0&&<div style={{fontSize:11,color:"#5a6a88",marginTop:2}}>{p.notes.join(" · ")}</div>}
                  </div>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:18,color:i===0&&p.pts>0?"#00d4aa":"#f0f4ff",flexShrink:0}}>${p.pts}</span>
                </div>
              );
            })}
            {leaderboard.every(p=>p.pts===0)&&(
              <div style={{textAlign:"center",padding:"20px",color:"#5a6a88",fontSize:13}}>Standings update as results come in</div>
            )}
          </div>

          {/* Prize structure */}
          <div style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,padding:"12px 16px",marginTop:14}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,color:"#5a6a88",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>Prize Structure</div>
            {[["🏆","Champion","champion"],["🥈","Runner-up","runner"],["🥉","3rd Place","third"],["✓","Group Advance","groupAdvance"]].map(([icon,label,key])=>(
              <div key={key} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12,borderBottom:"1px solid #ffffff06"}}>
                <span style={{color:"#8b9ab8"}}>{icon} {label}</span>
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,color:"#f0f4ff"}}>${cfg.prizes[key]}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Spin overlay */}
      {spinning&&spinState&&(
        <SpinnerOverlay
          spinState={spinState}
          onConfirm={confirmAllocation}
          onCancel={()=>{setSpinning(false);setSpinState(null);}}
        />
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// SPINNER OVERLAY
// ══════════════════════════════════════════════════════════════════════════════
function SpinnerOverlay({spinState,onConfirm,onCancel}){
  const{pot,memberId,memberName,familyColor,teams}=spinState;
  const[phase,setPhase]=useState("ready"); // ready|spinning|result
  const[offset,setOffset]=useState(0);
  const[winner,setWinner]=useState(null);
  const[winnerIdx,setWinnerIdx]=useState(null);
  const reelRef=useRef(null);
  const animRef=useRef(null);
  const startTimeRef=useRef(null);
  const potStyle=POT_STYLE[pot];

  // Slot machine animation
  function startSpin(){
    setPhase("spinning");
    const duration=3000+Math.random()*1000;
    const totalItems=teams.length;
    const itemH=40;
    // Pick a winner index
    const winIdx=Math.floor(Math.random()*Math.min(teams.length,16))+8;
    const finalOffset=-(winIdx*itemH)+(80/2)-(itemH/2);

    startTimeRef.current=Date.now();
    const startOffset=0;

    function easeOut(t){return 1-Math.pow(1-t,4);}

    function animate(){
      const elapsed=Date.now()-startTimeRef.current;
      const progress=Math.min(elapsed/duration,1);
      const eased=easeOut(progress);
      const currentOffset=startOffset+(finalOffset-startOffset)*eased;
      setOffset(currentOffset);
      if(progress<1){
        animRef.current=requestAnimationFrame(animate);
      }else{
        setWinner(teams[winIdx]);
        setWinnerIdx(winIdx);
        setPhase("result");
      }
    }
    animRef.current=requestAnimationFrame(animate);
  }

  useEffect(()=>()=>{if(animRef.current)cancelAnimationFrame(animRef.current);},[]);

  return(
    <div className="spin-overlay">
      <div className="spin-box" style={{border:"1px solid "+potStyle.color+"40"}}>
        {/* Header */}
        <div style={{marginBottom:4}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:22,color:familyColor}}>{memberName}</div>
          <div style={{fontSize:12,color:"#5a6a88",marginTop:2}}>Drawing from <span style={{color:potStyle.color,fontWeight:600}}>{potStyle.label}</span> — {potStyle.desc}</div>
        </div>

        {/* Slot window */}
        <div className="spin-window" style={{border:"1px solid "+potStyle.color+"30"}}>
          <div className="spin-highlight" style={{borderColor:potStyle.color+"80"}}/>
          <div ref={reelRef} className="spin-reel" style={{transform:`translateY(${offset}px)`}}>
            {teams.map((t,i)=>(
              <div key={i} className="spin-item" style={{color:phase==="result"&&i===winnerIdx?potStyle.color:"#f0f4ff",fontSize:phase==="result"&&i===winnerIdx?24:20}}>
                {f(t)} {t}
              </div>
            ))}
          </div>
        </div>

        {/* Controls */}
        {phase==="ready"&&(
          <div>
            <button onClick={startSpin} style={{width:"100%",padding:"14px",background:potStyle.color+"20",border:"1px solid "+potStyle.color+"50",borderRadius:8,color:potStyle.color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:20,cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase"}}>
              🎰 SPIN
            </button>
            <button onClick={onCancel} style={{width:"100%",marginTop:8,padding:"8px",background:"none",border:"1px solid #ffffff14",borderRadius:6,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,cursor:"pointer"}}>Cancel</button>
          </div>
        )}

        {phase==="spinning"&&(
          <div style={{padding:"14px",textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,color:"#5a6a88",letterSpacing:"0.1em"}} className="pulse">DRAWING…</div>
        )}

        {phase==="result"&&winner&&(
          <div>
            <div className="winner-glow" style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:26,color:potStyle.color,textAlign:"center",margin:"8px 0",letterSpacing:"0.05em"}}>
              {f(winner)} {winner}!
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>onConfirm(memberId,winner)} style={{flex:1,padding:"12px",background:potStyle.color+"20",border:"1px solid "+potStyle.color+"50",borderRadius:8,color:potStyle.color,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:16,cursor:"pointer",letterSpacing:"0.08em"}}>
                ✓ CONFIRM
              </button>
              <button onClick={()=>{setPhase("ready");setWinner(null);setOffset(0);}} style={{padding:"12px 16px",background:"none",border:"1px solid #ffffff18",borderRadius:8,color:"#8b9ab8",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer"}}>
                Respin
              </button>
              <button onClick={onCancel} style={{padding:"12px 16px",background:"none",border:"1px solid #ffffff14",borderRadius:8,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,cursor:"pointer"}}>×</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function GroupsTab({standingsMap,matches}){
  const letters=Object.keys(standingsMap).sort();

    <div style={{textAlign:"center",padding:"60px 20px",color:"#5a6a88"}}>
      <div style={{fontSize:40,marginBottom:12}}>⚽</div>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,color:"#8b9ab8"}}>Tournament kicks off June 11</div>
      <div style={{fontSize:13,marginTop:6}}>Enter scores in the <strong style={{color:"#00d4aa"}}>✏ Scores</strong> tab</div>
    </div>
  );
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
        {letters.map(g=>{
          const sorted=Object.values(standingsMap[g]).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
          const gm=matches.filter(m=>m.g==="Group "+g).sort((a,b)=>new Date(a.d)-new Date(b.d));
          const played=gm.filter(m=>m.score1!=null).length;
          const color=GC[g]||"#888";
          return(
            <div key={g} style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,overflow:"hidden"}}>
              <div style={{padding:"9px 12px",background:color+"18",borderBottom:"1px solid "+color+"25",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                <span style={{fontSize:11,color:"#5a6a88"}}>{played}/6 played</span>
              </div>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr>
                  {["","Team","P","W","D","L","GD","Pts"].map(h=><th key={h} style={{padding:"5px 5px",textAlign:h==="Team"?"left":"center",color:"#5a6a88",fontWeight:400,borderBottom:"1px solid #ffffff0a",fontSize:10,letterSpacing:"0.05em",textTransform:"uppercase"}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {sorted.map((s,i)=>{const gd=s.gf-s.ga;return(
                    <tr key={s.name} style={{background:i<2?color+"0c":"transparent",borderBottom:"1px solid #ffffff06"}}>

                      <td style={{textAlign:"center",padding:"6px 4px",fontSize:12}}>{s.w}</td>
                      <td style={{textAlign:"center",padding:"6px 4px",color:"#5a6a88",fontSize:12}}>{s.d}</td>
                      <td style={{textAlign:"center",padding:"6px 4px",color:"#5a6a88",fontSize:12}}>{s.l}</td>
                      <td style={{textAlign:"center",padding:"6px 4px",fontWeight:600,fontSize:12,color:gd>0?"#00d4aa":gd<0?"#ff4757":"#5a6a88"}}>{gd>0?"+":""}{gd}</td>

    </div>
  );
}

                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// STATS TAB
// ══════════════════════════════════════════════════════════════════════════════
function StatsTab({standingsMap,matches}){
  const[sort,setSort]=useState("pts");
  const allTeams=[...new Set(matches.flatMap(m=>[m.t1,m.t2]).filter(isKnown))].sort();
  const rows=allTeams.map(name=>{
    const grp=Object.entries(standingsMap).find(([,v])=>v[name])?.[0]||"?";
    const s=standingsMap[grp]?.[name]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    return{name,group:grp,...s,gd:s.gf-s.ga};
  }).sort((a,b)=>{
    if(sort==="pts")return b.pts-a.pts||b.gd-a.gd;
    if(sort==="gf")return b.gf-a.gf||b.pts-a.pts;
    if(sort==="gd")return b.gd-a.gd||b.gf-a.gf;
    if(sort==="ga")return a.ga-b.ga;
    return a.group.localeCompare(b.group);
  });
  const SB=({id,l})=><button onClick={()=>setSort(id)} style={{fontSize:11,padding:"3px 10px",border:"1px solid "+(sort===id?"#00d4aa":"#ffffff18"),borderRadius:4,cursor:"pointer",background:sort===id?"#00d4aa18":"transparent",color:sort===id?"#00d4aa":"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em",textTransform:"uppercase",fontWeight:600}}>{l}</button>;
  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.06em",textTransform:"uppercase",marginRight:4}}>Sort</span>
        <SB id="pts" l="Points"/><SB id="gf" l="Goals"/><SB id="gd" l="GD"/><SB id="ga" l="Fewest Conceded"/><SB id="grp" l="Group"/>
      </div>
      <div style={{background:"#111827",border:"1px solid #ffffff10",borderRadius:10,overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#ffffff05"}}>
            {["#","Team","Grp","Pld","W","D","L","GF","GA","GD","Pts"].map(h=><th key={h} style={{padding:"8px 7px",textAlign:h==="Team"?"left":"center",fontWeight:500,fontSize:10,color:"#5a6a88",borderBottom:"1px solid #ffffff0a",letterSpacing:"0.05em",textTransform:"uppercase"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {rows.map((r,i)=>{
              const c=GC[r.group]||"#888";
              return(
                <tr key={r.name} style={{borderBottom:"1px solid #ffffff06"}}>
                  <td style={{padding:"7px 7px",textAlign:"center",color:"#5a6a88",fontSize:11}}>{i+1}</td>
                  <td style={{padding:"7px 7px",fontWeight:500}}>{FLAGS[r.name]||"🏳️"} {r.name}</td>
                  <td style={{textAlign:"center",padding:"7px 5px"}}><span style={{fontSize:10,fontWeight:700,color:c,background:c+"18",padding:"1px 6px",borderRadius:3,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em"}}>{r.group}</span></td>
                  <td style={{textAlign:"center",padding:"7px 5px",color:"#5a6a88"}}>{r.p}</td>
                  <td style={{textAlign:"center",padding:"7px 5px"}}>{r.w}</td>
                  <td style={{textAlign:"center",padding:"7px 5px",color:"#5a6a88"}}>{r.d}</td>
                  <td style={{textAlign:"center",padding:"7px 5px",color:"#5a6a88"}}>{r.l}</td>
                  <td style={{textAlign:"center",padding:"7px 5px",fontWeight:r.gf>0?600:400}}>{r.gf}</td>
                  <td style={{textAlign:"center",padding:"7px 5px",color:"#5a6a88"}}>{r.ga}</td>
                  <td style={{textAlign:"center",padding:"7px 5px",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:14,color:r.gd>0?"#00d4aa":r.gd<0?"#ff4757":"#5a6a88"}}>{r.gd>0?"+":""}{r.gd}</td>
                  <td style={{textAlign:"center",padding:"7px 7px",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:16}}>{r.pts}</td>
                </tr>
              );
            })}
            {!rows.length&&<tr><td colSpan={11} style={{textAlign:"center",padding:"40px",color:"#5a6a88",fontSize:13}}>Stats populate once scores are entered</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// SCORES TAB
// ══════════════════════════════════════════════════════════════════════════════
function ScoresTab({matches,updateScore}){
  const[filter,setFilter]=useState("group");
  const[editKey,setEditKey]=useState(null);
  const[draft,setDraft]=useState({s1:"",s2:""});
  const filtered=matches.filter(m=>{
    if(filter==="group")return!!m.g;
    if(filter==="knockout")return!m.g;
    if(filter==="pending")return m.score1==null;
    if(filter==="done")return m.score1!=null;
    return true;
  });
  const startEdit=m=>{setEditKey(m._key);setDraft({s1:m.score1??"",s2:m.score2??""});};
  const commit=key=>{updateScore(key,draft.s1,draft.s2);setEditKey(null);};
  const clear=key=>{updateScore(key,"","");setEditKey(null);};
  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.06em",textTransform:"uppercase",marginRight:4}}>Show</span>
        {[["group","Group"],["knockout","Knockout"],["pending","Pending"],["done","Played"],["all","All"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{fontSize:11,padding:"3px 10px",border:"1px solid "+(filter===v?"#00d4aa":"#ffffff18"),borderRadius:4,cursor:"pointer",background:filter===v?"#00d4aa18":"transparent",color:filter===v?"#00d4aa":"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:"0.05em",textTransform:"uppercase",fontWeight:600}}>{l}</button>
        ))}
        <span style={{fontSize:11,color:"#5a6a88",marginLeft:6}}>Click a row to enter or edit</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        {filtered.map(m=>{
          const done=m.score1!=null,isEdit=editKey===m._key;
          const grpL=m.g?.replace("Group ","");
          const color=GC[grpL]||"#60a5fa";
          return(
            <div key={m._key} onClick={()=>!isEdit&&startEdit(m)}
              style={{display:"grid",gridTemplateColumns:"90px 1fr auto 1fr 90px",alignItems:"center",gap:8,padding:"9px 14px",background:"#111827",border:"1px solid "+(isEdit?"#00d4aa40":"#ffffff0e"),borderRadius:8,cursor:isEdit?"default":"pointer",fontSize:13,transition:"border-color 0.15s"}}>
              <div style={{fontSize:11}}>
                {grpL?<span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color,background:color+"18",padding:"2px 5px",borderRadius:3,letterSpacing:"0.05em"}}>{m.g}</span>
                  :<span style={{fontSize:10,color:"#5a6a88",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,letterSpacing:"0.04em",textTransform:"uppercase"}}>{m.round?.replace("Round of ","R")}</span>}
                <div style={{marginTop:4,color:"#5a6a88"}}>{fmtDate(m.d)}</div>
              </div>
              <span style={{fontWeight:done?600:400,textAlign:"right",color:done?"#e8eeff":"#8b9ab8"}}>{isKnown(m.t1)&&FLAGS[m.t1]+" "}{m.t1}</span>
              <div style={{minWidth:isEdit?210:80,textAlign:"center"}}>
                {isEdit?(
                  <div style={{display:"flex",alignItems:"center",gap:5}} onClick={e=>e.stopPropagation()}>
                    <input autoFocus type="number" min={0} max={20} value={draft.s1} onChange={e=>setDraft({...draft,s1:e.target.value})}
                      style={{width:40,textAlign:"center",fontSize:17,fontWeight:700,padding:"4px",background:"#1a2235",border:"1px solid #ffffff18",borderRadius:5,color:"#e8eeff",fontFamily:"'Barlow Condensed',sans-serif"}}/>
                    <span style={{fontWeight:700,color:"#5a6a88"}}>–</span>
                    <input type="number" min={0} max={20} value={draft.s2} onChange={e=>setDraft({...draft,s2:e.target.value})} onKeyDown={e=>e.key==="Enter"&&commit(m._key)}
                      style={{width:40,textAlign:"center",fontSize:17,fontWeight:700,padding:"4px",background:"#1a2235",border:"1px solid #ffffff18",borderRadius:5,color:"#e8eeff",fontFamily:"'Barlow Condensed',sans-serif"}}/>
                    <button onClick={()=>commit(m._key)} style={{fontSize:11,padding:"4px 10px",background:"#00d4aa18",border:"1px solid #00d4aa40",borderRadius:4,cursor:"pointer",color:"#00d4aa",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:"0.05em"}}>SAVE</button>
                    {done&&<button onClick={()=>clear(m._key)} style={{fontSize:11,padding:"4px 8px",background:"#ff475712",border:"1px solid #ff475730",borderRadius:4,cursor:"pointer",color:"#ff4757"}}>✕</button>}
                    <button onClick={()=>setEditKey(null)} style={{fontSize:11,padding:"4px 8px",background:"none",border:"1px solid #ffffff14",borderRadius:4,cursor:"pointer",color:"#5a6a88"}}>×</button>
                  </div>
                ):done?(
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:20,letterSpacing:"0.05em"}}>{m.score1} – {m.score2}</span>
                ):(
                  <span style={{fontSize:11,color:"#5a6a88",border:"1px dashed #ffffff14",padding:"3px 10px",borderRadius:4}}>click to enter</span>
                )}
              </div>
              <span style={{fontWeight:done?600:400,color:done?"#e8eeff":"#8b9ab8"}}>{m.t2} {isKnown(m.t2)&&FLAGS[m.t2]}</span>
              <span style={{fontSize:10,color:"#5a6a88",textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.gr}</span>
            </div>
          );
        })}
        {!filtered.length&&<div style={{textAlign:"center",padding:"40px",color:"#5a6a88",fontSize:13}}>No matches in this view</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
