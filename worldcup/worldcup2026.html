<title>⚽ World Cup 2026 — Mackenzie Sweep</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#080d18;color:#e8eeff;font-family:'Barlow',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 0%,#00d4aa14,transparent 55%),radial-gradient(ellipse 50% 40% at 85% 100%,#60a5fa12,transparent 55%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 80px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#111827}
::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:2px}
/* Typography */
.font-display{font-family:'Barlow Condensed',sans-serif}
/* Cards */
.card{background:#111827;border:1px solid #ffffff10;border-radius:10px;overflow:hidden}
.card-pad{background:#111827;border:1px solid #ffffff10;border-radius:10px;padding:16px 18px}
/* Buttons */
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:4px;cursor:pointer;border:1px solid #ffffff22;background:transparent;color:#5a6a88;transition:all .15s}
.btn:hover{color:#e8eeff;border-color:#ffffff40}
.btn-accent{background:#00d4aa18;border-color:#00d4aa40;color:#00d4aa}
.btn-accent:hover{background:#00d4aa28}
.btn-lg{font-size:16px;padding:12px 24px;border-radius:8px}
/* Tabs */
#tabs{display:flex;gap:2px;border-bottom:1px solid #ffffff10;margin-bottom:20px;overflow-x:auto}
.tab-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border:none;border-bottom:2px solid transparent;background:none;color:#5a6a88;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab-btn.active{color:#00d4aa;border-bottom-color:#00d4aa}
/* Tables */
table{width:100%;border-collapse:collapse}
th{padding:6px 7px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5a6a88;border-bottom:1px solid #ffffff0a;text-align:center}
th.left{text-align:left}
td{padding:7px 7px;font-size:13px;border-bottom:1px solid #ffffff06;text-align:center}
td.left{text-align:left}
tr:last-child td{border-bottom:none}
/* Inputs */
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13px;background:#1a2235;border:1px solid #ffffff18;border-radius:6px;color:#e8eeff;padding:7px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#00d4aa50}
input[type=number]::-webkit-inner-spin-button{opacity:1}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
@media(max-width:680px){.grid-2{grid-template-columns:1fr}}
/* Status bar */
#statusbar{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.05em}
/* Spinner overlay */
#spin-overlay{display:none;position:fixed;inset:0;background:#080d18ee;z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#spin-overlay.show{display:flex}
.spin-box{background:#111827;border:1px solid #ffffff18;border-radius:16px;padding:36px 32px;text-align:center;max-width:400px;width:90%}
.spin-window{height:80px;overflow:hidden;position:relative;border-radius:8px;background:#080d18;margin:16px 0}
.spin-window::before,.spin-window::after{content:'';position:absolute;left:0;right:0;height:22px;z-index:2}
.spin-window::before{top:0;background:linear-gradient(#080d18,transparent)}
.spin-window::after{bottom:0;background:linear-gradient(transparent,#080d18)}
.spin-highlight{position:absolute;top:50%;left:0;right:0;height:36px;transform:translateY(-50%);border-top:1px solid #00d4aa60;border-bottom:1px solid #00d4aa60;pointer-events:none;z-index:3}
.spin-reel{display:flex;flex-direction:column;align-items:center}
.spin-item{height:36px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;width:100%;white-space:nowrap}
/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes glow{0%{color:#f0f4ff}50%{color:#00d4aa;text-shadow:0 0 20px #00d4aa80}100%{color:#00d4aa}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1s ease-in-out infinite}
.glow{animation:glow .8s ease forwards}
.fade-up{animation:fadeUp .25s ease}
/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px}
/* Pot colours */
.pot1{color:#fbbf24;background:#fbbf2418;border:1px solid #fbbf2430}
.pot2{color:#60a5fa;background:#60a5fa18;border:1px solid #60a5fa30}
.pot3{color:#a78bfa;background:#a78bfa18;border:1px solid #a78bfa30}
.champion{color:#a78bfa;background:#a78bfa18;border:1px solid #a78bfa30}
.runner{color:#60a5fa;background:#60a5fa18;border:1px solid #60a5fa30}
.advanced{color:#00d4aa;background:#00d4aa18;border:1px solid #00d4aa30}
.neutral{color:#8b9ab8;background:#ffffff08;border:1px solid #ffffff10}
/* Match rows */
.match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:3px 0;font-size:11px}

.bracket{overflow-x:auto;padding-bottom:10px}
.ko-rounds{display:flex;gap:8px;min-width:860px;align-items:flex-start}
.ko-col{display:flex;flex-direction:column;flex:1}
.ko-col.wide{flex:2}
.ko-round-hdr{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:#5a6a88;text-align:center;padding:4px 0 10px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #ffffff10;margin-bottom:8px}
.ko-match{background:#111827;border:1px solid #ffffff10;border-radius:8px;overflow:hidden;font-size:11px;margin-bottom:5px}
.ko-team{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid #ffffff08}
.ko-team:last-child{border-bottom:none}
.ko-team.winner{background:#00d4aa0a}
.ko-team .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78%}
.ko-team .score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;min-width:12px;text-align:right}
.ko-meta{font-size:10px;color:#5a6a88;text-align:center;padding:3px}

const OFB_URL='https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';

async function loadFromOpenFootball(){
  // Only refetch if >5 mins since last fetch
  var now=Date.now();
  if(now-OFB_LAST_FETCH<5*60*1000&&OFB_LAST_FETCH>0)return;
  try{
    var r=await fetch(OFB_URL+'?t='+now);
    if(!r.ok)return;
    var data=await r.json();
    var matches=data.matches||[];
    OFB={};OFB_GOALS={};
    matches.forEach(function(m,i){
      // Match by date + team names
      var t1=normTeam(m.team1||'');
      var t2=normTeam(m.team2||'');
      var key=findMatchKey(t1,t2,m.date||'');
      if(key===null)return;
      if(m.score&&m.score.ft){
        OFB[key]={s1:m.score.ft[0],s2:m.score.ft[1],ht1:m.score.ht?m.score.ht[0]:null,ht2:m.score.ht?m.score.ht[1]:null};
      }
      var goals=[];
      (m.goals1||[]).forEach(function(g){goals.push({name:g.name,team:t1,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      (m.goals2||[]).forEach(function(g){goals.push({name:g.name,team:t2,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      goals.sort(function(a,b){return a.minute-b.minute;});
      if(goals.length)OFB_GOALS[key]=goals;
    });
    OFB_LAST_FETCH=now;
  }catch(e){
    // Silently fail - manual scores still work
  }
}

function findMatchKey(t1,t2,date){
  var matches=getMatches();
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(m.d===date&&((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1))){
      return m.key;
    }
  }
  // Fallback: match by teams only (different date format)
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1)){
      return m.key;
    }
  }
  return null;
}

async function loadFromGitHub(){
  setStatus('loading','Syncing…','#fbbf24');
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON in config');}
    CFG={...DEFAULT_CFG,...data};
    if(!CFG.allocations)CFG.allocations={};
    if(!CFG.prizes)CFG.prizes={...DEFAULT_CFG.prizes};
    if(!CFG.familyBuys)CFG.familyBuys={...DEFAULT_CFG.familyBuys};
    delete CFG.githubToken; // token never stored in remote config
    setStatus('ok','✓ Synced with GitHub','#00d4aa');
  }catch(e){
    setStatus('warn','Local mode — set token in ⚙ Admin to enable sync ('+e.message+')','#fbbf24');
  }
  // Also fetch live scores from openfootball
  await loadFromOpenFootball();
  render();
}

async function pushToGitHub(cfg){
  var token='';try{token=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(!token){
    alert('No GitHub token set. Go to ⚙ Admin tab and enter your token first.');
    return false;
  }
  setStatus('saving','Saving to GitHub…','#fbbf24');
  try{
    // Get current SHA
    const metaRes=await fetch(GH_API,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(!metaRes.ok)throw new Error('GitHub API '+metaRes.status+' — check your token has Contents:Write on the portfolio repo');
    const meta=await metaRes.json();
    const sha=meta.sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
    const putRes=await fetch(GH_API,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'wc2026: update config',content,sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||'Push failed');}
    setStatus('ok','✓ Saved to GitHub','#00d4aa');
    return true;
  }catch(e){
    setStatus('err','⚠ '+e.message,'#ff4757');
    return false;
  }
}

function getMatches(){
  return MATCHES.map((m,i)=>{
    const sc=SCORES['m'+i];
    return{...m,key:'m'+i,s1:sc?.s1??null,s2:sc?.s2??null};
  });
}

function buildStandings(matches){
  const sm={};
  matches.filter(m=>m.g).forEach(m=>{
    const g=m.g.replace('Group ','');
    if(!sm[g])sm[g]={};
    [m.t1,m.t2].forEach(t=>{if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    if(m.s1!=null&&m.s2!=null){
      const s=sm[g];
      s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.s1;s[m.t1].ga+=m.s2;s[m.t2].gf+=m.s2;s[m.t2].ga+=m.s1;
      if(m.s1>m.s2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
      else if(m.s1<m.s2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
      else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
    }
  });
  return sm;
}

function getTeamResult(teamName,matches,sm){
  const km=matches.filter(m=>!m.g);
  const fin=km.find(m=>m.round==='Final'&&m.s1!=null);
  if(fin){
    const w=fin.s1>fin.s2?fin.t1:fin.t2,l=fin.s1<fin.s2?fin.t1:fin.t2;
    if(teamName===w)return'champion';
    if(teamName===l)return'runner';
    const t3=km.find(m=>m.round==='Match for third place'&&m.s1!=null);
    if(t3&&teamName===(t3.s1>t3.s2?t3.t1:t3.t2))return'third';
  }
  const grp=MATCHES.find(m=>m.t1===teamName||m.t2===teamName)?.g?.replace('Group ','');
  if(grp&&sm[grp]){
    const sorted=Object.values(sm[grp]).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
    if(sorted.slice(0,2).some(s=>s.name===teamName))return'advanced';
  }
  return'active';
}

function tagClass(r){return{champion:'champion',runner:'runner',third:'advanced',advanced:'advanced'}[r]||'neutral';}
function tagLabel(r){return{champion:'🏆',runner:'🥈',third:'🥉',advanced:'✓'}[r]||'';}

function removeTeam(memberId,teamName){
  if(!CFG.allocations[memberId])return;
  CFG.allocations[memberId]=CFG.allocations[memberId].filter(t=>t!==teamName);
  if(!CFG.allocations[memberId].length)delete CFG.allocations[memberId];
  pushToGitHub(CFG);
  renderSweep();
}

        <td class="left" style="font-weight:500;font-size:12px">${isKnown(s.name)?f(s.name)+' ':''}${h(s.name)}</td>

        <td style="font-weight:600;color:${gd>0?'#00d4aa':gd<0?'#ff4757':'#5a6a88'}">${gd>0?'+':''}${gd}</td>
        <td class="font-display" style="font-weight:700;font-size:14px;color:${i<2?c:'#f0f4ff'}">${s.pts}</td>
      </tr>`;}).join('')}
      </tbody></table>
      <div style="border-top:1px solid #ffffff08;padding:8px 10px">
        ${gm.map(m=>{const done=m.s1!=null;return`<div class="match-grid">
          <span style="text-align:right;font-weight:${done?600:400};color:${done?'#e8eeff':'#8b9ab8'}">${isKnown(m.t1)?f(m.t1):''} ${h(m.t1)}</span>
          <span class="font-display" style="text-align:center;min-width:44px;font-weight:700;font-size:${done?14:11}px;color:${done?'#f0f4ff':'#5a6a88'}">${done?m.s1+'–'+m.s2:fmtDate(m.d)}</span>
          <span style="font-weight:${done?600:400};color:${done?'#e8eeff':'#8b9ab8'}">${h(m.t2)} ${isKnown(m.t2)?f(m.t2):''}</span>

}

// ── KNOCKOUT TAB ──────────────────────────────────────────
function renderKnockout(){
  const matches=getMatches().filter(m=>!m.g);
  const stages=[{k:'Round of 32',l:'R32',wide:true},{k:'Round of 16',l:'R16'},{k:'Quarter-final',l:'QF'},{k:'Semi-final',l:'SF'},{k:'Match for third place',l:'3rd'},{k:'Final',l:'Final'}];
  let out=`<div class="bracket"><div class="ko-rounds">`;
  stages.forEach(({k,l,wide})=>{
    const sm=matches.filter(m=>m.round===k).sort((a,b)=>(a.num||0)-(b.num||0));
    if(!sm.length)return;
    out+=`<div class="ko-col${wide?' wide':''}"><div class="ko-round-hdr">${l}</div>`;
    sm.forEach(m=>{
      const done=m.s1!=null,h1w=done&&m.s1>m.s2,h2w=done&&m.s2>m.s1;
      const t1k=isKnown(m.t1),t2k=isKnown(m.t2);
      out+=`<div class="ko-match">
        ${[[m.t1,m.s1,h1w,t1k],[m.t2,m.s2,h2w,t2k]].map(([t,sc,won,known])=>`
        <div class="ko-team${won?' winner':''}">
          <span class="name" style="font-weight:${won?700:400};color:${known?'#e8eeff':'#5a6a88'};font-style:${known?'normal':'italic'};font-size:${known?11:10}px">${known?f(t)+' ':''}${h(t)}</span>
          <span class="score" style="color:${won?'#00d4aa':'#f0f4ff'}">${done?sc:''}</span>
        </div>`).join('')}
        <div class="ko-meta">${fmtDate(m.d)} · ${h(m.gr)}</div>
      </div>`;
    });
    out+=`</div>`;
  });
  out+=`</div></div>`;
  document.getElementById('tab-knockout').innerHTML=out;
}

// ── STATS TAB ─────────────────────────────────────────────
function renderStats(){
  const matches=getMatches();
  const sm=buildStandings(matches);
  const allTeams=[...new Set(matches.filter(m=>m.g).flatMap(m=>[m.t1,m.t2]).filter(isKnown))].sort();
  const rows=allTeams.map(name=>{
    const grp=Object.entries(sm).find(([,v])=>v[name])?.[0]||'?';
    const s=sm[grp]?.[name]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    return{name,group:grp,...s,gd:s.gf-s.ga};
  }).sort((a,b)=>{
    if(statsSort==='pts')return b.pts-a.pts||b.gd-a.gd;
    if(statsSort==='gf')return b.gf-a.gf||b.pts-a.pts;
    if(statsSort==='gd')return b.gd-a.gd||b.gf-a.gf;
    if(statsSort==='ga')return a.ga-b.ga;
    return a.group.localeCompare(b.group);
  });
  const sortBtns=[['pts','Points'],['gf','Goals'],['gd','GD'],['ga','Fewest Against'],['grp','Group']];
  let out=`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <span style="font-size:11px;color:#5a6a88;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Sort</span>
    ${sortBtns.map(([v,l])=>`<button class="btn${statsSort===v?' btn-accent':''}" onclick="statsSort='${v}';renderStats()">${l}</button>`).join('')}
  </div>
  <div class="card">
  <table>
    <thead><tr><th>#</th><th class="left">Team</th><th>Grp</th><th>Pld</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
    <tbody>
    ${rows.map((r,i)=>{const c=GC[r.group]||'#888';return`<tr>
      <td style="color:#5a6a88;font-size:11px">${i+1}</td>
      <td class="left" style="font-weight:500">${f(r.name)} ${h(r.name)}</td>
      <td><span class="font-display" style="font-size:10px;font-weight:700;color:${c};background:${c}18;padding:1px 6px;border-radius:3px">${r.group}</span></td>
      <td style="color:#5a6a88">${r.p}</td><td>${r.w}</td><td style="color:#5a6a88">${r.d}</td><td style="color:#5a6a88">${r.l}</td>
      <td style="font-weight:${r.gf>0?600:400}">${r.gf}</td><td style="color:#5a6a88">${r.ga}</td>
      <td class="font-display" style="font-weight:700;font-size:14px;color:${r.gd>0?'#00d4aa':r.gd<0?'#ff4757':'#5a6a88'}">${r.gd>0?'+':''}${r.gd}</td>
      <td class="font-display" style="font-weight:700;font-size:16px">${r.pts}</td>
    </tr>`;}).join('')}
    ${!rows.length?'<tr><td colspan="11" style="text-align:center;padding:40px;color:#5a6a88">Stats appear once scores are entered</td></tr>':''}
    </tbody>
  </table></div>`;
  document.getElementById('tab-stats').innerHTML=out;
}

// ── SCORES TAB ────────────────────────────────────────────
function renderScores(){
  var matches=getMatches();
  var filters=[['group','Group'],['knockout','Knockout'],['pending','Pending'],['done','Played'],['all','All']];
  var filtered=matches.filter(function(m){
    if(scoreFilter==='group')return!!m.g;
    if(scoreFilter==='knockout')return!m.g;
    if(scoreFilter==='pending')return m.s1==null;
    if(scoreFilter==='done')return m.s1!=null;
    return true;
  });
  var autoCount=matches.filter(function(m){return m.isAuto;}).length;
  var manualCount=matches.filter(function(m){return m.isManual;}).length;

  var filterBtns=filters.map(function(fv){
    var v=fv[0],l=fv[1];
    var cls='btn'+(scoreFilter===v?' btn-accent':'');
    return '<button class="'+cls+'" data-filter="'+v+'" onclick="setScoreFilter(this)">'+l+'</button>';
  }).join('');

  var out='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Show</span>'+
    filterBtns+'</div>';

  out+='<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11px;color:#8b9ab8">'+
    '<span style="color:#5a6a88">Sources:</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#00d4aa;margin-right:4px;vertical-align:-1px"></span>openfootball live ('+autoCount+')</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#60a5fa;margin-right:4px;vertical-align:-1px"></span>Manual override ('+manualCount+')</span>'+
    '<span style="color:#5a6a88;font-style:italic">Click any row to enter manually — overrides live data</span>'+
    '</div>';

  out+='<div style="display:flex;flex-direction:column;gap:4px">';

  filtered.forEach(function(m){
    var done=m.s1!=null;
    var isEdit=editScoreKey===m.key;
    var grpL=m.g?m.g.replace('Group ',''):'';
    var c=GC[grpL]||'#60a5fa';
    var roundShort=(m.round||'').replace('Round of ','R');

    var srcDot='';
    if(m.isAuto)srcDot='<span title="Live from openfootball" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#00d4aa;margin-left:5px;vertical-align:1px"></span>';
    if(m.isManual)srcDot='<span title="Manually entered" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#60a5fa;margin-left:5px;vertical-align:1px"></span>';

    var goalsHtml='';
    if(m.goals&&m.goals.length&&!isEdit){
      var gLines=m.goals.map(function(g){
        var pen=g.penalty?' <span style="color:#fbbf24">(pen)</span>':'';
        var off=g.offset?'+'+g.offset:'';
        return f(g.team)+' <strong style="color:#8b9ab8">'+h(g.name)+'</strong> <span style="color:#5a6a88">'+g.minute+"'"+off+'</span>'+pen;
      });
      goalsHtml='<div style="font-size:10px;color:#5a6a88;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff08;line-height:1.8">'+gLines.join('&nbsp;&nbsp; ')+'</div>';
    }
    var htHtml='';
    if(m.ht1!=null&&m.ht2!=null&&!isEdit){
      htHtml='<span style="font-size:10px;color:#5a6a88;margin-left:6px">(HT '+m.ht1+'-'+m.ht2+')</span>';
    }

    var onclk=isEdit?'':'onclick="editScore(\''+m.key+'\')"';
    var borderCol=isEdit?'#00d4aa40':'#ffffff0e';
    out+='<div '+onclk+' style="padding:10px 14px;background:#111827;border:1px solid '+borderCol+';border-radius:8px;cursor:'+(isEdit?'default':'pointer')+'">';
    out+='<div style="display:grid;grid-template-columns:90px 1fr '+(isEdit?'240px':'auto')+' 1fr 80px;align-items:center;gap:8px">';

    // Meta
    var metaLabel=grpL
      ? '<span class="font-display" style="font-size:10px;font-weight:700;color:'+c+';background:'+c+'18;padding:2px 5px;border-radius:3px">'+h(m.g)+'</span>'
      : '<span class="font-display" style="font-size:10px;color:#5a6a88;font-weight:600;letter-spacing:.04em;text-transform:uppercase">'+roundShort+'</span>';
    out+='<div style="font-size:11px">'+metaLabel+'<div style="margin-top:4px;color:#5a6a88">'+fmtDate(m.d)+'</div></div>';

    // Home
    var homeFlag=isKnown(m.t1)?f(m.t1)+' ':'';
    out+='<span style="font-weight:'+(done?600:400)+';text-align:right;color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+homeFlag+h(m.t1)+'</span>';

    // Score
    out+='<div style="text-align:center;min-width:80px">';
    if(isEdit){
      var v1=m.s1!=null?m.s1:'';
      var v2=m.s2!=null?m.s2:'';
      var clearBtn=done?'<button class="btn" style="color:#ff4757;border-color:#ff475730;padding:3px 7px;font-size:11px" onclick="event.stopPropagation();clearScore(\''+m.key+'\')">&#x2715;</button>':'';
      out+='<div style="display:flex;align-items:center;gap:4px;justify-content:center" onclick="event.stopPropagation()">'+
        '<input id="s1in" type="number" min="0" max="20" value="'+v1+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<span style="font-weight:700;color:#5a6a88">-</span>'+
        '<input id="s2in" type="number" min="0" max="20" value="'+v2+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<button class="btn btn-accent" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();saveScore(\''+m.key+'\')">SAVE</button>'+
        clearBtn+
        '<button class="btn" style="padding:3px 7px;font-size:11px" onclick="event.stopPropagation();editScoreKey=null;renderScores()">&#x00D7;</button>'+
        '</div>';
    }else if(done){
      out+='<div><span class="font-display" style="font-weight:700;font-size:20px;letter-spacing:.05em">'+m.s1+' - '+m.s2+'</span>'+srcDot+htHtml+'</div>';
    }else{
      out+='<span style="font-size:11px;color:#5a6a88;border:1px dashed #ffffff14;padding:3px 8px;border-radius:4px;white-space:nowrap">click to enter</span>';
    }
    out+='</div>';

    // Away
    var awayFlag=isKnown(m.t2)?f(m.t2):'';
    out+='<span style="font-weight:'+(done?600:400)+';color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+h(m.t2)+' '+awayFlag+'</span>';

    // Venue
    out+='<span style="font-size:10px;color:#5a6a88;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h(m.gr)+'</span>';
    out+='</div>';
    if(goalsHtml)out+=goalsHtml;
    out+='</div>';
  });

  out+='</div>';
  document.getElementById('tab-scores').innerHTML=out;
  if(editScoreKey)setTimeout(function(){var el=document.getElementById('s1in');if(el)el.focus();},50);
}

function setScoreFilter(btn){scoreFilter=btn.getAttribute('data-filter');renderScores();}
function editScore(key){editScoreKey=key;renderScores();}
function saveScore(key){
  const s1=document.getElementById('s1in')?.value;
  const s2=document.getElementById('s2in')?.value;
  if(s1===''&&s2===''){delete SCORES[key];}else{SCORES[key]={s1:s1===''?null:+s1,s2:s2===''?null:+s2};}
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;
  render();
}
function clearScore(key){
  delete SCORES[key];
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;
  render();
}

          <td><input type="number" id="buys-${fam.id}-p" value="${b.primaries}" min="0" style="width:50px;text-align:center"></td>
          <td><input type="number" id="buys-${fam.id}-s" value="${b.secondaries}" min="0" style="width:50px;text-align:center"></td>
          <td class="font-display" style="font-weight:700" id="buys-${fam.id}-total">$${(b.primaries*CFG.primaryCost)+(b.secondaries*CFG.secondaryCost)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>

  <!-- Prize structure -->
  <div class="card-pad">
    <div class="font-display" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8b9ab8;margin-bottom:12px">Prize Structure</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      ${[['champion','🏆 Champion'],['runner','🥈 Runner-up'],['third','🥉 3rd'],['groupAdvance','✓ Advance']].map(([k,label])=>`
      <label style="display:flex;align-items:center;gap:6px;font-size:13px">
        <span style="color:#8b9ab8">${label} $</span>
        <input type="number" id="prize-${k}" value="${CFG.prizes[k]||0}" min="0" style="width:60px;text-align:center">
      </label>`).join('')}
    </div>
  </div>

  <!-- Pot editor -->
  ${[1,2,3].map(p=>`
  <div class="card-pad" style="border-color:${POT[p].color}25">
    <div class="font-display" style="font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:${POT[p].color};margin-bottom:4px">${POT[p].label} — ${POT[p].desc}</div>
    <div style="font-size:11px;color:#5a6a88;margin-bottom:8px">One team per line (${CFG['pot'+p].length}/16 currently)</div>
    <textarea id="pot${p}-input" style="width:100%;height:180px;padding:10px 12px;background:#1a2235;border:1px solid #ffffff14;border-radius:6px;color:#e8eeff;font-size:12px;resize:vertical;line-height:1.8">${CFG['pot'+p].join('\n')}</textarea>
  </div>`).join('')}

  <div id="token-status-placeholder"></div>

  <!-- Save -->
  <div style="display:flex;gap:10px">
    <button class="btn btn-accent btn-lg" style="flex:1" onclick="saveAdmin()">SAVE & PUSH TO GITHUB</button>
    <button class="btn btn-lg" style="color:#ff4757;border-color:#ff475730;padding:12px 20px" onclick="resetDraws()">RESET DRAWS</button>
  </div>
  <div id="admin-msg"></div>
  </div>`;
  document.getElementById('tab-admin').innerHTML=out;
  // Update token status (must happen after innerHTML is set)
  updateTokenStatus();
}

function updateTokenStatus(){
  var ts=document.getElementById('token-status-placeholder');
  if(!ts)return;
  var t='';
  try{t=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(t){
    ts.innerHTML='<div style="font-size:11px;color:#00d4aa;margin-top:8px">✓ Token is set in this browser — you can push changes. <span style="cursor:pointer;color:#ff4757;text-decoration:underline" onclick="try{localStorage.removeItem(\'wc26_token\');}catch(e){}renderAdmin()">Clear token</span></div>';
  }else{
    ts.innerHTML='<div style="font-size:11px;color:#fbbf24;margin-top:8px">⚠ No token set on this device — you can view but not save changes.</div>';
  }
}

function saveToken(){
  var t='';
  var el=document.getElementById('token-input');
  if(el)t=el.value.trim();
  if(!t){
    document.getElementById('admin-msg').innerHTML='<div style="padding:10px 14px;background:#ff475714;border:1px solid #ff475730;border-radius:6px;color:#ff4757;font-size:13px;margin-top:8px">⚠ Please enter a token</div>';
    return;
  }
  try{localStorage.setItem('wc26_token',t);}catch(e){}
  // Verify it works by doing a test push of current CFG
  pushToGitHub(CFG).then(function(ok){
    var msg=document.getElementById('admin-msg');
    if(!msg)return;
    if(ok){
      msg.innerHTML='<div style="padding:10px 14px;background:#00d4aa14;border:1px solid #00d4aa30;border-radius:6px;color:#00d4aa;font-size:13px;margin-top:8px">✓ Token saved to your browser — working correctly</div>';
    }else{
      msg.innerHTML='<div style="padding:10px 14px;background:#ff475714;border:1px solid #ff475730;border-radius:6px;color:#ff4757;font-size:13px;margin-top:8px">⚠ Token saved but push failed — check permissions</div>';
    }
    updateTokenStatus();
  });
}

async function saveAdmin(){
  CFG.primaryCost=+(document.getElementById('cost-primary')?.value||10);
  CFG.secondaryCost=+(document.getElementById('cost-secondary')?.value||5);
  CFG.prizes.champion=+(document.getElementById('prize-champion')?.value||50);
  CFG.prizes.runner=+(document.getElementById('prize-runner')?.value||25);
  CFG.prizes.third=+(document.getElementById('prize-third')?.value||15);
  CFG.prizes.groupAdvance=+(document.getElementById('prize-groupAdvance')?.value||5);
  CFG.families.forEach(fam=>{
    CFG.familyBuys[fam.id]={
      primaries:+(document.getElementById('buys-'+fam.id+'-p')?.value||0),
      secondaries:+(document.getElementById('buys-'+fam.id+'-s')?.value||0)
    };
  });
  for(let p=1;p<=3;p++){
    const v=document.getElementById('pot'+p+'-input')?.value||'';
    CFG['pot'+p]=v.split('\n').map(s=>s.trim()).filter(Boolean);
  }
  const ok=await pushToGitHub(CFG);
  const msg=document.getElementById('admin-msg');
  if(msg)msg.innerHTML=`<div style="padding:10px 14px;background:${ok?'#00d4aa14':'#ff475714'};border:1px solid ${ok?'#00d4aa30':'#ff475730'};border-radius:6px;color:${ok?'#00d4aa':'#ff4757'};font-size:13px;margin-top:8px">${ok?'✓ Saved and pushed to GitHub':'⚠ Save failed — check your token above'}</div>`;
  if(ok){renderSweep();renderGroups();}
}

function resetDraws(){
  if(!confirm('Clear ALL team draws? This cannot be undone.'))return;
  CFG.allocations={};
  pushToGitHub(CFG);
  renderSweep();
}

// ═══════════════════════════════════════════════════════════
// SPINNER
// ═══════════════════════════════════════════════════════════
let spinMemberId,spinMemberName,spinFamColor,spinPot,spinTeams,spinWinner,spinPhase,spinAnimId;

function startSpin(memberId,memberName,famColor,pot){
  const allocated=new Set(Object.values(CFG.allocations||{}).flat());
  const available=CFG['pot'+pot].filter(t=>!allocated.has(t));
  if(!available.length){alert('No teams left in Pot '+pot+'!');return;}

  spinMemberId=memberId;spinMemberName=memberName;spinFamColor=famColor;spinPot=pot;
  spinTeams=shuffle([...available,...available,...available].slice(0,36));
  spinWinner=null;spinPhase='ready';

  const box=document.getElementById('spin-box');
  box.style.borderColor=POT[pot].color+'50';

  document.getElementById('spin-highlight').style.borderColor=POT[pot].color+'80';

  renderSpinner();
  document.getElementById('spin-overlay').classList.add('show');
}

function renderSpinner(){
  var p=POT[spinPot];
  var pot1Elite=spinPot===1?CFG.pot1.slice(0,8):[];
  var eliteNote=spinPot===1?'<div style="display:inline-block;margin-top:6px;font-size:11px;background:#fbbf2414;border:1px solid #fbbf2430;border-radius:4px;padding:2px 10px;color:#fbbf24">★ Top 8 shown in gold — draw these first</div>':'';
  document.getElementById('spin-header').innerHTML=
    '<div class="font-display" style="font-weight:800;font-size:22px;color:'+spinFamColor+'">'+h(spinMemberName)+'</div>'+
    '<div style="font-size:12px;color:#5a6a88;margin-top:4px">Drawing from <span style="color:'+p.color+';font-weight:600">'+p.label+'</span> — '+p.desc+'</div>'+
    eliteNote;

  document.getElementById('spin-reel').innerHTML=spinTeams.map(function(t,i){
    var isElite=pot1Elite.indexOf(t)>=0;
    var star=isElite?'<span style="color:#fbbf24;font-size:14px;margin-right:3px">★</span>':'';
    var col=isElite?'color:#fbbf24':'color:#e8eeff';
    return '<div class="spin-item" data-idx="'+i+'" style="'+col+'">'+star+f(t)+' '+h(t)+'</div>';
  }).join('');

  if(spinPhase==='ready'){
    document.getElementById('spin-reel').style.transform='translateY(0)';
    document.getElementById('spin-controls').innerHTML=
      '<button class="btn btn-accent btn-lg" style="width:100%" onclick="doSpin()">🎰 SPIN</button>'+
      '<button class="btn" style="width:100%;margin-top:8px;padding:8px" onclick="closeSpin()">Cancel</button>';
  }else if(spinPhase==='spinning'){
    document.getElementById('spin-controls').innerHTML='<div class="font-display pulse" style="font-size:16px;color:#5a6a88;padding:14px;text-align:center;letter-spacing:.1em;text-transform:uppercase">Drawing…</div>';
  }else if(spinPhase==='result'){
    var isEliteWinner=spinPot===1&&CFG.pot1.indexOf(spinWinner)>=0&&CFG.pot1.indexOf(spinWinner)<8;
    var eliteBadge=isEliteWinner?'<div style="display:inline-block;background:#fbbf2420;border:1px solid #fbbf2440;border-radius:4px;padding:3px 10px;font-size:11px;color:#fbbf24;letter-spacing:.06em;margin-bottom:6px">★ ELITE PICK — TOP 8</div><br>':'';
    var winCol=isEliteWinner?'color:#fbbf24':'color:#00d4aa';
    document.getElementById('spin-controls').innerHTML=
      '<div style="text-align:center;margin:8px 0">'+eliteBadge+
      '<div class="font-display glow" style="font-weight:800;font-size:26px;letter-spacing:.05em;'+winCol+'">'+f(spinWinner)+' '+h(spinWinner)+'!</div></div>'+
      '<div style="display:flex;gap:8px;margin-top:4px">'+
      '<button class="btn btn-accent" style="flex:1;padding:12px;font-size:15px" onclick="confirmSpin()">✓ CONFIRM</button>'+
      '<button class="btn" style="padding:12px 14px" onclick="doRespin()">Respin</button>'+
      '<button class="btn" style="padding:12px 14px" onclick="closeSpin()">×</button>'+
      '</div>';
  }
}

function doRespin(){spinPhase='ready';spinWinner=null;renderSpinner();}
function doSpin(){
  spinPhase='spinning';
  renderSpinner();
  const itemH=36,duration=2800+Math.random()*800;
  const winIdx=Math.floor(Math.random()*12)+10;
  const finalY=-(winIdx*itemH)+((80-itemH)/2);
  const start=Date.now();
  function ease(t){return 1-Math.pow(1-t,4);}
  function step(){
    const prog=Math.min((Date.now()-start)/duration,1);
    const y=ease(prog)*finalY;
    document.getElementById('spin-reel').style.transform=`translateY(${y}px)`;
    if(prog<1){spinAnimId=requestAnimationFrame(step);}
    else{
      spinWinner=spinTeams[winIdx];
      spinPhase='result';
      renderSpinner();
    }
  }
  spinAnimId=requestAnimationFrame(step);
}

function confirmSpin(){
  if(!spinWinner)return;
  const current=CFG.allocations[spinMemberId]||[];
  CFG.allocations[spinMemberId]=[...current,spinWinner];
  pushToGitHub(CFG);
  closeSpin();
  renderSweep();
}

function closeSpin(){
  if(spinAnimId)cancelAnimationFrame(spinAnimId);
  document.getElementById('spin-overlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
// Render immediately with defaults so page is never blank
render();
// Then load remote config + live scores
loadFromGitHub();
// Auto-refresh live scores every 5 minutes
setInterval(function(){
  loadFromOpenFootball().then(function(){render();});
},5*60*1000);
</script>
