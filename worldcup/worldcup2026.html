async function loadLiveElo(){
  var now=Date.now();
  if(now-ELO_LAST_FETCH<30*60*1000&&ELO_LAST_FETCH>0)return; // cache 30 min
  var ELO_URL='https://raw.githubusercontent.com/Hicruben/world-cup-2026-prediction-model/main/data/elo-calibrated.json';
  try{
    var r=await fetch(ELO_URL+'?t='+now);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var data=await r.json();
    // data is an object: { "France": 2089, ... } or array — handle both
    var newElo={};
    if(Array.isArray(data)){
      data.forEach(function(entry){
        var name=ELO_NAME_MAP[entry.team||entry.name]||(entry.team||entry.name);
        if(name&&entry.elo)newElo[name]=Math.round(entry.elo);

    }else{
      Object.entries(data).forEach(function(e){
        var name=ELO_NAME_MAP[e[0]]||e[0];
        newElo[name]=Math.round(e[1]);
      });
    }
    // Only apply if we got reasonable data (at least 40 teams)
    if(Object.keys(newElo).length>=40){

      ELO_LAST_FETCH=now;
      console.log('Live Elo loaded: '+Object.keys(newElo).length+' teams');
      // Re-render predictions if it's the active tab

}

var VENUE_UTC_OFFSET={
  'Mexico City':-6,'Guadalajara':-6,'Guadalajara (Zapopan)':-6,'Monterrey':-6,'Monterrey (Guadalupe)':-6,
  'Los Angeles':-7,'Los Angeles (Inglewood)':-7,'San Francisco':-7,'San Francisco Bay Area (Santa Clara)':-7,'Seattle':-7,'Vancouver':-7,
  'Toronto':-4,'Atlanta':-4,'New York':-4,'New York/New Jersey (East Rutherford)':-4,'Boston':-4,'Boston (Foxborough)':-4,'Miami':-4,'Miami (Miami Gardens)':-4,'Philadelphia':-4,'Kansas City':-5,'Kansas City (Kansas City)':-5,
  'Dallas':-5,'Houston':-5
};

function venueToAEST(ofbTimeObj, venue, dateStr){
  // ofbTimeObj: {timeStr: "13:00 UTC-6", venue: "Mexico City"} OR plain string
  // Handles OFB's "HH:MM UTC±X" format which includes offset directly
  if(!ofbTimeObj||!dateStr)return'';
  var timeStr=typeof ofbTimeObj==='object'?(ofbTimeObj.timeStr||''):ofbTimeObj;
  var ofbVenue=typeof ofbTimeObj==='object'?(ofbTimeObj.venue||venue||''):(venue||'');
  if(!timeStr)return'';

  var utcH, mn;
  // Try parsing "HH:MM UTC±X" (OFB format — offset embedded in string)
  var m=timeStr.match(/(\d+):(\d+)\s*UTC([+-]\d+(?:\.\d+)?)/);
  if(m){
    var localH=parseInt(m[1]);
    mn=parseInt(m[2]);
    var offset=parseFloat(m[3]);
    utcH=localH-offset; // local → UTC
  }else{
    // Plain "HH:MM" — look up venue offset
    var parts=timeStr.split(':');
    localH=parseInt(parts[0]);mn=parseInt(parts[1]||0);
    // Try matching venue name (partial match)
    var off=null;
    Object.keys(VENUE_UTC_OFFSET).forEach(function(k){
      if(ofbVenue.indexOf(k)>=0||k.indexOf(ofbVenue)>=0)off=VENUE_UTC_OFFSET[k];
    });
    if(off===null)return'';
    utcH=localH-off;
  }

  var aestH=utcH+10;
  var d=new Date(dateStr+'T12:00:00');
  var dayAdj=0;
  if(aestH>=24){aestH-=24;dayAdj=1;}
  if(aestH<0){aestH+=24;dayAdj=-1;}
  d.setDate(d.getDate()+dayAdj);
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var mn2=mn<10?'0'+mn:''+mn;
  var h2=aestH<10?'0'+aestH:''+aestH;
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+h2+':'+mn2+' AEST';
}
const fmtDate=d=>{if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{month:'short',day:'numeric'});};
function fmtDateAEST(isoDate,utcTime){
  if(!isoDate)return'';
  // Parse UTC time if given (e.g. "19:00 UTC-4")
  var aestStr='';
  try{
    if(utcTime){
      var m=utcTime.match(/(\d+):(\d+)\s*UTC([+-]\d+(?:\.\d+)?)/);
      if(m){
        var h=parseInt(m[1]),mn=parseInt(m[2]),off=parseFloat(m[3]);
        // Convert to UTC then to AEST (UTC+10)
        var utcH=h-off; // UTC hours
        var aestH=utcH+10; // AEST
        var d=new Date(isoDate+'T00:00:00');
        var dayOff=0;
        if(aestH>=24){aestH-=24;dayOff=1;}
        if(aestH<0){aestH+=24;dayOff=-1;}
        d.setDate(d.getDate()+dayOff);
        var mn2=mn<10?'0'+mn:''+mn;
        var h2=aestH<10?'0'+aestH:''+aestH;
        var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        aestStr=days[d.getDay()]+' '+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+' '+h2+':'+mn2+' AEST';
      }
    }
    if(!aestStr){
      // No time — just show date
      aestStr=new Date(isoDate+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'});
    }
  }catch(e){aestStr=isoDate;}
  return aestStr;
}

// ── Auto-compute prize awards from live match data ────────────────────
function calcAutoAwards(){
  var matches=getMatches();
  var sm=buildStandings(matches);
  var allocs=CFG.allocations||{};

  // Build reverse lookup: team -> memberId
  var teamOwner={};
  CFG.families.forEach(function(fam){
    fam.members.forEach(function(mem){
      (allocs[mem.id]||[]).forEach(function(t){teamOwner[t]=mem.id;});
    });
  });

  // Collect all goals across all matches
  var allGoals=[]; // {team, name, minute, penalty, matchDate, matchKey}
  matches.forEach(function(m){
    if(!m.goals||!m.goals.length)return;
    m.goals.forEach(function(g){
      allGoals.push(Object.assign({},g,{matchDate:m.d,matchKey:m.key}));
    });
  });
  // Sort by date then minute for chronological order
  allGoals.sort(function(a,b){
    return a.matchDate<b.matchDate?-1:a.matchDate>b.matchDate?1:a.minute-b.minute;
  });

  // Collect per-team stats from standings
  var teamStats={}; // team -> {gf, ga, gd, yellows, reds, cleanSheets}
  // We get GF/GA from buildStandings, but yellows/reds/cleanSheets not tracked by OFB
  // For what OFB does provide: goals per player, scores per team
  Object.entries(sm).forEach(function(e){
    Object.entries(e[1]).forEach(function(te){
      var t=te[0],s=te[1];
      teamStats[t]={gf:s.gf,ga:s.ga,gd:s.gf-s.ga,p:s.p};
    });
  });

  // Goal tally per player (for golden boot)
  var playerGoals={}; // "name|team" -> {name, team, goals, pens}
  allGoals.forEach(function(g){
    if(g.penalty)return; // exclude own goals if needed
    var key=g.name+'|'+g.team;
    if(!playerGoals[key])playerGoals[key]={name:g.name,team:g.team,goals:0,pens:0};
    playerGoals[key].goals++;
    if(g.penalty)playerGoals[key].pens++;
  });

  var newAwards=Object.assign({},CFG.manualAwards||{});

  // ── firstGoal: owner of the team that scored the first goal ──────────
  if(allGoals.length>0){
    var firstGoalTeam=allGoals[0].team;
    var firstGoalOwner=teamOwner[firstGoalTeam];
    if(firstGoalOwner)newAwards.firstGoal=firstGoalOwner;
  }

  // ── goldenBoot: owner of team with most goals scored ────────────────
  // (by top individual scorer when OFB has player data, else by team goals)
  var topScorer=null,topGoals=0;
  Object.values(playerGoals).forEach(function(p){
    if(p.goals>topGoals){topGoals=p.goals;topScorer=p;}
    else if(p.goals===topGoals&&topScorer){
      // tiebreak: fewer penalties
      if(p.pens<topScorer.pens)topScorer=p;
    }
  });
  if(topScorer){
    var gbOwner=teamOwner[topScorer.team];
    if(gbOwner)newAwards.goldenBoot=gbOwner;
  }

  // ── bestGD: owner of team with best goal difference ──────────────────
  // Only count after at least 2 matches played to avoid 1-game noise
  var bestGD=null,bestGDVal=-999;
  Object.entries(teamStats).forEach(function(e){
    var t=e[0],s=e[1];
    if(s.p<1)return;
    if(s.gd>bestGDVal||(s.gd===bestGDVal&&bestGD&&s.gf>(teamStats[bestGD]||{}).gf)){
      bestGDVal=s.gd;bestGD=t;
    }
  });
  if(bestGD&&teamOwner[bestGD])newAwards.bestGD=teamOwner[bestGD];

  // ── worstGD: owner of team with worst goal difference ────────────────
  var worstGD=null,worstGDVal=999;
  Object.entries(teamStats).forEach(function(e){
    var t=e[0],s=e[1];
    if(s.p<1)return;
    if(s.gd<worstGDVal||(s.gd===worstGDVal&&worstGD&&s.ga>(teamStats[worstGD]||{}).ga)){
      worstGDVal=s.gd;worstGD=t;
    }
  });
  if(worstGD&&teamOwner[worstGD])newAwards.worstGD=teamOwner[worstGD];

  // ── mostCleanSheets: team that conceded 0 in most games ──────────────
  var cleanSheets={};
  matches.forEach(function(m){
    if(m.s1==null)return;
    if(m.s2===0&&teamOwner[m.t1])cleanSheets[m.t1]=(cleanSheets[m.t1]||0)+1;
    if(m.s1===0&&teamOwner[m.t2])cleanSheets[m.t2]=(cleanSheets[m.t2]||0)+1;
  });
  var topCS=null,topCSVal=0;
  Object.entries(cleanSheets).forEach(function(e){
    if(e[1]>topCSVal){topCSVal=e[1];topCS=e[0];}
  });
  if(topCS&&teamOwner[topCS])newAwards.mostCleanSheets=teamOwner[topCS];

  // ── topFamily: family with most total points (auto-calc) ─────────────
  // We skip this one as it needs the full leaderboard calc - handle in renderSweep

  // ── Card awards from Transfermarkt (updated nightly by GitHub Action) ──────
  var cardTotals=CFG.cardTotals||{};
  if(Object.keys(cardTotals).length>0){
    // mostRed: most reds wins, yellows as tiebreaker
    var redSorted=Object.entries(cardTotals).filter(function(e){return e[1].red>0||e[1].yellow>0;})
      .sort(function(a,b){return b[1].red!==a[1].red?b[1].red-a[1].red:b[1].yellow-a[1].yellow;});
    // mostYellow: most yellows wins, reds as tiebreaker
    var yelSorted=Object.entries(cardTotals).filter(function(e){return e[1].yellow>0||e[1].red>0;})
      .sort(function(a,b){return b[1].yellow!==a[1].yellow?b[1].yellow-a[1].yellow:b[1].red-a[1].red;});
    var topRedTeam=redSorted.length?redSorted[0][0]:null;
    var topYellowTeam=yelSorted.length?yelSorted[0][0]:null;
    if(topYellowTeam&&teamOwner[topYellowTeam])newAwards.mostYellow=teamOwner[topYellowTeam];
    if(topRedTeam&&teamOwner[topRedTeam])newAwards.mostRed=teamOwner[topRedTeam];
  }

  // Only update auto keys — never overwrite manual overrides
  var overrides=CFG.manualOverrides||{};
  var autoKeys=['firstGoal','goldenBoot','bestGD','worstGD','mostCleanSheets','mostYellow','mostRed'];
  var changed=false;
  autoKeys.forEach(function(k){
    if(overrides[k])return; // skip — admin manually set this
    if(newAwards[k]!==(CFG.manualAwards||{})[k]){
      changed=true;
    }
  });
  if(changed){
    // Merge: keep manual overrides, apply auto values for non-overridden keys
    if(!CFG.manualAwards)CFG.manualAwards={};
    autoKeys.forEach(function(k){
      if(overrides[k])return;
      if(newAwards[k]){
        CFG.manualAwards[k]=newAwards[k];
      }else{
        delete CFG.manualAwards[k];
      }
    });
    pushToGitHub(CFG);
    console.log('Auto awards updated');
  }
}


async function loadFromOpenFootball(){
  // Only refetch if >5 mins since last fetch
  var now=Date.now();
  if(now-OFB_LAST_FETCH<5*60*1000&&OFB_LAST_FETCH>0)return;
  try{
    var r=await fetch(OFB_URL+'?t='+now);
    if(!r.ok)return;
    var data=await r.json();
    var matches=data.matches||[];
    OFB={};OFB_GOALS={};OFB_TIMES={};
    matches.forEach(function(m,i){
      // Match by date + team names
      var t1=normTeam(m.team1||'');
      var t2=normTeam(m.team2||'');
      var key=findMatchKey(t1,t2,m.date||'');
      if(key===null)return;
      // Store kickoff time + venue from OFB
      // OFB time format: "13:00 UTC-6" (local time with UTC offset)
      if(m.time&&key!==null){
        OFB_TIMES[key]={timeStr:m.time, venue:m.ground||''};
      }
      if(m.score&&m.score.ft){
        OFB[key]={s1:m.score.ft[0],s2:m.score.ft[1],ht1:m.score.ht?m.score.ht[0]:null,ht2:m.score.ht?m.score.ht[1]:null};
      }
      var goals=[];
      (m.goals1||[]).forEach(function(g){goals.push({name:g.name,team:t1,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      (m.goals2||[]).forEach(function(g){goals.push({name:g.name,team:t2,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      goals.sort(function(a,b){return a.minute-b.minute;});
      if(goals.length)OFB_GOALS[key]=goals;
    });
    OFB_LAST_FETCH=now;
    // Recompute auto prize awards now that scores are fresh
    calcAutoAwards();
    render();
  }catch(e){
    console.log('OFB fetch failed:', e.message);
  }
}

function findMatchKey(t1,t2,date){
  var matches=getMatches();
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(m.d===date&&((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1))){
      return m.key;
    }
  }
  // Fallback: match by teams only (different date format)
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1)){
      return m.key;
    }
  }
  return null;
}

async function loadFromGitHub(){
  setStatus('loading','Syncing…','#fbbf24');
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON in config');}
    // Only sync mutable state from remote — never overwrite structure
    // (families, pots, pot costs stay hardcoded in HTML as source of truth)
    if(data.allocations){
      // Validate: only keep allocations for teams that exist in current pots
      var validTeams=new Set([...(DEFAULT_CFG.pot0||[]),...DEFAULT_CFG.pot1,...DEFAULT_CFG.pot2,...DEFAULT_CFG.pot3]);
      var cleaned={};
      Object.entries(data.allocations).forEach(function(e){
        var id=e[0], teams=e[1];
        var valid=(teams||[]).filter(function(t){return validTeams.has(t);});
        if(valid.length) cleaned[id]=valid;
      });
      CFG.allocations=cleaned;
    }
    if(data.familyBuys)   CFG.familyBuys   = data.familyBuys;
    if(data.prizes)       CFG.prizes       = data.prizes;
    if(data.manualAwards)   CFG.manualAwards   = data.manualAwards;
    if(data.manualOverrides)CFG.manualOverrides = data.manualOverrides;
    if(data.cardTotals)     CFG.cardTotals      = data.cardTotals;
    if(data.pot0Cost)     CFG.pot0Cost     = data.pot0Cost;
    if(data.pot1Cost)     CFG.pot1Cost     = data.pot1Cost;
    if(data.pot2Cost)     CFG.pot2Cost     = data.pot2Cost;
    if(data.pot3Cost)     CFG.pot3Cost     = data.pot3Cost;
    if(!CFG.allocations)  CFG.allocations  = {};
    if(!CFG.prizes)       CFG.prizes       = {...DEFAULT_CFG.prizes};
    if(!CFG.familyBuys)   CFG.familyBuys   = {...DEFAULT_CFG.familyBuys};
    setStatus('ok','✓ Synced with GitHub','#00d4aa');
  }catch(e){
    setStatus('warn','Local mode — set token in ⚙ Admin to enable sync ('+e.message+')','#fbbf24');
  }
  // Also fetch live scores from openfootball
  await loadFromOpenFootball();
  render();
}

async function pushToGitHub(cfg){
  var token='';try{token=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(!token){
    alert('No GitHub token set. Go to ⚙ Admin tab and enter your token first.');
    return false;
  }
  setStatus('saving','Saving to GitHub…','#fbbf24');
  try{
    // Get current SHA
    const metaRes=await fetch(GH_API,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(!metaRes.ok)throw new Error('GitHub API '+metaRes.status+' — check your token has Contents:Write on the portfolio repo');
    const meta=await metaRes.json();
    const sha=meta.sha;
    // Only persist mutable state — families/pots live in the HTML as source of truth
    var mutable={
      allocations:   cfg.allocations||{},
      familyBuys:    cfg.familyBuys||{},
      prizes:        cfg.prizes||{},
      manualAwards:    cfg.manualAwards||{},
      manualOverrides: cfg.manualOverrides||{},
      cardTotals:      cfg.cardTotals||{},
      pot0Cost:      cfg.pot0Cost||15,
      pot1Cost:      cfg.pot1Cost||10,
      pot2Cost:      cfg.pot2Cost||5,
      pot3Cost:      cfg.pot3Cost||5,
    };
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(mutable,null,2))));
    const putRes=await fetch(GH_API,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'wc2026: update config',content,sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||'Push failed');}
    setStatus('ok','✓ Saved to GitHub','#00d4aa');
    return true;
  }catch(e){
    setStatus('err','⚠ '+e.message,'#ff4757');
    return false;
  }
}

// DERIVED DATA
// ═══════════════════════════════════════════════════════════
function getMatches(){
  return MATCHES.map(function(m,i){
    var key='m'+i;
    var manual=SCORES[key];
    var auto=OFB[key];
    var sc=manual||auto||null;
    var goals=OFB_GOALS[key]||null;
    var ofbTime=OFB_TIMES[key]||null;
    return Object.assign({},m,{
      key:key,
      s1:sc?sc.s1:null,
      s2:sc?sc.s2:null,
      ht1:sc?sc.ht1:null,
      ht2:sc?sc.ht2:null,
      goals:goals,
      isManual:!!manual,
      isAuto:!manual&&!!auto,
      ofbTime:ofbTime
    });
  });
}

function buildStandings(matches){
  var sm={};
  matches.filter(function(m){return m.g;}).forEach(function(m){
    var g=m.g.replace('Group ','');
    if(!sm[g])sm[g]={};
    [m.t1,m.t2].forEach(function(t){if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    if(m.s1!=null&&m.s2!=null){
      var s=sm[g];
      s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.s1;s[m.t1].ga+=m.s2;s[m.t2].gf+=m.s2;s[m.t2].ga+=m.s1;
      if(m.s1>m.s2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
      else if(m.s1<m.s2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
      else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
    }
  });
  return sm;
}

function getTeamResult(teamName,matches,sm){
  var km=matches.filter(function(m){return !m.g;});
  var fin=km.find(function(m){return m.round==='Final'&&m.s1!=null;});
  if(fin){
    var w=fin.s1>fin.s2?fin.t1:fin.t2,l=fin.s1<fin.s2?fin.t1:fin.t2;
    if(teamName===w)return'champion';
    if(teamName===l)return'runner';
    var t3=km.find(function(m){return m.round==='Match for third place'&&m.s1!=null;});
    if(t3&&teamName===(t3.s1>t3.s2?t3.t1:t3.t2))return'third';
  }
  // Group advancement: only award once ALL 6 group matches are complete
  var grpMatch=MATCHES.find(function(m){return m.t1===teamName||m.t2===teamName;});
  var grp=grpMatch&&grpMatch.g?grpMatch.g.replace('Group ',''):null;
  if(grp&&sm[grp]){
    var grpMatches=matches.filter(function(m){return m.g==='Group '+grp;});
    var allPlayed=grpMatches.length===6&&grpMatches.every(function(m){return m.s1!=null;});
    if(allPlayed){
      var sorted=Object.values(sm[grp]).sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
      if(sorted.slice(0,2).some(function(s){return s.name===teamName;}))return'advanced';
    }
  }
  return'active';
}

function tagClass(r){return{champion:'champion',runner:'runner',third:'advanced',advanced:'advanced'}[r]||'neutral';}
function tagLabel(r){return{champion:'🏆',runner:'🥈',third:'🥉',advanced:'✓'}[r]||'';}

function calcPrizeTotal(prz){
  return getPrizeDefs().reduce(function(s,pd){

    return s+(val*mult);
  },0);
}

function fmtKOTeam(code){
  // e.g. '1A' -> '1st Group A', '2B' -> '2nd Group B'
  // e.g. 'W73' -> 'W/Mx #73', 'L101' -> 'L/Mx #101'
  // 'Best 3rd' stays
  if(!code||isKnown(code))return code;
  var m1=code.match(/^([12])([A-L])$/);
  if(m1)return (m1[1]==='1'?'1st':'2nd')+' Grp '+m1[2];
  var m2=code.match(/^([WL])(\d+)$/);
  if(m2)return (m2[1]==='W'?'W':'L')+' Mx#'+m2[2];
  var m3=code.match(/^(\d)([A-L])\/?/);
  if(m3)return m3[1]+' Grp '+m3[2];
  return code;
}

// ── SCORES TAB ────────────────────────────────────────────
function renderScores(){
  var matches=getMatches();
  var filters=[['group','By Group'],['date','By Date'],['done','Played'],['pending','Upcoming'],['all','All']];
  var filtered=matches.filter(function(m){
    if(scoreFilter==='group')return!!m.g;
    if(scoreFilter==='knockout')return!m.g;
    if(scoreFilter==='pending')return m.s1==null;
    if(scoreFilter==='done')return m.s1!=null;
    return true; // 'date' and 'all' show everything
  });
  // For date view: sort by date then time
  var sortByDate=(scoreFilter==='date');
  if(sortByDate){
    filtered=filtered.slice().sort(function(a,b){
      if(a.d!==b.d)return a.d<b.d?-1:1;
      // Sub-sort by kickoff time if available
      var ta=(a.ofbTime&&typeof a.ofbTime==='object'?a.ofbTime.timeStr:a.ofbTime)||'';
      var tb=(b.ofbTime&&typeof b.ofbTime==='object'?b.ofbTime.timeStr:b.ofbTime)||'';
      return ta<tb?-1:ta>tb?1:0;
    });
  }
  var autoCount=matches.filter(function(m){return m.isAuto;}).length;
  var manualCount=matches.filter(function(m){return m.isManual;}).length;
  var filterBtns=filters.map(function(fv){
    return '<button class="btn'+(scoreFilter===fv[0]?' btn-accent':'')+'" data-filter="'+fv[0]+'" onclick="setScoreFilter(this)">'+fv[1]+'</button>';
  }).join('');
  var out='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Show</span>'+
    filterBtns+'</div>';
  out+='<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11px;color:#8b9ab8">'+
    '<span style="color:#5a6a88">Sources:</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#00d4aa;margin-right:4px;vertical-align:-1px"></span>openfootball live ('+autoCount+')</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#60a5fa;margin-right:4px;vertical-align:-1px"></span>Manual override ('+manualCount+')</span>'+
    '<span style="color:#5a6a88;font-style:italic">Click any row to enter manually</span></div>';
  out+='<div style="display:flex;flex-direction:column;gap:4px">';
  var lastDateHeader='';
  filtered.forEach(function(m){
    // Date grouping header for By Date view
    if(sortByDate&&m.d!==lastDateHeader){
      lastDateHeader=m.d;
      var played=filtered.filter(function(x){return x.d===m.d&&x.s1!=null;}).length;
      var total=filtered.filter(function(x){return x.d===m.d;}).length;
      var aestDateStr='';
      if(m.ofbTime){var ts=venueToAEST(m.ofbTime,m.gr,m.d);if(ts)aestDateStr=' <span style="font-size:10px;color:#5a6a88;font-weight:400">('+ts.split(' ').slice(0,3).join(' ')+' AEST)</span>';}
      out+='<div style="display:flex;align-items:center;gap:10px;margin-top:10px;margin-bottom:4px">'+
        '<div class="font-display" style="font-size:12px;font-weight:700;color:#f0f4ff;letter-spacing:.04em">'+fmtDate(m.d)+aestDateStr+'</div>'+
        '<div style="font-size:10px;color:#5a6a88">'+played+'/'+total+' played</div>'+
        '<div style="flex:1;height:1px;background:#ffffff0a"></div>'+
        '</div>';

async function refreshCardData(){
  var btn=document.getElementById('card-refresh-btn');
  if(btn){btn.disabled=true;btn.textContent='Fetching...';}
  var msg=document.getElementById('card-refresh-msg');
  if(msg)msg.innerHTML='<span style="color:#fbbf24">Fetching from FBref...</span>';

  // Use allorigins CORS proxy to fetch FBref misc stats
  var fbrefUrl='https://fbref.com/en/comps/1/misc/World-Cup-Miscellaneous-Stats';

  // Try multiple CORS proxies in order
  // Try direct fetch first (works if FBref allows CORS from this origin)
  // then fall back to proxies
  // ScrapingBee API — stored in localStorage alongside GitHub token
  var sbKey='';try{sbKey=localStorage.getItem('wc26_sb_key')||'';}catch(e){}
  if(!sbKey){
    var k=prompt('Enter your ScrapingBee API key (stored locally, never sent to GitHub):');
    if(!k){if(btn){btn.disabled=false;btn.textContent='🟨🟥 Refresh Card Data';}return;}
    try{localStorage.setItem('wc26_sb_key',k);}catch(e){}
    sbKey=k;
  }

  try{
    if(msg)msg.innerHTML='<span style="color:#fbbf24">Fetching via ScrapingBee...</span>';
    // ScrapingBee: render_js=false (FBref is static HTML), premium_proxy=false (not needed for FBref)
    // stealth_proxy bypasses Cloudflare — costs 75 credits but works on protected sites
    var sbUrl='https://app.scrapingbee.com/api/v1/?api_key='+encodeURIComponent(sbKey)+
      '&url='+encodeURIComponent(fbrefUrl)+
      '&render_js=false&block_resources=true&stealth_proxy=true';
    var r=await fetch(sbUrl,{signal:AbortSignal.timeout(30000)});
    if(r.status===401){
      try{localStorage.removeItem('wc26_sb_key');}catch(e){}
      throw new Error('ScrapingBee API key invalid — key cleared, try again');
    }
    if(!r.ok)throw new Error('ScrapingBee HTTP '+r.status);
    var html=await r.text();
    if(!html||html.length<5000)throw new Error('Response too short ('+html.length+' chars) — try again');
    console.log('ScrapingBee succeeded: '+html.length+' chars');

    // Parse the HTML table with DOMParser
    var parser=new DOMParser();
    var doc=parser.parseFromString(html,'text/html');

    // FBref misc table id: stats_squads_misc_for
    var table=doc.getElementById('stats_squads_misc_for')||doc.querySelector('table.stats_table');
    if(!table)throw new Error('Could not find FBref stats table in response');

    var NAME_MAP={
      'United States':'USA','Bosnia and Herzegovina':'Bosnia & Herzegovina',
      "Côte d'Ivoire":'Ivory Coast','Korea Republic':'South Korea',
      'Curaçao':'Curaçao','Cabo Verde':'Cape Verde','DR Congo':'DR Congo',
      'Czechia':'Czechia'
    };

    var cardTotals={};
    var rows=table.querySelectorAll('tbody tr');
    rows.forEach(function(row){
      if(row.classList.contains('thead'))return;
      var teamTd=row.querySelector('[data-stat="team"],[data-stat="squad"]');
      if(!teamTd)return;
      var a=teamTd.querySelector('a');
      var team=(a?a.textContent:teamTd.textContent).trim();
      team=NAME_MAP[team]||team;
      var ycTd=row.querySelector('[data-stat="cards_yellow"]');
      var rcTd=row.querySelector('[data-stat="cards_red"]');
      if(!ycTd||!rcTd)return;
      var yc=parseInt(ycTd.textContent.trim())||0;
      var rc=parseInt(rcTd.textContent.trim())||0;
      if(team)cardTotals[team]={yellow:yc,red:rc};
    });

    var count=Object.keys(cardTotals).length;
    if(count===0)throw new Error('Parsed 0 teams — FBref table structure may have changed');

    // Store in CFG and push
    CFG.cardTotals=cardTotals;
    calcAutoAwards();
    var ok=await pushToGitHub(CFG);

    if(msg)msg.innerHTML='<span style="color:#00d4aa">✓ Card data updated — '+count+' teams ('+
      Object.values(cardTotals).reduce(function(s,v){return s+v.yellow;},0)+' yellows, '+
      Object.values(cardTotals).reduce(function(s,v){return s+v.red;},0)+' reds)</span>';
    renderSweep();

  }catch(e){
    console.error('Card refresh failed:',e);
    if(msg)msg.innerHTML='<span style="color:#ff4757">✗ Failed: '+e.message+'</span>';
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🟨🟥 Refresh Card Data';}
  }
}

// Adjust family pick count
function adjustFamPick(famId,potKey,delta){
  var b=CFG.familyBuys[famId]||{p0:0,p1:0,p2:0,p3:0};
  var potNum=parseInt(potKey[1]); // 'p0'->0, 'p1'->1 etc
  var potArr=CFG['pot'+potNum]||[];

  // Global pool: total slots = potArr.length
  // Other families' claims for this pot
  var otherClaimed=0;
  CFG.families.forEach(function(f){
    if(f.id===famId)return;
    var fb=CFG.familyBuys[f.id]||{};
    otherClaimed+=(fb[potKey]||0);
  });
  var maxForFam=potArr.length-otherClaimed;

  // Can't reduce below what's already drawn
  var allocs=CFG.allocations||{};
  var famTeams=CFG.families.find(function(f){return f.id===famId;}).members
    .flatMap(function(m){return allocs[m.id]||[];});
  var drawn=famTeams.filter(function(t){return potArr.includes(t);}).length;

  b[potKey]=Math.max(drawn, Math.min(maxForFam, (b[potKey]||0)+delta));
  CFG.familyBuys[famId]=b;
  pushToGitHub(CFG);
  renderAdmin();
}

// Toggle member active/inactive
function toggleMember(famId,memId){
  var fam=CFG.families.find(function(f){return f.id===famId;});
  if(!fam)return;
  var mem=fam.members.find(function(m){return m.id===memId;});
  if(!mem)return;
  if(mem.active===false){
    // Reactivate
    mem.active=true;
  }else{
    // Deactivate — return their teams to pool
    mem.active=false;
    if(CFG.allocations[memId]&&CFG.allocations[memId].length){
      // Teams go back to available (remove from allocations)
      delete CFG.allocations[memId];
    }
  }
  pushToGitHub(CFG);
  renderAdmin();
}

function updatePoolTotal(){
  var costs=[
    +(document.getElementById('pot0Cost')||{value:CFG.pot0Cost||15}).value,
    +(document.getElementById('pot1Cost')||{value:CFG.pot1Cost||10}).value,
    +(document.getElementById('pot2Cost')||{value:CFG.pot2Cost||5}).value,
    +(document.getElementById('pot3Cost')||{value:CFG.pot3Cost||5}).value,
  ];
  var totals=[0,1,2,3].map(function(p){
    return Object.values(CFG.familyBuys||{}).reduce(function(s,b){return s+(b['p'+p]||0);},0);
  });
  var pool=totals.reduce(function(s,t,i){return s+(t*costs[i]);},0);
  var el=document.getElementById('admin-pool-total');
  if(el)el.textContent='$'+pool;
  var bd=document.getElementById('admin-pool-breakdown');
  if(bd)bd.textContent=totals.map(function(t,i){return t+'× P'+i;}).join(' · ');
  CFG.families.forEach(function(fam){
    var b=CFG.familyBuys[fam.id]||{p0:0,p1:0,p2:0,p3:0};
    var famTotal=[0,1,2,3].reduce(function(s,p){return s+(b['p'+p]||0)*costs[p];},0);
    var tel=document.getElementById('buys-'+fam.id+'-total');
    if(tel)tel.textContent='$'+famTotal;
  });
  updatePrizeTotals();
}

function updateTokenStatus(){
  var ts=document.getElementById('token-status-placeholder');
  if(!ts)return;
  var t='';
  try{t=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(t){
    ts.innerHTML='<div style="font-size:11px;color:#00d4aa;margin-top:8px">✓ Token is set in this browser — you can push changes. <span style="cursor:pointer;color:#ff4757;text-decoration:underline" onclick="try{localStorage.removeItem(\'wc26_token\');}catch(e){}renderAdmin()">Clear token</span></div>';
  }else{
    ts.innerHTML='<div style="font-size:11px;color:#fbbf24;margin-top:8px">⚠ No token set on this device — you can view but not save changes.</div>';
  }
}

function saveToken(){
  var t='';
  var el=document.getElementById('token-input');
  if(el)t=el.value.trim();
  if(!t){
    document.getElementById('admin-msg').innerHTML='<div style="padding:10px 14px;background:#ff475714;border:1px solid #ff475730;border-radius:6px;color:#ff4757;font-size:13px;margin-top:8px">⚠ Please enter a token</div>';
    return;
  }
  try{localStorage.setItem('wc26_token',t);}catch(e){}
  // Verify it works by doing a test push of current CFG
  pushToGitHub(CFG).then(function(ok){
    var msg=document.getElementById('admin-msg');
    if(!msg)return;
    if(ok){
      msg.innerHTML='<div style="padding:10px 14px;background:#00d4aa14;border:1px solid #00d4aa30;border-radius:6px;color:#00d4aa;font-size:13px;margin-top:8px">✓ Token saved to your browser — working correctly</div>';
    }else{
      msg.innerHTML='<div style="padding:10px 14px;background:#ff475714;border:1px solid #ff475730;border-radius:6px;color:#ff4757;font-size:13px;margin-top:8px">⚠ Token saved but push failed — check permissions</div>';
    }
    updateTokenStatus();
  });
}

function updatePrizeTotals(){
  var prizeKeys=['champion','runner','third','groupAdvance','goldenBoot','bestGD','worstGD','mostYellow','mostRed','firstGoal','mostCleanSheets','topFamily'];
  var total=prizeKeys.reduce(function(s,k){

function startSpin(memberId,memberName,famColor,pot){
  var allocated=new Set(Object.values(CFG.allocations||{}).flat());
  var available=CFG['pot'+pot].filter(function(t){return !allocated.has(t);});
  if(!available.length){alert('No teams left in Pot '+pot+'!');return;}

  spinMemberId=memberId;spinMemberName=memberName;spinFamColor=famColor;spinPot=pot;

  // For Pot 1: if elite teams (top 8) are still available, restrict spin to those.
  // Once all elite are drawn, open up to full pot.
  var spinPool=available;
  if(pot===1){
    var eliteAvailable=spinPot===0?available:[];
    if(eliteAvailable.length>0){
      spinPool=eliteAvailable; // pot 0 = all elite
    }
  }

  // Build reel: repeat pool enough times to fill ~36 slots, then shuffle
  var repeats=Math.ceil(36/spinPool.length);
  var reelSource=[];
  for(var r=0;r<repeats;r++) reelSource=reelSource.concat(spinPool);
  spinTeams=shuffle(reelSource.slice(0,36));
  spinWinner=null;spinPhase='ready';

  const box=document.getElementById('spin-box');
  box.style.borderColor=POT[pot].color+'50';

  document.getElementById('spin-highlight').style.borderColor=POT[pot].color+'80';

  renderSpinner();
  document.getElementById('spin-overlay').classList.add('show');
}

// ── Spinner sounds (Web Audio API — no files needed) ──────────────
var audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  return audioCtx;
}

function playTick(freq,duration,vol){
  var ctx=getAudioCtx();
  if(!ctx)return;
  var osc=ctx.createOscillator();
  var gain=ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type='sine';
  osc.frequency.setValueAtTime(freq,ctx.currentTime);
  gain.gain.setValueAtTime(vol||0.08,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(duration||0.04));
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime+(duration||0.04));
}

function playWinSound(){
  var ctx=getAudioCtx();
  if(!ctx)return;
  // Rising arpeggio
  var notes=[523,659,784,1047]; // C5 E5 G5 C6
  notes.forEach(function(freq,i){
    setTimeout(function(){playTick(freq,0.18,0.15);},i*80);
  });
  // Final flourish
  setTimeout(function(){
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='triangle';
    osc.frequency.setValueAtTime(1047,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1568,ctx.currentTime+0.3);
    gain.gain.setValueAtTime(0.12,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.4);
  },320);
}

function doRespin(){spinPhase='ready';spinWinner=null;renderSpinner();}
function doSpin(){
  spinPhase='spinning';
  renderSpinner();
  const itemH=36,duration=2800+Math.random()*800;
  const winIdx=Math.floor(Math.random()*12)+10;
  const finalY=-(winIdx*itemH)+((80-itemH)/2);
  const start=Date.now();
  function ease(t){return 1-Math.pow(1-t,4);}
  var lastItemIdx=-1;
  function step(){
    const prog=Math.min((Date.now()-start)/duration,1);
    const y=ease(prog)*finalY;
    document.getElementById('spin-reel').style.transform=`translateY(${y}px)`;
    // Tick each time we cross a new item boundary
    var currentIdx=Math.floor(Math.abs(y)/itemH);
    if(currentIdx!==lastItemIdx){
      lastItemIdx=currentIdx;
      // Slow down: tick pitch and speed follow animation progress
      var speed=1-ease(prog); // 1=fast, 0=stopped
      if(speed>0.05){
        var freq=200+speed*400; // 200-600Hz, higher when fast
        var vol=0.04+speed*0.04;
        playTick(freq,0.025,vol);
      }
    }
    if(prog<1){spinAnimId=requestAnimationFrame(step);}
    else{
      spinWinner=spinTeams[winIdx];
      spinPhase='result';
      renderSpinner();
      playWinSound();
    }
  }
  spinAnimId=requestAnimationFrame(step);
}

function confirmSpin(){
  if(!spinWinner)return;
  var current=CFG.allocations[spinMemberId]||[];
  CFG.allocations[spinMemberId]=current.concat([spinWinner]);
  pushToGitHub(CFG);
  closeSpin();
  // Re-render whichever tab is active
  if(activeTab==='admin')renderAdmin();
  else renderSweep();
  // Always keep sweep leaderboard fresh too
  if(activeTab!=='sweep')renderSweep();
}

function closeSpin(){
  if(spinAnimId)cancelAnimationFrame(spinAnimId);
  document.getElementById('spin-overlay').classList.remove('show');
}

        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        out+='<tr style="border-bottom:1px solid #ffffff06">';
        out+='<td style="text-align:center;font-size:13px">'+(medal||i+1)+'</td>';
        out+='<td style="text-align:left"><div style="font-weight:600;font-size:13px">'+h(p.name)+'</div>'+
          '<div style="font-size:10px;margin-top:1px"><span style="color:'+p.famColor+'">'+h(p.famName)+'</span></div></td>';
        out+='<td style="text-align:center;color:#5a6a88">'+p.teams.length+'</td>';
        out+='<td><div class="font-display" style="font-weight:700;font-size:14px;text-align:center">'+p.avgElo+'</div>'+
          '<div style="height:4px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-top:3px;width:80px;margin-left:auto;margin-right:auto">'+
          '<div style="height:100%;width:'+barPct+'%;background:#00d4aa;border-radius:2px"></div></div></td>';
        out+='<td style="text-align:center;font-size:12px;color:'+(p.totalOdds>=5?'#00d4aa':p.totalOdds>=1?'#fbbf24':'#8b9ab8')+'">';
        out+=p.totalOdds>=0.1?p.totalOdds.toFixed(1)+'%':'<0.1%';
        out+='</td>';
        out+='<td style="text-align:left"><div style="display:flex;flex-wrap:wrap;gap:3px">';
        p.teams.forEach(function(t){
          var elo=ELO[t]||1700;
          var strength=elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8';
          out+='<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:'+strength+'18;color:'+strength+';border:1px solid '+strength+'30">'+
            f(t)+' '+h(t)+'</span>';
        });
        out+='</div></td></tr>';
      });
      out+='</tbody></table></div>';
    }

  // ── GROUP DIFFICULTY VIEW ───────────────────────────────────────
  }else if(predView==='groups'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Average Elo strength of each group. Harder groups have stronger opponents to navigate through.</div>';

    var sortedGroups=Object.keys(groupElo).sort(function(a,b){return groupElo[b].avg-groupElo[a].avg;});
    var maxAvg=groupElo[sortedGroups[0]].avg,minAvg=groupElo[sortedGroups[sortedGroups.length-1]].avg;

    out+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">';
    sortedGroups.forEach(function(g,rank){
      var ge=groupElo[g];
      var c=GC[g]||'#888';
      var barPct=maxAvg>minAvg?Math.round((ge.avg-minAvg)/(maxAvg-minAvg)*100):50;
      var label=rank===0?'💀 Group of Death':rank===1?'🔥 Very Tough':rank<4?'💪 Tough':rank<8?'⚖️ Balanced':'😌 Manageable';

      out+='<div class="card-pad" style="border-color:'+c+'30">';
      out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      out+='<span class="font-display" style="font-weight:700;font-size:16px;color:'+c+'">Group '+g+'</span>';
      out+='<span style="font-size:11px;color:#5a6a88">'+label+'</span>';
      out+='</div>';
      out+='<div class="font-display" style="font-weight:800;font-size:24px;color:#f0f4ff;margin-bottom:6px">'+ge.avg+' <span style="font-size:12px;color:#5a6a88;font-weight:400">avg Elo</span></div>';
      out+='<div style="height:5px;background:#ffffff10;border-radius:3px;overflow:hidden;margin-bottom:10px">';
      out+='<div style="height:100%;width:'+barPct+'%;background:'+c+';border-radius:3px"></div></div>';

      ge.teams.sort(function(a,b){return (ELO[b]||1700)-(ELO[a]||1700);}).forEach(function(team){
        var elo=ELO[team]||1700;
        var eloBarPct=Math.round((elo-ELO_MIN)/(ELO_MAX-ELO_MIN)*100);
        var owner=null,ownerFam=null;
        CFG.families.forEach(function(fam){
          fam.members.forEach(function(mem){
            if((allocs[mem.id]||[]).includes(team)){owner=mem;ownerFam=fam;}
          });
        });
        out+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #ffffff06">';
        out+='<span style="font-size:14px;flex-shrink:0">'+f(team)+'</span>';
        out+='<div style="flex:1;min-width:0">';
        out+='<div style="display:flex;justify-content:space-between;align-items:center">';
        out+='<span style="font-size:12px;font-weight:500">'+h(team)+'</span>';
        out+='<span class="font-display" style="font-size:12px;font-weight:700;color:#8b9ab8">'+elo+'</span>';
        out+='</div>';
        out+='<div style="height:3px;background:#ffffff08;border-radius:2px;overflow:hidden;margin-top:3px">';
        out+='<div style="height:100%;width:'+eloBarPct+'%;background:'+(elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8')+';border-radius:2px"></div></div>';
        out+='</div>';
        if(owner){
          out+='<span style="font-size:10px;color:'+ownerFam.color+';font-weight:600;flex-shrink:0">'+h(owner.name.split(' ')[0])+'</span>';
        }
        out+='</div>';
      });
      out+='</div>';
    });
    out+='</div>';

  // ── HEAD TO HEAD VIEW ───────────────────────────────────────────
  }else if(predView==='h2h'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Dixon-Coles model: pick any two teams to see predicted win/draw/loss probabilities.</div>';

    var allTeamNames=Object.keys(ELO).sort();
    var teamAOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamA===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');
    var teamBOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamB===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');

    out+='<div class="card-pad" style="max-width:500px">';
    out+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">';
    out+='<select id="h2h-a" onchange="h2hTeamA=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamAOpts+'</select>';
    out+='<span class="font-display" style="font-weight:700;color:#5a6a88;font-size:18px">vs</span>';
    out+='<select id="h2h-b" onchange="h2hTeamB=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamBOpts+'</select>';
    out+='</div>';

    if(h2hTeamA&&h2hTeamB&&h2hTeamA!==h2hTeamB){
      var eloA=ELO[h2hTeamA]||ELO_BASE[h2hTeamA]||1700,eloB=ELO[h2hTeamB]||ELO_BASE[h2hTeamB]||1700;
      // Dixon-Coles simplified: logistic + draw adjustment
      var eloDiff=eloA-eloB;
      var pWinA=1/(1+Math.pow(10,-eloDiff/400));
      var drawProb=0.28-Math.abs(eloDiff)*0.00045; // flatter = more draws
      drawProb=Math.max(0.08,Math.min(0.35,drawProb));
      pWinA=(pWinA*(1-drawProb));
      var pWinB=(1-drawProb)-pWinA;
      var pWinAPct=Math.round(pWinA*100),drawPct=Math.round(drawProb*100),pWinBPct=100-pWinAPct-drawPct;

      // Expected goals (rough)
      var expGoalsA=(1.15+eloDiff*0.0004).toFixed(1);
      var expGoalsB=(1.15-eloDiff*0.0004).toFixed(1);

      var potA=CFG.pot1.includes(h2hTeamA)?1:CFG.pot2.includes(h2hTeamA)?2:3;
      var potB=CFG.pot1.includes(h2hTeamB)?1:CFG.pot2.includes(h2hTeamB)?2:3;

      out+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:16px">';
      // Team A
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamA)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamA)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloA+' · <span style="color:'+POT[potA].color+'">P'+potA+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#00d4aa;margin-top:8px">'+pWinAPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsA+'</div>';
      out+='</div>';
      // Draw
      out+='<div style="text-align:center;padding-top:40px">';
      out+='<div class="font-display" style="font-weight:700;font-size:20px;color:#5a6a88">'+drawPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">draw</div>';
      out+='</div>';
      // Team B
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamB)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamB)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloB+' · <span style="color:'+POT[potB].color+'">P'+potB+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#fbbf24;margin-top:8px">'+pWinBPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsB+'</div>';
      out+='</div>';
      out+='</div>';

      // Bar
      out+='<div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:8px">';
      out+='<div style="width:'+pWinAPct+'%;background:#00d4aa"></div>';
      out+='<div style="width:'+drawPct+'%;background:#5a6a88"></div>';
      out+='<div style="flex:1;background:#fbbf24"></div>';
      out+='</div>';
      out+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#5a6a88">';
      out+='<span>'+h(h2hTeamA)+' win</span><span>Draw</span><span>'+h(h2hTeamB)+' win</span></div>';
      out+='<div style="margin-top:12px;padding:8px 12px;background:#ffffff06;border-radius:6px;font-size:11px;color:#5a6a88">';
      out+='Model: Dixon-Coles bivariate Poisson · Elo difference: '+(eloA-eloB>0?'+':'')+(eloA-eloB)+' · Neutral venue assumed';
      out+='</div>';
    }else{
      out+='<div style="text-align:center;padding:20px;color:#5a6a88;font-size:13px">Select two different teams to compare</div>';
    }
    out+='</div>';
  }

  document.getElementById('tab-predictions').innerHTML=out;
}

var h2hTeamA='France',h2hTeamB='Spain';

</script>
<!-- Satisfy site-level share-modal.js -->
<div id="share-modal"></div>
</body>
</html>
