*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#080d18;color:#e8eeff;font-family:'Barlow',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 0%,#00d4aa14,transparent 55%),radial-gradient(ellipse 50% 40% at 85% 100%,#60a5fa12,transparent 55%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 80px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#111827}
::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:2px}
/* Typography */
.font-display{font-family:'Barlow Condensed',sans-serif}
/* Cards */
.card{background:#111827;border:1px solid #ffffff10;border-radius:10px;overflow:hidden}
.card-pad{background:#111827;border:1px solid #ffffff10;border-radius:10px;padding:16px 18px}
/* Buttons */
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:4px;cursor:pointer;border:1px solid #ffffff22;background:transparent;color:#5a6a88;transition:all .15s}
.btn:hover{color:#e8eeff;border-color:#ffffff40}
.btn-accent{background:#00d4aa18;border-color:#00d4aa40;color:#00d4aa}
.btn-accent:hover{background:#00d4aa28}
.btn-lg{font-size:16px;padding:12px 24px;border-radius:8px}
/* Tabs */
#tabs{display:flex;gap:2px;border-bottom:1px solid #ffffff10;margin-bottom:20px;overflow-x:auto}
.tab-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border:none;border-bottom:2px solid transparent;background:none;color:#5a6a88;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab-btn.active{color:#00d4aa;border-bottom-color:#00d4aa}
/* Tables */
table{width:100%;border-collapse:collapse}
th{padding:6px 7px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5a6a88;border-bottom:1px solid #ffffff0a;text-align:center}
th.left{text-align:left}
td{padding:7px 7px;font-size:13px;border-bottom:1px solid #ffffff06;text-align:center}
td.left{text-align:left}
tr:last-child td{border-bottom:none}
/* Inputs */
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13px;background:#1a2235;border:1px solid #ffffff18;border-radius:6px;color:#e8eeff;padding:7px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#00d4aa50}
input[type=number]::-webkit-inner-spin-button{opacity:1}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
/* ── Responsive ─────────────────────────────── */
@media(max-width:800px){
  .grid-2{grid-template-columns:1fr}
  .grid-groups{grid-template-columns:1fr}
  #app{padding:0 10px 60px}
  .ko-rounds{min-width:600px}
  .ko-col.wide{flex:1.5}
}
@media(max-width:600px){
  #tabs{gap:0}
  .tab-btn{padding:8px 10px;font-size:11px;letter-spacing:.03em}
  .font-display.hero{font-size:22px!important}
  .grid-stats{grid-template-columns:1fr 1fr}

  .score-row-grid{grid-template-columns:1fr auto 1fr!important;gap:4px!important}
  .score-row-venue{display:none}
  .score-row-meta{font-size:10px}

  .ko-rounds{min-width:480px;gap:4px}
  .ko-match{font-size:10px}
  .ko-team .name{font-size:10px!important}
  /* Family panels */
  .fam-header{flex-wrap:wrap;gap:6px}
  .fam-pm-controls{flex-wrap:wrap;gap:4px}
  /* Tables - compress */
  table td,table th{padding:5px 4px!important;font-size:11px!important}
}
@media(max-width:420px){
  .tab-btn{padding:6px 8px;font-size:10px}
  .grid-stats{grid-template-columns:1fr}
}
/* Status bar */
#statusbar{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.05em}
/* Spinner overlay */
#spin-overlay{display:none;position:fixed;inset:0;background:#080d18ee;z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}

.spin-box{background:#111827;border:1px solid #ffffff18;border-radius:16px;padding:36px 32px;text-align:center;max-width:400px;width:90%}
.spin-window{height:80px;overflow:hidden;position:relative;border-radius:8px;background:#080d18;margin:16px 0}
.spin-window::before,.spin-window::after{content:'';position:absolute;left:0;right:0;height:22px;z-index:2}
.spin-window::before{top:0;background:linear-gradient(#080d18,transparent)}
.spin-window::after{bottom:0;background:linear-gradient(transparent,#080d18)}
.spin-highlight{position:absolute;top:50%;left:0;right:0;height:36px;transform:translateY(-50%);border-top:1px solid #00d4aa60;border-bottom:1px solid #00d4aa60;pointer-events:none;z-index:3}
.spin-reel{display:flex;flex-direction:column;align-items:center}
.spin-item{height:36px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;width:100%;white-space:nowrap}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes glow{0%{color:#f0f4ff}50%{color:#00d4aa;text-shadow:0 0 20px #00d4aa80}100%{color:#00d4aa}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1s ease-in-out infinite}
.glow{animation:glow .8s ease forwards}
.fade-up{animation:fadeUp .25s ease}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px}
/* Pot colours */
.pot0{color:#f59e0b;background:#f59e0b18;border:1px solid #f59e0b30}
.pot1{color:#00d4aa;background:#00d4aa18;border:1px solid #00d4aa30}
.pot2{color:#60a5fa;background:#60a5fa18;border:1px solid #60a5fa30}
.pot3{color:#a78bfa;background:#a78bfa18;border:1px solid #a78bfa30}
.champion{color:#a78bfa;background:#a78bfa18;border:1px solid #a78bfa30}
.runner{color:#60a5fa;background:#60a5fa18;border:1px solid #60a5fa30}
.advanced{color:#00d4aa;background:#00d4aa18;border:1px solid #00d4aa30}
.neutral{color:#8b9ab8;background:#ffffff08;border:1px solid #ffffff10}

.match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:3px 0;font-size:11px}

.bracket{overflow-x:auto;padding-bottom:10px}
.ko-rounds{display:flex;gap:8px;min-width:860px;align-items:flex-start}
.ko-col{display:flex;flex-direction:column;flex:1}
.ko-col.wide{flex:2}

const OFB_URL='https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';

async function loadFromOpenFootball(){
  // Only refetch if >5 mins since last fetch
  var now=Date.now();
  if(now-OFB_LAST_FETCH<5*60*1000&&OFB_LAST_FETCH>0)return;
  try{
    var r=await fetch(OFB_URL+'?t='+now);
    if(!r.ok)return;
    var data=await r.json();
    var matches=data.matches||[];
    OFB={};OFB_GOALS={};
    matches.forEach(function(m,i){
      // Match by date + team names
      var t1=normTeam(m.team1||'');
      var t2=normTeam(m.team2||'');
      var key=findMatchKey(t1,t2,m.date||'');
      if(key===null)return;
      if(m.score&&m.score.ft){
        OFB[key]={s1:m.score.ft[0],s2:m.score.ft[1],ht1:m.score.ht?m.score.ht[0]:null,ht2:m.score.ht?m.score.ht[1]:null};
      }
      var goals=[];
      (m.goals1||[]).forEach(function(g){goals.push({name:g.name,team:t1,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      (m.goals2||[]).forEach(function(g){goals.push({name:g.name,team:t2,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      goals.sort(function(a,b){return a.minute-b.minute;});
      if(goals.length)OFB_GOALS[key]=goals;
    });
    OFB_LAST_FETCH=now;
  }catch(e){
    // Silently fail - manual scores still work
  }
}

function findMatchKey(t1,t2,date){
  var matches=getMatches();
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(m.d===date&&((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1))){
      return m.key;
    }
  }
  // Fallback: match by teams only (different date format)
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1)){
      return m.key;
    }
  }
  return null;
}

async function loadFromGitHub(){
  setStatus('loading','Syncing…','#fbbf24');
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON in config');}
    // Daralads: sync all mutable sweep config from remote
    if(data.sweepName)    CFG.sweepName    = data.sweepName;
    if(data.buyIn!=null)  CFG.buyIn        = data.buyIn;
    if(data.prizes)       CFG.prizes       = Object.assign({},DEFAULT_CFG.prizes,data.prizes);
    if(data.participants&&data.participants.length) CFG.participants = data.participants;

    if(!CFG.prizes)       CFG.prizes       = Object.assign({},DEFAULT_CFG.prizes);
    setStatus('ok','✓ Synced with GitHub','#00d4aa');
    var nd=document.getElementById('sweep-name-display');
    if(nd&&CFG.sweepName)nd.textContent=CFG.sweepName;
  }catch(e){
    setStatus('warn','Local mode — set token in ⚙ Admin to enable sync ('+e.message+')','#fbbf24');
  }
  // Also fetch live scores from openfootball
  await loadFromOpenFootball();
  render();
}

async function pushToGitHub(cfg){
  var token='';try{token=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(!token){
    alert('No GitHub token set. Go to ⚙ Admin tab and enter your token first.');
    return false;
  }
  setStatus('saving','Saving to GitHub…','#fbbf24');
  try{
    // Get current SHA
    const metaRes=await fetch(GH_API,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(!metaRes.ok)throw new Error('GitHub API '+metaRes.status+' — check your token has Contents:Write on the portfolio repo');
    const meta=await metaRes.json();
    const sha=meta.sha;
    // Daralads: persist all sweep config
    var mutable={
      sweepName:    cfg.sweepName||DEFAULT_CFG.sweepName,
      buyIn:        cfg.buyIn||0,
      prizes:       cfg.prizes||{},
      participants: cfg.participants||[],

    };
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(mutable,null,2))));
    const putRes=await fetch(GH_API,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'wc2026: update config',content,sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||'Push failed');}
    setStatus('ok','✓ Saved to GitHub','#00d4aa');
    return true;
  }catch(e){
    setStatus('err','⚠ '+e.message,'#ff4757');
    return false;
  }
}

function getMatches(){
  return MATCHES.map(function(m,i){
    var key='m'+i;
    var manual=SCORES[key];
    var auto=OFB[key];
    var sc=manual||auto||null;
    var goals=OFB_GOALS[key]||null;
    return Object.assign({},m,{
      key:key,
      s1:sc?sc.s1:null,
      s2:sc?sc.s2:null,
      ht1:sc?sc.ht1:null,
      ht2:sc?sc.ht2:null,
      goals:goals,
      isManual:!!manual,
      isAuto:!manual&&!!auto
    });
  });
}

function buildStandings(matches){
  var sm={};
  matches.filter(function(m){return m.g;}).forEach(function(m){
    var g=m.g.replace('Group ','');
    if(!sm[g])sm[g]={};
    [m.t1,m.t2].forEach(function(t){if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    if(m.s1!=null&&m.s2!=null){
      var s=sm[g];
      s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.s1;s[m.t1].ga+=m.s2;s[m.t2].gf+=m.s2;s[m.t2].ga+=m.s1;
      if(m.s1>m.s2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
      else if(m.s1<m.s2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
      else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
    }
  });
  return sm;
}

function getTeamResult(teamName,matches,sm){
  var km=matches.filter(function(m){return !m.g;});
  var fin=km.find(function(m){return m.round==='Final'&&m.s1!=null;});
  if(fin){
    var w=fin.s1>fin.s2?fin.t1:fin.t2,l=fin.s1<fin.s2?fin.t1:fin.t2;
    if(teamName===w)return'champion';
    if(teamName===l)return'runner';
    var t3=km.find(function(m){return m.round==='Match for third place'&&m.s1!=null;});
    if(t3&&teamName===(t3.s1>t3.s2?t3.t1:t3.t2))return'third';
  }
  // Group advancement: only award once ALL 6 group matches are complete
  var grpMatch=MATCHES.find(function(m){return m.t1===teamName||m.t2===teamName;});
  var grp=grpMatch&&grpMatch.g?grpMatch.g.replace('Group ',''):null;
  if(grp&&sm[grp]){
    var grpMatches=matches.filter(function(m){return m.g==='Group '+grp;});
    var allPlayed=grpMatches.length===6&&grpMatches.every(function(m){return m.s1!=null;});
    if(allPlayed){
      var sorted=Object.values(sm[grp]).sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
      if(sorted.slice(0,2).some(function(s){return s.name===teamName;}))return'advanced';
    }
  }
  return'active';
}

function renderSweep(){
  var matches=getMatches();
  var sm=buildStandings(matches);
  var prz=CFG.prizes||{};
  // Leaderboard calc — uses live match results via getTeamResult
  var lb=(CFG.participants||[]).map(function(p){
    var pts=0,notes=[];
    (p.teams||[]).forEach(function(t){
      var r=getTeamResult(t,matches,sm);
      if(r==='champion'){pts+=prz.champion||0;notes.push(t+' 🏆');}
      else if(r==='runner'){pts+=prz.runner||0;notes.push(t+' 🥈');}
      else if(r==='third'){pts+=prz.third||0;notes.push(t+' 🥉');}
      else if(r==='advanced'){pts+=prz.groupAdvance||0;notes.push(t+' ✓');}
    });
    return Object.assign({},p,{pts:pts,notes:notes});
  }).sort(function(a,b){return b.pts-a.pts;});

  var pool=(CFG.participants||[]).length*(CFG.buyIn||0);
  var prizeTotal=calcPrizeTotal(prz);
  var prizeColor=prizeTotal===pool?'#00d4aa':prizeTotal<pool?'#fbbf24':'#ff4757';
  var prizeStatus=prizeTotal===pool?'✓ Balanced':prizeTotal<pool?'$'+(pool-prizeTotal)+' unallocated':'$'+(prizeTotal-pool)+' over';

  // View toggle
  var out='<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">View</span>'+

    '<button class="btn'+(sweepView==='teams'?' btn-accent':'')+'" onclick="setSweepView(\'teams\')">By Team</button>'+

function updatePrizeTotals(){
  var prizeKeys=['champion','runner','third','groupAdvance','goldenBoot','bestGD','worstGD','mostYellow','mostRed','firstGoal','mostCleanSheets','topFamily'];
  var total=prizeKeys.reduce(function(s,k){
    var el=document.getElementById('prize-'+k);
    var val=el?+(el.value)||0:0;
    var mult=k==='groupAdvance'?24:1;
    return s+(val*mult);
  },0);
  var buyin=+(document.getElementById('cfg-buyin')||{value:CFG.buyIn||0}).value||CFG.buyIn||0;
  var pool=(CFG.participants||[]).length*buyin;
  var color=total===pool?'#00d4aa':total<pool?'#fbbf24':'#ff4757';
  var status=total===pool?'✓ Balanced':total<pool?'$'+(pool-total)+' unallocated':'$'+(total-pool)+' over budget';
  var badge=document.getElementById('prize-total-badge');
  if(badge){badge.textContent='$'+total;badge.style.color=color;}
  var statusBadge=document.getElementById('prize-status-badge');
  if(statusBadge){statusBadge.textContent=status;statusBadge.style.color=color;statusBadge.style.background=color+'18';statusBadge.style.borderColor=color+'30';}
  var bar=document.getElementById('prize-bar');
  if(bar){bar.style.width=pool>0?Math.min(100,Math.round(total/pool*100))+'%':'0%';bar.style.background=color;}
  var lbl=document.getElementById('prize-bar-label');
  if(lbl){lbl.textContent=Math.round(total/Math.max(pool,1)*100)+'% of pool · '+status;lbl.style.color=color;}
}

function fmtKOTeam(code){
  if(!code||isKnown(code))return code;
  var m1=code.match(/^([12])([A-L])$/);
  if(m1)return(m1[1]==='1'?'1st':'2nd')+' Grp '+m1[2];
  var m2=code.match(/^([WL])(\d+)$/);
  if(m2)return(m2[1]==='W'?'W':'L')+' Mx#'+m2[2];
  return code;
}

function renderKnockout(){

function renderStats(){
  var matches=getMatches();
  var sm=buildStandings(matches);
  var allTeams=[...new Set(matches.filter(function(m){return m.g;}).flatMap(function(m){return[m.t1,m.t2];}).filter(isKnown))].sort();
  var rows=allTeams.map(function(name){
    var grp=Object.entries(sm).find(function(e){return e[1][name];})?.[0]||'?';
    var s=sm[grp]?.[name]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    return Object.assign({name:name,group:grp},s,{gd:s.gf-s.ga});
  }).sort(function(a,b){
    if(statsSort==='pts')return b.pts-a.pts||b.gd-a.gd;
    if(statsSort==='gf')return b.gf-a.gf||b.pts-a.pts;
    if(statsSort==='gd')return b.gd-a.gd||b.gf-a.gf;
    if(statsSort==='ga')return a.ga-b.ga;
    return a.group.localeCompare(b.group);
  });
  var sortBtns=[['pts','Points'],['gf','Goals'],['gd','GD'],['ga','Fewest Against'],['grp','Group']];
  var out='<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Sort</span>'+
    sortBtns.map(function(sv){return '<button class="btn'+(statsSort===sv[0]?' btn-accent':'')+'" onclick="statsSort=\''+sv[0]+'\';renderStats()">'+sv[1]+'</button>';}).join('')+
    '</div>';
  out+='<div class="card"><table><thead><tr style="background:#ffffff05">';
  ['#','Team','Grp','Pld','W','D','L','GF','GA','GD','Pts'].forEach(function(hd){
    out+='<th style="text-align:'+(hd==='Team'?'left':'center')+'">'+hd+'</th>';
  });
  out+='</tr></thead><tbody>';
  rows.forEach(function(r,i){
    var c=GC[r.group]||'#888';
    out+='<tr>';
    out+='<td style="color:#5a6a88;font-size:11px">'+(i+1)+'</td>';
    out+='<td style="text-align:left;font-weight:500">'+f(r.name)+' '+h(r.name)+'</td>';
    out+='<td><span class="font-display" style="font-size:10px;font-weight:700;color:'+c+';background:'+c+'18;padding:1px 6px;border-radius:3px">'+r.group+'</span></td>';
    out+='<td style="color:#5a6a88">'+r.p+'</td><td>'+r.w+'</td>';
    out+='<td style="color:#5a6a88">'+r.d+'</td><td style="color:#5a6a88">'+r.l+'</td>';
    out+='<td style="font-weight:'+(r.gf>0?600:400)+'">'+r.gf+'</td>';
    out+='<td style="color:#5a6a88">'+r.ga+'</td>';
    out+='<td class="font-display" style="font-weight:700;font-size:14px;color:'+(r.gd>0?'#00d4aa':r.gd<0?'#ff4757':'#5a6a88')+'">'+(r.gd>0?'+':'')+r.gd+'</td>';
    out+='<td class="font-display" style="font-weight:700;font-size:16px">'+r.pts+'</td>';
    out+='</tr>';
  });
  if(!rows.length) out+='<tr><td colspan="11" style="text-align:center;padding:40px;color:#5a6a88">Stats appear once scores are entered</td></tr>';
  out+='</tbody></table></div>';
  document.getElementById('tab-stats').innerHTML=out;
}

function renderScores(){
  var matches=getMatches();
  var filters=[['group','Group'],['knockout','Knockout'],['pending','Pending'],['done','Played'],['all','All']];
  var filtered=matches.filter(function(m){
    if(scoreFilter==='group')return!!m.g;
    if(scoreFilter==='knockout')return!m.g;
    if(scoreFilter==='pending')return m.s1==null;
    if(scoreFilter==='done')return m.s1!=null;
    return true;
  });
  var autoCount=matches.filter(function(m){return m.isAuto;}).length;
  var manualCount=matches.filter(function(m){return m.isManual;}).length;
  var filterBtns=filters.map(function(fv){
    return '<button class="btn'+(scoreFilter===fv[0]?' btn-accent':'')+'" data-filter="'+fv[0]+'" onclick="setScoreFilter(this)">'+fv[1]+'</button>';
  }).join('');
  var out='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">'+
    '<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">Show</span>'+
    filterBtns+'</div>';
  out+='<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11px;color:#8b9ab8">'+
    '<span style="color:#5a6a88">Sources:</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#00d4aa;margin-right:4px;vertical-align:-1px"></span>openfootball live ('+autoCount+')</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#60a5fa;margin-right:4px;vertical-align:-1px"></span>Manual override ('+manualCount+')</span>'+
    '<span style="color:#5a6a88;font-style:italic">Click any row to enter manually</span></div>';

    var done=m.s1!=null,isEdit=editScoreKey===m.key;

    var c=GC[grpL]||'#60a5fa';
    var roundShort=(m.round||'').replace('Round of ','R');
    var srcDot=m.isAuto?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#00d4aa;margin-left:5px;vertical-align:1px"></span>':
               m.isManual?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#60a5fa;margin-left:5px;vertical-align:1px"></span>':'';

      });
      goalsHtml='<div style="font-size:10px;color:#5a6a88;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff08;line-height:1.8">'+gLines.join('&nbsp;&nbsp;')+'</div>';
    }
    var htHtml=(m.ht1!=null&&m.ht2!=null&&!isEdit)?'<span style="font-size:10px;color:#5a6a88;margin-left:6px">(HT '+m.ht1+'-'+m.ht2+')</span>':'';
    var onclk=isEdit?'':'onclick="editScore(\''+m.key+'\')"';
    out+='<div '+onclk+' style="padding:10px 14px;background:#111827;border:1px solid '+(isEdit?'#00d4aa40':'#ffffff0e')+';border-radius:8px;cursor:'+(isEdit?'default':'pointer')+'">';
    out+='<div class="score-row-grid" style="display:grid;grid-template-columns:90px 1fr '+(isEdit?'240px':'auto')+' 1fr 80px;align-items:center;gap:8px">';
    var metaLabel=grpL?'<span class="font-display" style="font-size:10px;font-weight:700;color:'+c+';background:'+c+'18;padding:2px 5px;border-radius:3px">'+h(m.g)+'</span>':
      '<span class="font-display" style="font-size:10px;color:#5a6a88;font-weight:600;letter-spacing:.04em;text-transform:uppercase">'+roundShort+'</span>';
    var aestTime=m.t?fmtDateAEST(m.d,m.t):'';
    out+='<div style="font-size:11px">'+metaLabel+'<div style="margin-top:3px;color:#5a6a88">'+fmtDate(m.d)+'</div>'+(aestTime?'<div style="margin-top:1px;font-size:9px;color:#5a6a88">'+aestTime+'</div>':'')+'</div>';
    out+='<span style="font-weight:'+(done?600:400)+';text-align:right;color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+(isKnown(m.t1)?f(m.t1)+' ':'')+h(m.t1)+'</span>';

        '<input id="s1in" type="number" min="0" max="20" value="'+v1+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<span style="font-weight:700;color:#5a6a88">-</span>'+
        '<input id="s2in" type="number" min="0" max="20" value="'+v2+'" style="width:40px;text-align:center;font-size:16px;font-weight:700;padding:4px" onkeydown="if(event.key===\'Enter\')saveScore(\''+m.key+'\')">'+
        '<button class="btn btn-accent" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();saveScore(\''+m.key+'\')">SAVE</button>'+
        clrBtn+
        '<button class="btn" style="padding:3px 7px;font-size:11px" onclick="event.stopPropagation();editScoreKey=null;renderScores()">&#x00D7;</button>'+
        '</div>';
    }else if(done){
      out+='<div><span class="font-display" style="font-weight:700;font-size:20px;letter-spacing:.05em">'+m.s1+' - '+m.s2+'</span>'+srcDot+htHtml+'</div>';
    }else{
      out+='<span style="font-size:11px;color:#5a6a88;border:1px dashed #ffffff14;padding:3px 8px;border-radius:4px;white-space:nowrap">click to enter</span>';
    }
    out+='</div>';
    out+='<span style="font-weight:'+(done?600:400)+';color:'+(done?'#e8eeff':'#8b9ab8')+';font-size:13px">'+h(m.t2)+' '+(isKnown(m.t2)?f(m.t2):'')+'</span>';
    out+='<span style="font-size:10px;color:#5a6a88;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h(m.gr)+'</span>';
    out+='</div>';
    if(goalsHtml)out+=goalsHtml;
    out+='</div>';
  });
  out+='</div>';
  document.getElementById('tab-scores').innerHTML=out;
  if(editScoreKey)setTimeout(function(){var el=document.getElementById('s1in');if(el)el.focus();},50);
}
function setScoreFilter(btn){scoreFilter=btn.getAttribute('data-filter');renderScores();}
function editScore(key){editScoreKey=key;renderScores();}
function saveScore(key){
  var s1=document.getElementById('s1in')?document.getElementById('s1in').value:'';
  var s2=document.getElementById('s2in')?document.getElementById('s2in').value:'';
  if(s1===''&&s2===''){delete SCORES[key];}else{SCORES[key]={s1:s1===''?null:+s1,s2:s2===''?null:+s2};}
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;render();
}
function clearScore(key){
  delete SCORES[key];
  try{localStorage.setItem('wc26_sc',JSON.stringify(SCORES));}catch(e){}
  editScoreKey=null;render();
}

// ═══════════════════════════════════════════════════════════
function renderPredictions(){
  var allocs=CFG.allocations||{};
  var ELO_MIN=1550,ELO_MAX=2100;

  // Build personElo from CFG.participants
  var PERSON_COLORS=['#00d4aa','#60a5fa','#f472b6','#fbbf24','#a78bfa','#fb923c','#34d399','#f87171'];
  var personElo=(CFG.participants||[]).map(function(p,i){
    var teams=p.teams||[];
    var totalElo=teams.reduce(function(s,t){return s+(ELO[t]||1700);},0);
    var totalOdds=teams.reduce(function(s,t){return s+(ODDS[t]||0);},0);
    return{id:p.name,name:p.name,famName:'',famColor:PERSON_COLORS[i%PERSON_COLORS.length],
      teams:teams,totalElo:totalElo,avgElo:teams.length?Math.round(totalElo/teams.length):0,
      totalOdds:totalOdds};
  }).filter(function(p){return p.teams.length>0;}).sort(function(a,b){return b.totalElo-a.totalElo;});

  // Group difficulty: average Elo of teams in each group
  var groupElo={};
  Object.keys(GC).forEach(function(g){
    var gTeams=MATCHES.filter(function(m){return m.g==='Group '+g;})
      .flatMap(function(m){return[m.t1,m.t2];})
      .filter(function(t){return isKnown(t);});
    var uniq=[...new Set(gTeams)];
    var avg=uniq.length?Math.round(uniq.reduce(function(s,t){return s+(ELO[t]||1700);},0)/uniq.length):0;
    groupElo[g]={avg:avg,teams:uniq};
  });

  // View toggle
  var out='<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">';
  out+='<span class="font-display" style="font-size:11px;color:#5a6a88;letter-spacing:.06em;text-transform:uppercase;margin-right:4px">View</span>';
  [['strength','Team Strength'],['sweep','Sweep Value'],['groups','Group Difficulty'],['h2h','Head-to-Head']].forEach(function(v){
    out+='<button class="btn'+(predView===v[0]?' btn-accent':'')+'" onclick="predView=\''+v[0]+'\';renderPredictions()">'+v[1]+'</button>';
  });
  out+='</div>';

  out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:14px">'+
    'Elo ratings: <a href="https://github.com/Hicruben/world-cup-2026-prediction-model" target="_blank" style="color:#60a5fa">Hicruben/world-cup-2026-prediction-model</a> (MIT) · '+
    'Win odds: Polymarket (pre-tournament) · Data as of June 2026'+
    '</div>';

  // ── STRENGTH VIEW ───────────────────────────────────────────────
  if(predView==='strength'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:12px">All 48 teams ranked by calibrated Elo rating. Higher = stronger. Colour shows pot tier.</div>';
    out+='<div class="card" style="overflow:hidden">';
    out+='<table><thead><tr>';
    out+='<th style="text-align:left;width:30px">#</th>';
    out+='<th style="text-align:left">Team</th>';
    out+='<th>Pot</th>';
    out+='<th>Elo</th>';
    out+='<th>Strength</th>';
    out+='<th>Win %</th>';
    out+='<th style="text-align:left">Owner</th>';
    out+='</tr></thead><tbody>';

    var allTeamsSorted=Object.keys(ELO).sort(function(a,b){return ELO[b]-ELO[a];});
    allTeamsSorted.forEach(function(team,rank){
      var elo=ELO[team]||1700;
      var odds=ODDS[team]||0;
      var pot=DARALADS_POT_MAP[team]!==undefined?DARALADS_POT_MAP[team]:3;
      var potColor=POT[pot].color;
      var isElite=DARALADS_POT_MAP[team]===0;
      var barPct=Math.round((elo-ELO_MIN)/(ELO_MAX-ELO_MIN)*100);

      // Find owner
      var owner=null,ownerColor='#888';
      (CFG.participants||[]).forEach(function(p,pi){
        if((p.teams||[]).includes(team)){owner=p;ownerColor=PERSON_COLORS[pi%PERSON_COLORS.length];}
      });
      var ownerFam={color:ownerColor};

      out+='<tr style="border-bottom:1px solid #ffffff06">';
      out+='<td style="color:#5a6a88;font-size:11px;text-align:center">'+(rank+1)+'</td>';
      out+='<td style="text-align:left;font-weight:500;font-size:13px">'+f(team)+' '+h(team)+(isElite?' <span style="color:#fbbf24;font-size:10px">★</span>':'')+'</td>';
      out+='<td style="text-align:center"><span class="font-display" style="font-size:10px;font-weight:700;color:'+potColor+';background:'+potColor+'18;padding:1px 6px;border-radius:3px">P'+pot+'</span></td>';
      out+='<td style="text-align:center"><span class="font-display" style="font-weight:700;font-size:13px">'+elo+'</span></td>';
      out+='<td style="width:120px;padding:0 8px">';
      out+='<div style="height:6px;background:#ffffff10;border-radius:3px;overflow:hidden">';
      out+='<div style="height:100%;width:'+barPct+'%;background:'+potColor+';border-radius:3px"></div>';
      out+='</div></td>';
      out+='<td style="text-align:center;font-size:12px;color:'+(odds>=5?'#00d4aa':odds>=1?'#fbbf24':'#8b9ab8')+'">';
      out+=odds>=1?odds.toFixed(1)+'%':'<'+1+'%';
      out+='</td>';
      out+='<td style="text-align:left;font-size:11px">';
      if(owner){
        out+='<span style="color:'+ownerFam.color+';font-weight:600">'+h(owner.name.split(' ')[0])+'</span>';
      }else{
        out+='<span style="color:#5a6a88">—</span>';
      }
      out+='</td></tr>';
    });
    out+='</tbody></table></div>';

  // ── SWEEP VALUE VIEW ────────────────────────────────────────────
  }else if(predView==='sweep'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">How well did each participant do in the draw? Ranked by combined Elo of their teams. Higher = stronger draw.</div>';

    if(!personElo.length){
      out+='<div class="card-pad" style="text-align:center;color:#5a6a88;padding:40px">No teams allocated yet — run the draw in ⚙ Admin first</div>';
    }else{
      // Top/bottom picks callout
      var best=personElo[0],worst=personElo[personElo.length-1];
      out+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
      out+='<div class="card-pad" style="border-color:#00d4aa30;text-align:center">';
      out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:4px">🏆 Strongest Draw</div>';
      out+='<div style="font-weight:700;font-size:15px;color:#00d4aa">'+h(best.name)+'</div>';
      out+='<div style="font-size:11px;color:#5a6a88;margin-top:2px">Avg Elo '+best.avgElo+' · Win odds '+best.totalOdds.toFixed(1)+'%</div>';
      out+='</div>';
      out+='<div class="card-pad" style="border-color:#fbbf2430;text-align:center">';
      out+='<div style="font-size:11px;color:#5a6a88;margin-bottom:4px">🤞 Underdog Draw</div>';
      out+='<div style="font-weight:700;font-size:15px;color:#fbbf24">'+h(worst.name)+'</div>';
      out+='<div style="font-size:11px;color:#5a6a88;margin-top:2px">Avg Elo '+worst.avgElo+' · Win odds '+worst.totalOdds.toFixed(1)+'%</div>';
      out+='</div></div>';

      // Full leaderboard
      out+='<div class="card">';
      out+='<table><thead><tr>';
      out+='<th style="width:30px">#</th><th style="text-align:left">Participant</th><th>Teams</th><th>Avg Elo</th><th>Win Chances</th><th style="text-align:left">Holdings</th>';
      out+='</tr></thead><tbody>';

      var maxElo=personElo[0].avgElo,minElo=personElo[personElo.length-1].avgElo;
      personElo.forEach(function(p,i){
        var barPct=maxElo>minElo?Math.round((p.avgElo-minElo)/(maxElo-minElo)*100):50;
        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        out+='<tr style="border-bottom:1px solid #ffffff06">';
        out+='<td style="text-align:center;font-size:13px">'+(medal||i+1)+'</td>';
        out+='<td style="text-align:left"><div style="font-weight:600;font-size:13px">'+h(p.name)+'</div>'+
          '<div style="font-size:10px;margin-top:1px"><span style="color:'+p.famColor+'">'+h(p.famName)+'</span></div></td>';
        out+='<td style="text-align:center;color:#5a6a88">'+p.teams.length+'</td>';
        out+='<td><div class="font-display" style="font-weight:700;font-size:14px;text-align:center">'+p.avgElo+'</div>'+
          '<div style="height:4px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-top:3px;width:80px;margin-left:auto;margin-right:auto">'+
          '<div style="height:100%;width:'+barPct+'%;background:#00d4aa;border-radius:2px"></div></div></td>';
        out+='<td style="text-align:center;font-size:12px;color:'+(p.totalOdds>=5?'#00d4aa':p.totalOdds>=1?'#fbbf24':'#8b9ab8')+'">';
        out+=p.totalOdds>=0.1?p.totalOdds.toFixed(1)+'%':'<0.1%';
        out+='</td>';
        out+='<td style="text-align:left"><div style="display:flex;flex-wrap:wrap;gap:3px">';
        p.teams.forEach(function(t){
          var elo=ELO[t]||1700;
          var strength=elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8';
          out+='<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:'+strength+'18;color:'+strength+';border:1px solid '+strength+'30">'+
            f(t)+' '+h(t)+'</span>';
        });
        out+='</div></td></tr>';
      });
      out+='</tbody></table></div>';
    }

  // ── GROUP DIFFICULTY VIEW ───────────────────────────────────────
  }else if(predView==='groups'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Average Elo strength of each group. Harder groups have stronger opponents to navigate through.</div>';

    var sortedGroups=Object.keys(groupElo).sort(function(a,b){return groupElo[b].avg-groupElo[a].avg;});
    var maxAvg=groupElo[sortedGroups[0]].avg,minAvg=groupElo[sortedGroups[sortedGroups.length-1]].avg;

    out+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">';
    sortedGroups.forEach(function(g,rank){
      var ge=groupElo[g];
      var c=GC[g]||'#888';
      var barPct=maxAvg>minAvg?Math.round((ge.avg-minAvg)/(maxAvg-minAvg)*100):50;
      var label=rank===0?'💀 Group of Death':rank===1?'🔥 Very Tough':rank<4?'💪 Tough':rank<8?'⚖️ Balanced':'😌 Manageable';

      out+='<div class="card-pad" style="border-color:'+c+'30">';
      out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      out+='<span class="font-display" style="font-weight:700;font-size:16px;color:'+c+'">Group '+g+'</span>';
      out+='<span style="font-size:11px;color:#5a6a88">'+label+'</span>';
      out+='</div>';
      out+='<div class="font-display" style="font-weight:800;font-size:24px;color:#f0f4ff;margin-bottom:6px">'+ge.avg+' <span style="font-size:12px;color:#5a6a88;font-weight:400">avg Elo</span></div>';
      out+='<div style="height:5px;background:#ffffff10;border-radius:3px;overflow:hidden;margin-bottom:10px">';
      out+='<div style="height:100%;width:'+barPct+'%;background:'+c+';border-radius:3px"></div></div>';

      ge.teams.sort(function(a,b){return (ELO[b]||1700)-(ELO[a]||1700);}).forEach(function(team){
        var elo=ELO[team]||1700;
        var eloBarPct=Math.round((elo-ELO_MIN)/(ELO_MAX-ELO_MIN)*100);
        var owner=null,ownerColor='#888';
        (CFG.participants||[]).forEach(function(p,pi){
          if((p.teams||[]).includes(team)){owner=p;ownerColor=PERSON_COLORS[pi%PERSON_COLORS.length];}
        });
        out+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #ffffff06">';
        out+='<span style="font-size:14px;flex-shrink:0">'+f(team)+'</span>';
        out+='<div style="flex:1;min-width:0">';
        out+='<div style="display:flex;justify-content:space-between;align-items:center">';
        out+='<span style="font-size:12px;font-weight:500">'+h(team)+'</span>';
        out+='<span class="font-display" style="font-size:12px;font-weight:700;color:#8b9ab8">'+elo+'</span>';
        out+='</div>';
        out+='<div style="height:3px;background:#ffffff08;border-radius:2px;overflow:hidden;margin-top:3px">';
        out+='<div style="height:100%;width:'+eloBarPct+'%;background:'+(elo>=2000?'#00d4aa':elo>=1900?'#fbbf24':elo>=1800?'#60a5fa':'#8b9ab8')+';border-radius:2px"></div></div>';
        out+='</div>';
        if(owner)out+='<span style="font-size:10px;color:'+ownerColor+';font-weight:600;flex-shrink:0">'+h(owner.name)+'</span>';
        out+='</div>';
      });
      out+='</div>';
    });
    out+='</div>';

  // ── HEAD TO HEAD VIEW ───────────────────────────────────────────
  }else if(predView==='h2h'){
    out+='<div style="font-size:12px;color:#8b9ab8;margin-bottom:14px">Dixon-Coles model: pick any two teams to see predicted win/draw/loss probabilities.</div>';

    var allTeamNames=Object.keys(ELO).sort();
    var teamAOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamA===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');
    var teamBOpts=allTeamNames.map(function(t){return '<option value="'+h(t)+'"'+(h2hTeamB===t?' selected':'')+'>'+f(t)+' '+h(t)+'</option>';}).join('');

    out+='<div class="card-pad" style="max-width:500px">';
    out+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">';
    out+='<select id="h2h-a" onchange="h2hTeamA=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamAOpts+'</select>';
    out+='<span class="font-display" style="font-weight:700;color:#5a6a88;font-size:18px">vs</span>';
    out+='<select id="h2h-b" onchange="h2hTeamB=this.value;renderPredictions()" style="flex:1;min-width:140px">'+teamBOpts+'</select>';
    out+='</div>';

    if(h2hTeamA&&h2hTeamB&&h2hTeamA!==h2hTeamB){
      var eloA=ELO[h2hTeamA]||1700,eloB=ELO[h2hTeamB]||1700;
      // Dixon-Coles simplified: logistic + draw adjustment
      var eloDiff=eloA-eloB;
      var pWinA=1/(1+Math.pow(10,-eloDiff/400));
      var drawProb=0.28-Math.abs(eloDiff)*0.00045; // flatter = more draws
      drawProb=Math.max(0.08,Math.min(0.35,drawProb));
      pWinA=(pWinA*(1-drawProb));
      var pWinB=(1-drawProb)-pWinA;
      var pWinAPct=Math.round(pWinA*100),drawPct=Math.round(drawProb*100),pWinBPct=100-pWinAPct-drawPct;

      // Expected goals (rough)
      var expGoalsA=(1.15+eloDiff*0.0004).toFixed(1);
      var expGoalsB=(1.15-eloDiff*0.0004).toFixed(1);

      var potA=DARALADS_POT_MAP[h2hTeamA]!==undefined?DARALADS_POT_MAP[h2hTeamA]:3;
      var potB=DARALADS_POT_MAP[h2hTeamB]!==undefined?DARALADS_POT_MAP[h2hTeamB]:3;

      out+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:16px">';
      // Team A
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamA)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamA)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloA+' · <span style="color:'+POT[potA].color+'">P'+potA+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#00d4aa;margin-top:8px">'+pWinAPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsA+'</div>';
      out+='</div>';
      // Draw
      out+='<div style="text-align:center;padding-top:40px">';
      out+='<div class="font-display" style="font-weight:700;font-size:20px;color:#5a6a88">'+drawPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">draw</div>';
      out+='</div>';
      // Team B
      out+='<div style="text-align:center">';
      out+='<div style="font-size:36px">'+f(h2hTeamB)+'</div>';
      out+='<div style="font-weight:700;font-size:14px;margin-top:4px">'+h(h2hTeamB)+'</div>';
      out+='<div class="font-display" style="font-size:12px;color:#5a6a88;margin-top:2px">Elo '+eloB+' · <span style="color:'+POT[potB].color+'">P'+potB+'</span></div>';
      out+='<div class="font-display" style="font-weight:800;font-size:32px;color:#fbbf24;margin-top:8px">'+pWinBPct+'%</div>';
      out+='<div style="font-size:11px;color:#5a6a88">win probability</div>';
      out+='<div style="font-size:13px;color:#8b9ab8;margin-top:6px">xG: '+expGoalsB+'</div>';
      out+='</div>';
      out+='</div>';

      // Bar
      out+='<div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:8px">';
      out+='<div style="width:'+pWinAPct+'%;background:#00d4aa"></div>';
      out+='<div style="width:'+drawPct+'%;background:#5a6a88"></div>';
      out+='<div style="flex:1;background:#fbbf24"></div>';
      out+='</div>';
      out+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#5a6a88">';
      out+='<span>'+h(h2hTeamA)+' win</span><span>Draw</span><span>'+h(h2hTeamB)+' win</span></div>';
      out+='<div style="margin-top:12px;padding:8px 12px;background:#ffffff06;border-radius:6px;font-size:11px;color:#5a6a88">';
      out+='Model: Dixon-Coles bivariate Poisson · Elo difference: '+(eloA-eloB>0?'+':'')+(eloA-eloB)+' · Neutral venue assumed';
      out+='</div>';
    }else{
      out+='<div style="text-align:center;padding:20px;color:#5a6a88;font-size:13px">Select two different teams to compare</div>';
    }
    out+='</div>';
  }

  document.getElementById('tab-predictions').innerHTML=out;
}

var h2hTeamA='France',h2hTeamB='Spain';

function init(){
  try{
    render();
    loadFromGitHub();
    setInterval(function(){
      loadFromOpenFootball().then(function(){render();});
    },5*60*1000);
  }catch(e){
    console.error('Daralads init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#ff4757;font-family:sans-serif"><h2>Error loading dashboard</h2><p style="color:#8b9ab8;margin-top:8px">'+e.message+'</p></div>';
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
