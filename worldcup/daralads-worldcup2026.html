};

async function loadLiveElo(){
  var now=Date.now();
  if(now-ELO_LAST_FETCH<30*60*1000&&ELO_LAST_FETCH>0)return; // cache 30 min
  var ELO_URL='https://raw.githubusercontent.com/Hicruben/world-cup-2026-prediction-model/main/data/elo-calibrated.json';
  try{
    var r=await fetch(ELO_URL+'?t='+now);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var data=await r.json();
    // data is an object: { "France": 2089, ... } or array — handle both
    var newElo={};
    if(Array.isArray(data)){
      data.forEach(function(entry){
        var name=ELO_NAME_MAP[entry.team||entry.name]||(entry.team||entry.name);
        if(name&&entry.elo)newElo[name]=Math.round(entry.elo);
      });
    }else{
      Object.entries(data).forEach(function(e){
        var name=ELO_NAME_MAP[e[0]]||e[0];
        newElo[name]=Math.round(e[1]);
      });
    }
    // Only apply if we got reasonable data (at least 40 teams)
    if(Object.keys(newElo).length>=40){
      ELO=newElo;
      ELO_LIVE_LOADED=true;
      ELO_LAST_FETCH=now;
      console.log('Live Elo loaded: '+Object.keys(newElo).length+' teams');
      // Re-render predictions if it's the active tab
      if(activeTab==='predictions')renderPredictions();

}

var VENUE_UTC_OFFSET={
  'Mexico City':-6,'Guadalajara':-6,'Guadalajara (Zapopan)':-6,'Monterrey':-6,'Monterrey (Guadalupe)':-6,
  'Los Angeles':-7,'Los Angeles (Inglewood)':-7,'San Francisco':-7,'San Francisco Bay Area (Santa Clara)':-7,'Seattle':-7,'Vancouver':-7,
  'Toronto':-4,'Atlanta':-4,'New York':-4,'New York/New Jersey (East Rutherford)':-4,'Boston':-4,'Boston (Foxborough)':-4,'Miami':-4,'Miami (Miami Gardens)':-4,'Philadelphia':-4,'Kansas City':-5,'Kansas City (Kansas City)':-5,
  'Dallas':-5,'Houston':-5
};

function venueToAEST(ofbTimeObj, venue, dateStr){
  // ofbTimeObj: {timeStr: "13:00 UTC-6", venue: "Mexico City"} OR plain string
  // Handles OFB's "HH:MM UTC±X" format which includes offset directly
  if(!ofbTimeObj||!dateStr)return'';
  var timeStr=typeof ofbTimeObj==='object'?(ofbTimeObj.timeStr||''):ofbTimeObj;
  var ofbVenue=typeof ofbTimeObj==='object'?(ofbTimeObj.venue||venue||''):(venue||'');
  if(!timeStr)return'';

  var utcH, mn;
  // Try parsing "HH:MM UTC±X" (OFB format — offset embedded in string)
  var m=timeStr.match(/(\d+):(\d+)\s*UTC([+-]\d+(?:\.\d+)?)/);
  if(m){
    var localH=parseInt(m[1]);
    mn=parseInt(m[2]);
    var offset=parseFloat(m[3]);
    utcH=localH-offset; // local → UTC
  }else{
    // Plain "HH:MM" — look up venue offset
    var parts=timeStr.split(':');
    localH=parseInt(parts[0]);mn=parseInt(parts[1]||0);
    // Try matching venue name (partial match)
    var off=null;
    Object.keys(VENUE_UTC_OFFSET).forEach(function(k){
      if(ofbVenue.indexOf(k)>=0||k.indexOf(ofbVenue)>=0)off=VENUE_UTC_OFFSET[k];
    });
    if(off===null)return'';
    utcH=localH-off;
  }

  var aestH=utcH+10;
  var d=new Date(dateStr+'T12:00:00');
  var dayAdj=0;
  if(aestH>=24){aestH-=24;dayAdj=1;}
  if(aestH<0){aestH+=24;dayAdj=-1;}
  d.setDate(d.getDate()+dayAdj);
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var mn2=mn<10?'0'+mn:''+mn;
  var h2=aestH<10?'0'+aestH:''+aestH;
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+h2+':'+mn2+' AEST';
}
const fmtDate=d=>{if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{month:'short',day:'numeric'});};
function fmtDateAEST(isoDate,utcTime){
  if(!isoDate)return'';
  // Parse UTC time if given (e.g. "19:00 UTC-4")
  var aestStr='';
  try{
    if(utcTime){
      var m=utcTime.match(/(\d+):(\d+)\s*UTC([+-]\d+(?:\.\d+)?)/);
      if(m){
        var h=parseInt(m[1]),mn=parseInt(m[2]),off=parseFloat(m[3]);
        // Convert to UTC then to AEST (UTC+10)
        var utcH=h-off; // UTC hours
        var aestH=utcH+10; // AEST
        var d=new Date(isoDate+'T00:00:00');
        var dayOff=0;
        if(aestH>=24){aestH-=24;dayOff=1;}
        if(aestH<0){aestH+=24;dayOff=-1;}
        d.setDate(d.getDate()+dayOff);
        var mn2=mn<10?'0'+mn:''+mn;
        var h2=aestH<10?'0'+aestH:''+aestH;
        var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        aestStr=days[d.getDay()]+' '+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+' '+h2+':'+mn2+' AEST';
      }
    }
    if(!aestStr){
      // No time — just show date
      aestStr=new Date(isoDate+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'});
    }
  }catch(e){aestStr=isoDate;}

function buildStandings(matches){
  var sm={};
  matches.filter(function(m){return m.g;}).forEach(function(m){
    var g=m.g.replace('Group ','');
    if(!sm[g])sm[g]={};
    [m.t1,m.t2].forEach(function(t){if(!sm[g][t])sm[g][t]={name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    if(m.s1!=null&&m.s2!=null){
      var s=sm[g];
      s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=m.s1;s[m.t1].ga+=m.s2;s[m.t2].gf+=m.s2;s[m.t2].ga+=m.s1;
      if(m.s1>m.s2){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
      else if(m.s1<m.s2){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
      else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
    }
  });
  return sm;
}


function calcPrizeTotal(prz){
  return getPrizeDefs().reduce(function(s,pd){
    var val=+prz[pd.k]||0;
    var mult=pd.k==='groupAdvance'?24:1;
    return s+(val*mult);
  },0);
}


function fmtKOTeam(code){
  // e.g. '1A' -> '1st Group A', '2B' -> '2nd Group B'
  // e.g. 'W73' -> 'W/Mx #73', 'L101' -> 'L/Mx #101'
  // 'Best 3rd' stays
  if(!code||isKnown(code))return code;
  var m1=code.match(/^([12])([A-L])$/);
  if(m1)return (m1[1]==='1'?'1st':'2nd')+' Grp '+m1[2];
  var m2=code.match(/^([WL])(\d+)$/);
  if(m2)return (m2[1]==='W'?'W':'L')+' Mx#'+m2[2];
  var m3=code.match(/^(\d)([A-L])\/?/);
  if(m3)return m3[1]+' Grp '+m3[2];
  return code;
}


function getMatches(){
  return MATCHES.map(function(m,i){
    var key='m'+i;
    var manual=SCORES[key];
    var auto=OFB[key];
    var sc=manual||auto||null;
    var goals=OFB_GOALS[key]||null;
    var ofbTime=OFB_TIMES[key]||null;
    return Object.assign({},m,{
      key:key,
      s1:sc?sc.s1:null,
      s2:sc?sc.s2:null,
      ht1:sc?sc.ht1:null,
      ht2:sc?sc.ht2:null,
      goals:goals,
      isManual:!!manual,

  });
}

function getTeamResult(teamName,matches,sm){
  var km=matches.filter(function(m){return !m.g;});
  var fin=km.find(function(m){return m.round==='Final'&&m.s1!=null;});
  if(fin){
    var w=fin.s1>fin.s2?fin.t1:fin.t2,l=fin.s1<fin.s2?fin.t1:fin.t2;
    if(teamName===w)return'champion';
    if(teamName===l)return'runner';
    var t3=km.find(function(m){return m.round==='Match for third place'&&m.s1!=null;});
    if(t3&&teamName===(t3.s1>t3.s2?t3.t1:t3.t2))return'third';
  }
  // Group advancement: only award once ALL 6 group matches are complete
  var grpMatch=MATCHES.find(function(m){return m.t1===teamName||m.t2===teamName;});
  var grp=grpMatch&&grpMatch.g?grpMatch.g.replace('Group ',''):null;
  if(grp&&sm[grp]){
    var grpMatches=matches.filter(function(m){return m.g==='Group '+grp;});
    var allPlayed=grpMatches.length===6&&grpMatches.every(function(m){return m.s1!=null;});
    if(allPlayed){
      var sorted=Object.values(sm[grp]).sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
      if(sorted.slice(0,2).some(function(s){return s.name===teamName;}))return'advanced';
    }
  }
  return'active';
}

// ── Auto-compute prize awards from live match data ────────────────────
function calcAutoAwards(){
  var matches=getMatches();
  var sm=buildStandings(matches);
  var allocs=CFG.allocations||{};

  // Build reverse lookup: team -> participant name (daralads uses names not ids)
  var teamOwner={};
  (CFG.participants||[]).forEach(function(p){
    (p.teams||[]).forEach(function(t){teamOwner[t]=p.name;});
  });

  // Collect all goals across all matches
  var allGoals=[]; // {team, name, minute, penalty, matchDate, matchKey}
  matches.forEach(function(m){
    if(!m.goals||!m.goals.length)return;
    m.goals.forEach(function(g){
      allGoals.push(Object.assign({},g,{matchDate:m.d,matchKey:m.key}));
    });
  });
  // Sort by date then minute for chronological order
  allGoals.sort(function(a,b){
    return a.matchDate<b.matchDate?-1:a.matchDate>b.matchDate?1:a.minute-b.minute;
  });

  // Collect per-team stats from standings
  var teamStats={}; // team -> {gf, ga, gd, yellows, reds, cleanSheets}
  // We get GF/GA from buildStandings, but yellows/reds/cleanSheets not tracked by OFB
  // For what OFB does provide: goals per player, scores per team
  Object.entries(sm).forEach(function(e){
    Object.entries(e[1]).forEach(function(te){
      var t=te[0],s=te[1];
      teamStats[t]={gf:s.gf,ga:s.ga,gd:s.gf-s.ga,p:s.p};
    });
  });

  // Goal tally per player (for golden boot)
  var playerGoals={}; // "name|team" -> {name, team, goals, pens}
  allGoals.forEach(function(g){
    if(g.penalty)return; // exclude own goals if needed
    var key=g.name+'|'+g.team;
    if(!playerGoals[key])playerGoals[key]={name:g.name,team:g.team,goals:0,pens:0};
    playerGoals[key].goals++;
    if(g.penalty)playerGoals[key].pens++;
  });

  var newAwards=Object.assign({},CFG.manualAwards||{});

  // ── firstGoal: owner of the team that scored the first goal ──────────
  if(allGoals.length>0){
    var firstGoalTeam=allGoals[0].team;
    var firstGoalOwner=teamOwner[firstGoalTeam];
    if(firstGoalOwner)newAwards.firstGoal=firstGoalOwner;
  }

  // ── goldenBoot: owner of team with most goals scored ────────────────
  // (by top individual scorer when OFB has player data, else by team goals)
  var topScorer=null,topGoals=0;
  Object.values(playerGoals).forEach(function(p){
    if(p.goals>topGoals){topGoals=p.goals;topScorer=p;}
    else if(p.goals===topGoals&&topScorer){
      // tiebreak: fewer penalties
      if(p.pens<topScorer.pens)topScorer=p;
    }
  });
  if(topScorer){
    var gbOwner=teamOwner[topScorer.team];
    if(gbOwner)newAwards.goldenBoot=gbOwner;
  }

  // ── bestGD: owner of team with best goal difference ──────────────────
  // Only count after at least 2 matches played to avoid 1-game noise
  var bestGD=null,bestGDVal=-999;
  Object.entries(teamStats).forEach(function(e){
    var t=e[0],s=e[1];
    if(s.p<1)return;
    if(s.gd>bestGDVal||(s.gd===bestGDVal&&bestGD&&s.gf>(teamStats[bestGD]||{}).gf)){
      bestGDVal=s.gd;bestGD=t;
    }
  });
  if(bestGD&&teamOwner[bestGD])newAwards.bestGD=teamOwner[bestGD];

  // ── worstGD: owner of team with worst goal difference ────────────────
  var worstGD=null,worstGDVal=999;
  Object.entries(teamStats).forEach(function(e){
    var t=e[0],s=e[1];
    if(s.p<1)return;
    if(s.gd<worstGDVal||(s.gd===worstGDVal&&worstGD&&s.ga>(teamStats[worstGD]||{}).ga)){
      worstGDVal=s.gd;worstGD=t;
    }
  });
  if(worstGD&&teamOwner[worstGD])newAwards.worstGD=teamOwner[worstGD];

  // ── mostCleanSheets: team that conceded 0 in most games ──────────────
  var cleanSheets={};
  matches.forEach(function(m){
    if(m.s1==null)return;
    if(m.s2===0&&teamOwner[m.t1])cleanSheets[m.t1]=(cleanSheets[m.t1]||0)+1;
    if(m.s1===0&&teamOwner[m.t2])cleanSheets[m.t2]=(cleanSheets[m.t2]||0)+1;
  });
  var topCS=null,topCSVal=0;
  Object.entries(cleanSheets).forEach(function(e){
    if(e[1]>topCSVal){topCSVal=e[1];topCS=e[0];}
  });
  if(topCS&&teamOwner[topCS])newAwards.mostCleanSheets=teamOwner[topCS];

  // ── topFamily: family with most total points (auto-calc) ─────────────
  // We skip this one as it needs the full leaderboard calc - handle in renderSweep

  // Only update auto keys — never overwrite manual overrides
  var overrides=CFG.manualOverrides||{};
  var autoKeys=['firstGoal','goldenBoot','bestGD','worstGD','mostCleanSheets'];
  var changed=false;
  autoKeys.forEach(function(k){
    if(overrides[k])return; // skip — admin manually set this
    if(newAwards[k]!==(CFG.manualAwards||{})[k]){
      changed=true;
    }
  });
  if(changed){
    // Merge: keep manual overrides, apply auto values for non-overridden keys
    if(!CFG.manualAwards)CFG.manualAwards={};
    autoKeys.forEach(function(k){
      if(overrides[k])return;
      if(newAwards[k]){
        CFG.manualAwards[k]=newAwards[k];
      }else{
        delete CFG.manualAwards[k];
      }
    });
    pushToGitHub(CFG);
    console.log('Auto awards updated');
  }
}


async function loadFromOpenFootball(){
  // Only refetch if >5 mins since last fetch
  var now=Date.now();
  if(now-OFB_LAST_FETCH<5*60*1000&&OFB_LAST_FETCH>0)return;
  try{
    var r=await fetch(OFB_URL+'?t='+now);
    if(!r.ok)return;
    var data=await r.json();
    var matches=data.matches||[];
    OFB={};OFB_GOALS={};OFB_TIMES={};
    matches.forEach(function(m,i){
      // Match by date + team names
      var t1=normTeam(m.team1||'');
      var t2=normTeam(m.team2||'');
      var key=findMatchKey(t1,t2,m.date||'');
      if(key===null)return;
      // Store kickoff time + venue from OFB
      // OFB time format: "13:00 UTC-6" (local time with UTC offset)
      if(m.time&&key!==null){
        OFB_TIMES[key]={timeStr:m.time, venue:m.ground||''};
      }
      if(m.score&&m.score.ft){
        OFB[key]={s1:m.score.ft[0],s2:m.score.ft[1],ht1:m.score.ht?m.score.ht[0]:null,ht2:m.score.ht?m.score.ht[1]:null};
      }
      var goals=[];
      (m.goals1||[]).forEach(function(g){goals.push({name:g.name,team:t1,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      (m.goals2||[]).forEach(function(g){goals.push({name:g.name,team:t2,minute:g.minute,penalty:!!g.penalty,offset:g.offset||0});});
      goals.sort(function(a,b){return a.minute-b.minute;});
      if(goals.length)OFB_GOALS[key]=goals;
    });
    OFB_LAST_FETCH=now;
    // Recompute auto prize awards now that scores are fresh
    calcAutoAwards();
    render();
  }catch(e){
    console.log('OFB fetch failed:', e.message);
  }
}

function findMatchKey(t1,t2,date){
  var matches=getMatches();
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(m.d===date&&((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1))){
      return m.key;
    }
  }
  // Fallback: match by teams only (different date format)
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if((m.t1===t1&&m.t2===t2)||(m.t1===t2&&m.t2===t1)){
      return m.key;
    }
  }
  return null;
}

async function loadFromGitHub(){
  setStatus('loading','Syncing…','#fbbf24');
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON in config');}
    // Daralads: sync all mutable fields from remote
    if(data.sweepName)      CFG.sweepName      = data.sweepName;
    if(data.buyIn!=null)    CFG.buyIn          = data.buyIn;
    if(data.prizes)         CFG.prizes         = Object.assign({},DEFAULT_CFG.prizes,data.prizes);
    if(data.participants&&data.participants.length) CFG.participants = data.participants;
    if(data.manualAwards)   CFG.manualAwards   = data.manualAwards;
    if(data.manualOverrides)CFG.manualOverrides = data.manualOverrides;
    if(!CFG.prizes)         CFG.prizes         = Object.assign({},DEFAULT_CFG.prizes);
    var nd=document.getElementById('sweep-name-display');
    if(nd&&CFG.sweepName)nd.textContent=CFG.sweepName;
    render();;
    // Then load remote config + live scores
    loadFromGitHub();
    // Load live Elo ratings
    loadLiveElo();
    // Auto-refresh live scores every 5 minutes
    setInterval(function(){
      loadFromOpenFootball().then(function(){render();});
    },5*60*1000);
    // Refresh Elo every 30 minutes
    setInterval(function(){loadLiveElo();},30*60*1000);
  }catch(e){
    console.error('WC2026 init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#ff4757;font-family:sans-serif"><h2>Error loading dashboard</h2><p style="color:#8b9ab8;margin-top:8px">'+e.message+'</p></div>';
  }
}

function saveScore(key){
  var s1=document.getElementById('s1in')?document.getElementById('s1in').value:'';

  editScoreKey=null;render();
}


async function pushToGitHub(cfg){
  var token='';try{token=localStorage.getItem('wc26_token')||'';}catch(e){}
  if(!token){
    alert('No GitHub token set. Go to ⚙ Admin tab and enter your token first.');
    return false;
  }
  setStatus('saving','Saving to GitHub…','#fbbf24');
  try{
    // Get current SHA
    const metaRes=await fetch(GH_API,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(!metaRes.ok)throw new Error('GitHub API '+metaRes.status+' — check your token has Contents:Write on the portfolio repo');
    const meta=await metaRes.json();
    const sha=meta.sha;
    // Daralads: persist all sweep config
    var mutable={
      sweepName:       cfg.sweepName||DEFAULT_CFG.sweepName,
      buyIn:           cfg.buyIn||0,
      prizes:          cfg.prizes||{},
      participants:    cfg.participants||[],
      manualAwards:    cfg.manualAwards||{},
      manualOverrides: cfg.manualOverrides||{},
    };
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(mutable,null,2))));
    const putRes=await fetch(GH_API,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'daralads sweep: update config',content,sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||'Push failed');}
    setStatus('ok','✓ Saved to GitHub','#00d4aa');
    return true;
  }catch(e){
    setStatus('err','⚠ '+e.message,'#ff4757');
    return false;
  }
}

function renderSweep(){
  var matches=getMatches();

    {k:'goldenBoot',icon:'⚽',label:'Golden Boot'},{k:'bestGD',icon:'📈',label:'Best GD'},
    {k:'worstGD',icon:'📉',label:'Wooden Spoon'},{k:'mostYellow',icon:'🟨',label:'Most Yellows'},

      if(awards[pd.k]===p.name&&(prz[pd.k]||0)>0){pts+=prz[pd.k];notes.push(pd.icon+' '+pd.label);}
    });
    return Object.assign({},p,{pts:pts,notes:notes});

      out+='</div></div>';
    });
    out+='</div></div></div>';
  }else{

  }
  document.getElementById('tab-sweep').innerHTML=out;
}

    out+='<select style="font-size:11px;padding:3px 8px;width:auto;min-width:130px" onchange="addTeamToParticipant('+i+',this)"><option value="">+ add team…</option>';
    allTeamsSorted.forEach(function(t){
      if(!(p.teams||[]).includes(t)){out+='<option value="'+h(t)+'"'+(usedByOthers.has(t)?' style="color:#5a6a88"':'')+'>'+f(t)+' '+h(t)+'</option>';}
    });
    out+='</select></div></div>';
  });
  out+='</div>';

  out+='<div style="display:flex;gap:10px"><button class="btn btn-accent btn-lg" style="flex:1" onclick="saveAdmin()">SAVE & PUSH TO GITHUB</button></div>';
  out+='<div id="admin-msg"></div></div>';
  document.getElementById('tab-admin').innerHTML=out;
  updateTokenStatus();
  updatePrizeTotals();
}

function updateDaraladsPool(){
  var buyin=+(document.getElementById('cfg-buyin')||{value:0}).value||0;
  var n=(CFG.participants||[]).length;
  var pool=n*buyin;
  var el=document.getElementById('daralads-pool-total');if(el)el.textContent='$'+pool;
  var bd=document.getElementById('daralads-pool-breakdown');if(bd)bd.textContent=n+' players × $'+buyin;
  updatePrizeTotals();
}

function updatePrizeTotals(){
  var prizeKeys=['champion','runner','third','groupAdvance','goldenBoot','bestGD','worstGD','mostYellow','mostRed','firstGoal','mostCleanSheets','topFamily'];
  var total=prizeKeys.reduce(function(s,k){
    var el=document.getElementById('prize-'+k);var val=el?+(el.value)||0:0;
    var mult=k==='groupAdvance'?24:1;return s+(val*mult);
  },0);
  var buyin=+(document.getElementById('cfg-buyin')||{value:CFG.buyIn||0}).value||CFG.buyIn||0;
  var pool=(CFG.participants||[]).length*buyin;
  var color=total===pool?'#00d4aa':total<pool?'#fbbf24':'#ff4757';
  var status=total===pool?'✓ Balanced':total<pool?'$'+(pool-total)+' unallocated':'$'+(total-pool)+' over budget';
  var badge=document.getElementById('prize-total-badge');if(badge){badge.textContent='$'+total;badge.style.color=color;}
  var statusBadge=document.getElementById('prize-status-badge');if(statusBadge){statusBadge.textContent=status;statusBadge.style.color=color;statusBadge.style.background=color+'18';statusBadge.style.borderColor=color+'30';}
  var bar=document.getElementById('prize-bar');if(bar){bar.style.width=pool>0?Math.min(100,Math.round(total/pool*100))+'%':'0%';bar.style.background=color;}
  var lbl=document.getElementById('prize-bar-label');if(lbl){lbl.textContent=Math.round(total/Math.max(pool,1)*100)+'% of pool · '+status;lbl.style.color=color;}
}

function addParticipant(){if(!CFG.participants)CFG.participants=[];CFG.participants.push({name:'',teams:[]});renderAdmin();}
function removeParticipant(i){if(!confirm('Remove '+CFG.participants[i].name+'?'))return;CFG.participants.splice(i,1);renderAdmin();renderSweep();}
function addTeamToParticipant(i,sel){var t=sel.value;if(!t)return;if(!CFG.participants[i].teams)CFG.participants[i].teams=[];if(!CFG.participants[i].teams.includes(t))CFG.participants[i].teams.push(t);sel.value='';renderAdmin();}
function removeTeamFromParticipant(i,ti){CFG.participants[i].teams.splice(ti,1);renderAdmin();}

async function saveAdmin(){
  var nameEl=document.getElementById('cfg-name');var buyinEl=document.getElementById('cfg-buyin');
  if(nameEl)CFG.sweepName=nameEl.value.trim();if(buyinEl)CFG.buyIn=+(buyinEl.value)||0;
  getPrizeDefs().forEach(function(pd){var el=document.getElementById('prize-'+pd.k);if(el)CFG.prizes[pd.k]=+(el.value)||0;});
  (CFG.participants||[]).forEach(function(p,i){var el=document.getElementById('p-name-'+i);if(el)p.name=el.value.trim();});
  var ok=await pushToGitHub(CFG);
  var msg=document.getElementById('admin-msg');
  if(msg)msg.innerHTML='<div style="padding:10px 14px;background:'+(ok?'#00d4aa14':'#ff475714')+';border:1px solid '+(ok?'#00d4aa30':'#ff475730')+';border-radius:6px;color:'+(ok?'#00d4aa':'#ff4757')+';font-size:13px;margin-top:8px">'+(ok?'✓ Saved to GitHub':'⚠ Save failed')+'</div>';
  if(ok){var nd=document.getElementById('sweep-name-display');if(nd)nd.textContent=CFG.sweepName;renderSweep();}
}

function clearToken(){try{localStorage.removeItem('wc26_token');}catch(e){}updateTokenStatus();}

function saveToken(){
  var el=document.getElementById('token-input');var t=el?el.value.trim():'';
  if(!t){alert('Please enter a token');return;}
  try{localStorage.setItem('wc26_token',t);}catch(e){}
  updateTokenStatus();
  pushToGitHub(CFG).then(function(ok){
    var msg=document.getElementById('admin-msg');
    if(msg)msg.innerHTML='<div style="padding:10px 14px;background:'+(ok?'#00d4aa14':'#ff475714')+';border:1px solid '+(ok?'#00d4aa30':'#ff475730')+';border-radius:6px;color:'+(ok?'#00d4aa':'#ff4757')+';font-size:13px;margin-top:8px">'+(ok?'✓ Token saved and verified':'⚠ Token saved but push failed')+'</div>';
    updateTokenStatus();
  });
}

function updateTokenStatus(){
  var el=document.getElementById('token-status-placeholder');if(!el)return;
  var t='';try{t=localStorage.getItem('wc26_token')||'';}catch(e){}
  el.innerHTML=t?'<div style="font-size:11px;color:#00d4aa;margin-top:8px">✓ Token set in this browser — <span style="cursor:pointer;color:#ff4757;text-decoration:underline" onclick="clearToken()">Clear</span></div>':'<div style="font-size:11px;color:#fbbf24;margin-top:8px">⚠ No token set — view-only for this device</div>';
}

function setManualAward(prizeKey, memberId){
  if(!CFG.manualAwards)CFG.manualAwards={};
  if(!CFG.manualOverrides)CFG.manualOverrides={};
  if(memberId){
    CFG.manualAwards[prizeKey]=memberId;
    CFG.manualOverrides[prizeKey]=true;
  }else{
    delete CFG.manualAwards[prizeKey];
    delete CFG.manualOverrides[prizeKey];
  }
  pushToGitHub(CFG);
  renderSweep();
  var msg=document.getElementById('admin-msg');
  if(msg){msg.innerHTML='<div style="padding:8px 14px;background:#00d4aa14;border:1px solid #00d4aa30;border-radius:6px;color:#00d4aa;font-size:13px;margin-top:8px">✓ Award saved</div>';setTimeout(function(){if(msg)msg.innerHTML='';},3000);}
}

function resetDraws(){
  if(!confirm('Reset all results and prize amounts?'))return;
  CFG.prizes={champion:0,runner:0,third:0,groupAdvance:0,goldenBoot:0,bestGD:0,worstGD:0,mostYellow:0,mostRed:0,firstGoal:0,mostCleanSheets:0,topFamily:0};
  CFG.manualAwards={};CFG.manualOverrides={};
  pushToGitHub(CFG);render();
}

function init(){
  // Always render immediately with defaults — never blank
  try{render();}catch(e){console.error('render error:',e);}
  // Async loads — failures don't break the page
  loadFromGitHub().catch(function(e){
    console.log('GitHub load failed, using defaults:',e.message);
    setStatus('warn','Offline mode','#fbbf24');
  });
  loadLiveElo();
  setInterval(function(){
    loadFromOpenFootball().catch(function(){});
  },5*60*1000);
  setInterval(function(){loadLiveElo();},30*60*1000);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}

</script>
