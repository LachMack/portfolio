name: Update Card Data from football-data.org

on:
  schedule:
    # Daily at 2pm AEST (4am UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch card data from football-data.org
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, time, sys, os

          TOKEN = os.environ["FD_TOKEN"]
          BASE  = "https://api.football-data.org/v4"

          # Name mapping: football-data.org team names → our sweep names
          NAME_MAP = {
              "Mexico":                  "Mexico",
              "South Africa":            "South Africa",
              "Canada":                  "Canada",
              "Bosnia and Herzegovina":  "Bosnia & Herzegovina",
              "Bosnia & Herzegovina":    "Bosnia & Herzegovina",
              "Qatar":                   "Qatar",
              "Switzerland":             "Switzerland",
              "Brazil":                  "Brazil",
              "Haiti":                   "Haiti",
              "Scotland":                "Scotland",
              "Morocco":                 "Morocco",
              "Australia":               "Australia",
              "Paraguay":                "Paraguay",
              "Türkiye":                 "Türkiye",
              "Turkiye":                 "Türkiye",
              "Turkey":                  "Türkiye",
              "United States":           "USA",
              "USA":                     "USA",
              "Ecuador":                 "Ecuador",
              "Germany":                 "Germany",
              "Côte d'Ivoire":           "Ivory Coast",
              "Ivory Coast":             "Ivory Coast",
              "Japan":                   "Japan",
              "Netherlands":             "Netherlands",
              "Sweden":                  "Sweden",
              "Tunisia":                 "Tunisia",
              "Belgium":                 "Belgium",
              "Egypt":                   "Egypt",
              "Iran":                    "Iran",
              "IR Iran":                 "Iran",
              "New Zealand":             "New Zealand",
              "Cabo Verde":              "Cape Verde",
              "Cape Verde":              "Cape Verde",
              "Saudi Arabia":            "Saudi Arabia",
              "Spain":                   "Spain",
              "Uruguay":                 "Uruguay",
              "France":                  "France",
              "Iraq":                    "Iraq",
              "Norway":                  "Norway",
              "Senegal":                 "Senegal",
              "Algeria":                 "Algeria",
              "Argentina":               "Argentina",
              "Austria":                 "Austria",
              "Jordan":                  "Jordan",
              "Colombia":                "Colombia",
              "DR Congo":                "DR Congo",
              "Congo DR":                "DR Congo",
              "Portugal":                "Portugal",
              "Uzbekistan":              "Uzbekistan",
              "Croatia":                 "Croatia",
              "England":                 "England",
              "Ghana":                   "Ghana",
              "Panama":                  "Panama",
              "Korea Republic":          "South Korea",
              "South Korea":             "South Korea",
              "Curaçao":                 "Curaçao",
              "Curacao":                 "Curaçao",
              "Czechia":                 "Czechia",
              "Czech Republic":          "Czechia",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "X-Auth-Token": TOKEN,
                  "Accept": "application/json"
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      # Respect rate limit headers
                      remaining = r.headers.get("X-RequestCounter-Reset", "")
                      data = json.loads(r.read())
                      return data
              except urllib.error.HTTPError as e:
                  if e.code == 429:
                      print("Rate limited — sleeping 60s", file=sys.stderr)
                      time.sleep(60)
                      return fetch(url)
                  print(f"HTTP error {e.code}: {url}", file=sys.stderr)
                  return None
              except Exception as e:
                  print(f"Error fetching {url}: {e}", file=sys.stderr)
                  return None

          print("Fetching all WC matches...", file=sys.stderr)
          data = fetch(f"{BASE}/competitions/WC/matches?season=2026")
          if not data:
              print("ERROR: Could not fetch matches", file=sys.stderr)
              sys.exit(1)

          matches = data.get("matches", [])
          print(f"Found {len(matches)} matches", file=sys.stderr)

          # Tally cards per team from bookings in each match
          card_totals = {}

          for m in matches:
              status = m.get("status", "")
              if status not in ("FINISHED", "IN_PLAY", "PAUSED"):
                  continue  # skip unplayed matches

              home = m.get("homeTeam", {}).get("name", "")
              away = m.get("awayTeam", {}).get("name", "")

              home_name = NAME_MAP.get(home, home)
              away_name = NAME_MAP.get(away, away)

              for name in [home_name, away_name]:
                  if name not in card_totals:
                      card_totals[name] = {"yellow": 0, "red": 0}

              # bookings[] has { minute, team: {name}, card: "YELLOW"|"RED", ... }
              for booking in m.get("bookings", []):
                  card = booking.get("card", "")
                  team_name = booking.get("team", {}).get("name", "")
                  sweep_name = NAME_MAP.get(team_name, team_name)

                  if not sweep_name or sweep_name not in card_totals:
                      card_totals.setdefault(sweep_name, {"yellow": 0, "red": 0})

                  if card == "YELLOW":
                      card_totals[sweep_name]["yellow"] += 1
                  elif card in ("RED", "YELLOW_RED"):
                      card_totals[sweep_name]["red"] += 1

              time.sleep(0.1)  # gentle pacing

          # Show results
          played = len([m for m in matches if m.get("status") == "FINISHED"])
          print(f"\n{played} finished matches processed", file=sys.stderr)
          print(f"{len(card_totals)} teams with card data", file=sys.stderr)

          sorted_teams = sorted(card_totals.items(), key=lambda x: -x[1]["yellow"])
          print("\nTop teams by yellows:", file=sys.stderr)
          for team, cards in sorted_teams[:10]:
              print(f"  {team}: {cards['yellow']}Y {cards['red']}R", file=sys.stderr)

          with open("card_totals.json", "w") as f:
              json.dump(card_totals, f, indent=2, ensure_ascii=False)
          print("\ncard_totals.json written")
          PYEOF

      - name: Update GitHub configs with card data
        env:
          GH_TOKEN: ${{ secrets.CARDS_UPDATE_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, base64, urllib.request, sys, os

          TOKEN = "${{ secrets.CARDS_UPDATE_TOKEN }}"
          REPO  = "LachMack/portfolio"

          def gh(path, method="GET", body=None):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              req = urllib.request.Request(url, method=method,
                  headers={"Authorization": f"token {TOKEN}",
                           "Accept": "application/vnd.github.v3+json",
                           "Content-Type": "application/json"})
              if body:
                  req.data = json.dumps(body).encode()
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          try:
              with open("card_totals.json") as f:
                  card_totals = json.load(f)
          except Exception as e:
              print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)

          if not card_totals:
              print("No card data — skipping update")
              sys.exit(0)

          print(f"Updating configs with card data for {len(card_totals)} teams")

          def update_config(config_path, is_daralads=False):
              print(f"\nUpdating {config_path}...")
              meta    = gh(f"contents/worldcup/{config_path}")
              sha     = meta["sha"]
              raw     = base64.b64decode(meta["content"].replace("\n","")).decode()
              config  = json.loads(raw)

              config["cardTotals"] = card_totals

              overrides = config.get("manualOverrides", {})
              awards    = config.get("manualAwards",   {})
              changed   = False

              top_yellow = max(card_totals, key=lambda t: card_totals[t]["yellow"])
              top_red    = max(card_totals, key=lambda t: card_totals[t]["red"])

              if is_daralads:
                  participants = config.get("participants", [])
                  team_owner = {}
                  for p in participants:
                      for t in (p.get("teams") or []):
                          team_owner[t] = p["name"]

                  if not overrides.get("mostYellow") and card_totals[top_yellow]["yellow"] > 0:
                      owner = team_owner.get(top_yellow)
                      if owner and awards.get("mostYellow") != owner:
                          awards["mostYellow"] = owner
                          changed = True
                          print(f"  mostYellow → {owner} ({top_yellow}: {card_totals[top_yellow]['yellow']})")

                  if not overrides.get("mostRed") and card_totals[top_red]["red"] > 0:
                      owner = team_owner.get(top_red)
                      if owner and awards.get("mostRed") != owner:
                          awards["mostRed"] = owner
                          changed = True
                          print(f"  mostRed → {owner} ({top_red}: {card_totals[top_red]['red']})")

                  if changed:
                      config["manualAwards"] = awards
              else:
                  print(f"  Top yellow: {top_yellow} ({card_totals[top_yellow]['yellow']})")
                  print(f"  Top red:    {top_red} ({card_totals[top_red]['red']})")

              new_content = base64.b64encode(
                  json.dumps(config, indent=2, ensure_ascii=False).encode()
              ).decode()
              gh(f"contents/worldcup/{config_path}", method="PUT", body={
                  "message": f"Auto: card data from football-data.org",
                  "content": new_content,
                  "sha": sha
              })
              print(f"  ✓ Done")

          update_config("wc2026-config.json",    is_daralads=False)
          update_config("daralads-config.json",  is_daralads=True)
          print("\nAll done!")
          PYEOF

      - name: Summary
        if: always()
        run: |
          if [ -f card_totals.json ]; then
            echo "=== Card totals ==="
            python3 -c "
          import json
          d=json.load(open('card_totals.json'))
          teams=sorted(d.items(),key=lambda x:-x[1]['yellow'])
          for t,s in teams[:15]:
              bar='🟨'*s['yellow']+'🟥'*s['red']
              print(f'{t:25} {s[\"yellow\"]:2}Y {s[\"red\"]:1}R  {bar}')
          "
          else
            echo "No card data generated"
          fi
