name: Update WC2026 Card Data

on:
  schedule:
    # Run every 6 hours during tournament (Jun 11 - Jul 19 2026)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run card scraper
        env:
          CONFIG_PATH: worldcup/wc2026-config.json
        run: python worldcup/update-cards.py

      - name: Commit updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worldcup/wc2026-config.json
          git diff --staged --quiet || git commit -m "Auto-update card data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
