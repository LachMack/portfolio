name: Update Card Data from Transfermarkt

on:
  schedule:
    # Run daily at 2pm AEST (4am UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch card data and update configs
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, time, sys, base64, os

          BASE = "https://transfermarkt-api.fly.dev"
          SEASON = "2026"

          # Transfermarkt national team IDs for all 48 WC2026 teams
          # Verified from transfermarkt.com URLs
          TEAMS = {
              'Mexico':      '3439',
              'South Africa':'3308',
              'Canada':      '3303',
              'Bosnia & Herzegovina': '3288',
              'Qatar':       '3341',
              'Switzerland': '3350',
              'Brazil':      '3439',
              'Haiti':       '3323',
              'Scotland':    '3346',
              'Morocco':     '3336',
              'Australia':   '3283',
              'Paraguay':    '3340',
              'Türkiye':     '3354',
              'USA':         '3356',
              'Ecuador':     '3312',
              'Germany':     '3319',
              'Ivory Coast': '3326',
              'Japan':       '3327',
              'Netherlands': '3338',
              'Sweden':      '3349',
              'Tunisia':     '3355',
              'Belgium':     '3285',
              'Egypt':       '3313',
              'Iran':        '3324',
              'New Zealand': '3337',
              'Cape Verde':  '3302',
              'Saudi Arabia':'3344',
              'Spain':       '3347',
              'Uruguay':     '3357',
              'France':      '3317',
              'Iraq':        '3325',
              'Norway':      '3339',
              'Senegal':     '3345',
              'Algeria':     '3280',
              'Argentina':   '3282',
              'Austria':     '3284',
              'Jordan':      '3328',
              'Colombia':    '3305',
              'DR Congo':    '3307',
              'Portugal':    '3342',
              'Uzbekistan':  '3358',
              'Croatia':     '3306',
              'England':     '3314',
              'Ghana':       '3320',
              'Panama':      '7601',
              'South Korea': '3348',
              'Curaçao':     '3413',
              'Czechia':     '3309',
          }

          def fetch(url, retries=3):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={
                          "Accept": "application/json",
                          "User-Agent": "Mozilla/5.0"
                      })
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      print(f"  Attempt {attempt+1} failed: {e}", file=sys.stderr)
                      time.sleep(3 * (attempt + 1))
              return None

          card_totals = {}

          for team_name, team_id in TEAMS.items():
              print(f"Fetching: {team_name} (ID: {team_id})", file=sys.stderr)

              # Get squad players
              squad = fetch(f"{BASE}/clubs/{team_id}/players?season_id={SEASON}")
              if not squad:
                  print(f"  WARNING: No squad data for {team_name}", file=sys.stderr)
                  card_totals[team_name] = {"yellow": 0, "red": 0}
                  time.sleep(2)
                  continue

              players = squad.get("players", [])
              print(f"  {len(players)} players found", file=sys.stderr)

              yellow_total = 0
              red_total = 0

              for player in players:
                  player_id = player.get("id")
                  if not player_id:
                      continue

                  # Get player stats — filter by season
                  stats = fetch(f"{BASE}/players/{player_id}/stats?season_id={SEASON}")
                  if not stats:
                      time.sleep(0.5)
                      continue

                  # Stats returns array of competition entries
                  for stat in stats.get("stats", []):
                      # Look for World Cup or national team stats in this season
                      comp = stat.get("competition", "") or ""
                      if "World Cup" in comp or "FIFA" in comp or stat.get("competitionID") in ["WC2026","FIWC","WM26"]:
                          yellow_total += int(stat.get("yellowCards", 0) or 0)
                          red_total += int(stat.get("redCards", 0) or 0)

                  # Gentle rate limiting
                  time.sleep(0.8)

              card_totals[team_name] = {"yellow": yellow_total, "red": red_total}
              print(f"  → {yellow_total}Y {red_total}R", file=sys.stderr)

              # Pause between teams
              time.sleep(2)

          print(f"\nDone: {len(card_totals)} teams processed", file=sys.stderr)
          with open("card_totals.json", "w") as f:
              json.dump(card_totals, f, indent=2)
          print("card_totals.json written")
          PYEOF

      - name: Update configs with card data
        env:
          GH_TOKEN: ${{ secrets.CARDS_UPDATE_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, base64, urllib.request, sys

          TOKEN = "${{ secrets.CARDS_UPDATE_TOKEN }}"
          REPO  = "LachMack/portfolio"

          def gh(path, method="GET", body=None):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              req = urllib.request.Request(url, method=method,
                  headers={"Authorization": f"token {TOKEN}",
                           "Accept": "application/vnd.github.v3+json",
                           "Content-Type": "application/json"})
              if body:
                  req.data = json.dumps(body).encode()
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          # Load card totals
          try:
              with open("card_totals.json") as f:
                  card_totals = json.load(f)
          except Exception as e:
              print(f"ERROR: Could not read card_totals.json: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Loaded card data for {len(card_totals)} teams")

          def update_config(config_path, is_daralads=False):
              print(f"\nUpdating {config_path}...")
              meta = gh(f"contents/worldcup/{config_path}")
              sha = meta["sha"]
              raw = base64.b64decode(meta["content"].replace("\n","")).decode()
              config = json.loads(raw)

              # Store card totals
              config["cardTotals"] = card_totals

              # Auto-assign mostYellow / mostRed if not manually overridden
              overrides = config.get("manualOverrides", {})
              awards   = config.get("manualAwards",   {})
              changed  = False

              if card_totals:
                  top_yellow = max(card_totals, key=lambda t: card_totals[t]["yellow"])
                  top_red    = max(card_totals, key=lambda t: card_totals[t]["red"])

                  if is_daralads:
                      # Daralads: match team → participant name
                      participants = config.get("participants", [])
                      team_owner = {}
                      for p in participants:
                          for t in (p.get("teams") or []):
                              team_owner[t] = p["name"]

                      if not overrides.get("mostYellow") and card_totals[top_yellow]["yellow"] > 0:
                          owner = team_owner.get(top_yellow)
                          if owner and awards.get("mostYellow") != owner:
                              awards["mostYellow"] = owner
                              changed = True
                              print(f"  mostYellow → {owner} ({top_yellow}: {card_totals[top_yellow]['yellow']})")

                      if not overrides.get("mostRed") and card_totals[top_red]["red"] > 0:
                          owner = team_owner.get(top_red)
                          if owner and awards.get("mostRed") != owner:
                              awards["mostRed"] = owner
                              changed = True
                              print(f"  mostRed → {owner} ({top_red}: {card_totals[top_red]['red']})")
                  else:
                      # Family sweep: just store totals, awards assigned manually
                      print(f"  Top yellow: {top_yellow} ({card_totals[top_yellow]['yellow']})")
                      print(f"  Top red:    {top_red} ({card_totals[top_red]['red']})")

                  if changed:
                      config["manualAwards"] = awards

              new_content = base64.b64encode(json.dumps(config, indent=2, ensure_ascii=False).encode()).decode()
              gh(f"contents/worldcup/{config_path}", method="PUT", body={
                  "message": f"Auto: update card data ({config_path})",
                  "content": new_content,
                  "sha": sha
              })
              print(f"  ✓ {config_path} updated")

          update_config("wc2026-config.json", is_daralads=False)
          update_config("daralads-config.json", is_daralads=True)
          print("\nAll done!")
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "=== Card Data Summary ==="
          if [ -f card_totals.json ]; then
            python3 -c "
          import json
          d=json.load(open('card_totals.json'))
          teams=sorted(d.items(),key=lambda x:-x[1]['yellow'])
          print('Top 10 by yellows:')
          for t,s in teams[:10]:
              print(f'  {t}: {s[\"yellow\"]}Y {s[\"red\"]}R')
          "
          else
            echo "No card_totals.json found"
          fi
