name: Update Card Data (ESPN scraper)

on:
  schedule:
    # Daily at 2pm AEST (4am UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install beautifulsoup4 requests lxml

      - name: Scrape card data from ESPN
        run: |
          python3 << 'PYEOF'
          import requests, json, sys, re
          from bs4 import BeautifulSoup

          # ESPN name → our sweep names
          NAME_MAP = {
              "United States":           "USA",
              "Ivory Coast":             "Ivory Coast",
              "Côte d'Ivoire":           "Ivory Coast",
              "Bosnia-Herzegovina":      "Bosnia & Herzegovina",
              "Bosnia and Herzegovina":  "Bosnia & Herzegovina",
              "Korea Republic":          "South Korea",
              "IR Iran":                 "Iran",
              "Türkiye":                 "Türkiye",
              "Curacao":                 "Curaçao",
              "Czech Republic":          "Czechia",
              "Cabo Verde":              "Cape Verde",
              "Congo DR":                "DR Congo",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }

          URL = "https://www.espn.com/soccer/stats/_/league/FIFA.WORLD/season/2026/view/discipline/team"

          print(f"Fetching: {URL}", file=sys.stderr)
          resp = requests.get(URL, headers=headers, timeout=30)
          print(f"Status: {resp.status_code}", file=sys.stderr)

          if resp.status_code != 200:
              print(f"ERROR: HTTP {resp.status_code}", file=sys.stderr)
              sys.exit(1)

          soup = BeautifulSoup(resp.text, "lxml")

          # ESPN renders a table with columns: RK, Team, P, YC, RC, PTS
          card_totals = {}

          # Find the stats table
          table = soup.find("table")
          if not table:
              # Try finding via class patterns ESPN uses
              tables = soup.find_all("table")
              print(f"Found {len(tables)} tables", file=sys.stderr)
              table = tables[0] if tables else None

          if not table:
              print("ERROR: No table found in page", file=sys.stderr)
              # Debug: print first 2000 chars of HTML
              print(resp.text[:2000], file=sys.stderr)
              sys.exit(1)

          rows = table.find_all("tr")
          print(f"Found {len(rows)} rows", file=sys.stderr)

          for row in rows[1:]:  # skip header
              cells = row.find_all("td")
              if len(cells) < 5:
                  continue

              # ESPN table: RK | Team | P | YC | RC | PTS
              # Sometimes RK is missing for ties, so find team by anchor tag
              team_cell = None
              for cell in cells:
                  if cell.find("a"):
                      team_cell = cell
                      break

              if not team_cell:
                  # fallback: second cell
                  team_cell = cells[1] if len(cells) > 1 else cells[0]

              team_name = team_cell.get_text(strip=True)
              team_name = NAME_MAP.get(team_name, team_name)

              # Find numeric values — YC and RC columns
              numeric_cells = [c for c in cells if c.get_text(strip=True).replace("-","").isdigit() or c.get_text(strip=True) == "-"]
              
              # ESPN order after team: P, YC, RC, PTS
              def safe_int(val):
                  v = val.strip()
                  return int(v) if v.isdigit() else 0

              if len(numeric_cells) >= 3:
                  yc = safe_int(numeric_cells[1].get_text())  # P=0, YC=1, RC=2
                  rc = safe_int(numeric_cells[2].get_text())
              elif len(numeric_cells) >= 2:
                  yc = safe_int(numeric_cells[0].get_text())
                  rc = safe_int(numeric_cells[1].get_text())
              else:
                  yc, rc = 0, 0

              if team_name:
                  card_totals[team_name] = {"yellow": yc, "red": rc}
                  print(f"  {team_name}: {yc}Y {rc}R", file=sys.stderr)

          print(f"\nScraped {len(card_totals)} teams", file=sys.stderr)

          if not card_totals:
              print("ERROR: No card data extracted", file=sys.stderr)
              sys.exit(1)

          with open("card_totals.json", "w") as f:
              json.dump(card_totals, f, indent=2, ensure_ascii=False)
          print("card_totals.json written")
          PYEOF

      - name: Update GitHub configs with card data
        env:
          GH_TOKEN: ${{ secrets.CARDS_UPDATE_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, base64, urllib.request, sys

          TOKEN = "${{ secrets.CARDS_UPDATE_TOKEN }}"
          REPO  = "LachMack/portfolio"

          def gh(path, method="GET", body=None):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              req = urllib.request.Request(url, method=method,
                  headers={"Authorization": f"token {TOKEN}",
                           "Accept": "application/vnd.github.v3+json",
                           "Content-Type": "application/json"})
              if body:
                  req.data = json.dumps(body).encode()
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          try:
              with open("card_totals.json") as f:
                  card_totals = json.load(f)
          except Exception as e:
              print(f"ERROR: {e}")
              sys.exit(1)

          if not card_totals:
              print("No card data — skipping")
              sys.exit(0)

          print(f"Updating configs with {len(card_totals)} teams")

          def update_config(config_path, is_daralads=False):
              print(f"\nUpdating {config_path}...")
              meta   = gh(f"contents/worldcup/{config_path}")
              sha    = meta["sha"]
              raw    = base64.b64decode(meta["content"].replace("\n","")).decode()
              config = json.loads(raw)

              config["cardTotals"] = card_totals

              overrides = config.get("manualOverrides", {})
              awards    = config.get("manualAwards",   {})

              # Only auto-assign if we have actual card data
              teams_with_cards = {t: v for t, v in card_totals.items() if v["yellow"] > 0 or v["red"] > 0}
              if not teams_with_cards:
                  print("  No cards recorded yet — skipping award assignment")
              else:
                  top_yellow = max(card_totals, key=lambda t: card_totals[t]["yellow"])
                  top_red    = max(card_totals, key=lambda t: card_totals[t]["red"])
                  print(f"  Top yellow: {top_yellow} ({card_totals[top_yellow]['yellow']})")
                  print(f"  Top red:    {top_red} ({card_totals[top_red]['red']})")

                  if is_daralads:
                      participants = config.get("participants", [])
                      team_owner = {t: p["name"] for p in participants for t in (p.get("teams") or [])}

                      if not overrides.get("mostYellow") and card_totals[top_yellow]["yellow"] > 0:
                          owner = team_owner.get(top_yellow)
                          if owner and awards.get("mostYellow") != owner:
                              awards["mostYellow"] = owner
                              config["manualAwards"] = awards
                              print(f"  mostYellow → {owner}")

                      if not overrides.get("mostRed") and card_totals[top_red]["red"] > 0:
                          owner = team_owner.get(top_red)
                          if owner and awards.get("mostRed") != owner:
                              awards["mostRed"] = owner
                              config["manualAwards"] = awards
                              print(f"  mostRed → {owner}")

              new_content = base64.b64encode(
                  json.dumps(config, indent=2, ensure_ascii=False).encode()
              ).decode()
              gh(f"contents/worldcup/{config_path}", method="PUT", body={
                  "message": "Auto: card data from ESPN",
                  "content": new_content,
                  "sha": sha
              })
              print(f"  ✓ {config_path} updated")

          update_config("wc2026-config.json",   is_daralads=False)
          update_config("daralads-config.json", is_daralads=True)
          print("\nDone!")
          PYEOF

      - name: Summary
        if: always()
        run: |
          if [ -f card_totals.json ]; then
            echo "=== Card totals ==="
            python3 -c "
          import json
          d=json.load(open('card_totals.json'))
          teams=sorted(d.items(),key=lambda x:-x[1]['yellow'])
          for t,s in teams[:20]:
              if s['yellow']>0 or s['red']>0:
                  print(f'{t:25} {s[\"yellow\"]:2}Y {s[\"red\"]}R')
          print(f'\nTotal teams: {len(d)}')
          "
          else
            echo "No card_totals.json found"
          fi
