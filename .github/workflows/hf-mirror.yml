name: Import from Hugging Face (manual)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public URL to fetch (e.g. resolved blog.html)"
        required: true
      path:
        description: "Repo file path to overwrite (e.g. blog.html)"
        required: true

jobs:
  pull-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download file
        run: |
          curl -L "${{ inputs.url }}" -o _import.tmp

      - name: Commit to staging
        run: |
          git checkout -B staging
          mv _import.tmp "${{ inputs.path }}"
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.path }}"
          git commit -m "Import from HF: ${{ inputs.path }}"
          git push -f origin staging

      - name: Open PR from staging to main
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: staging
          title: "Import from HF → ${{ inputs.path }}"
          body: "Manually imported from Hugging Face. Review diffs & preview before merge."
          commit-message: "Import from HF"
